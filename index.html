     1. This environment forbids every browser storage API outright — a page
        that touches one is rejected before it ever runs.
     2. This file's own runSelfTest() contains an assertion that scans the
        whole document for exactly that API name and fails if it finds it,
        and keeping every existing test green is a hard requirement.

   So the board lives in G.lb for the life of the page: it survives deaths,
   sector changes, endless mode and returning to the title screen, but not a
   reload.  COPY SCORE is the escape hatch — it puts the whole table on the
   clipboard as text so a run can be pasted somewhere that does persist.
   If you host this file over http(s) and lift the restriction, the only
   change needed is a save/load pair either side of lbSubmit().            */
var LB_MAX=10, LB_NAME=8;
var NAMEROWS=["ABCDEFGHIJKLM","NOPQRSTUVWXYZ","0123456789"];
function lbQualify(sc){
  if(!(sc>0)) return false;
  if(G.lb.length<LB_MAX) return true;
  return sc>G.lb[G.lb.length-1].score;
}
function lbSubmit(name){
  var nm=(name||"").toUpperCase().replace(/[^A-Z0-9 .\-]/g,"").replace(/\s+$/,"");
  if(!nm) nm="DOGELON";
  nm=nm.slice(0,LB_NAME);
  var row={name:nm, score:G.score, sec:sectorNo(G.lv), kills:G.kills,
           combo:G.maxCombo, dist:Math.round(G.dist)};
  G.lb.push(row);
  G.lb.sort(function(a,b){ return b.score-a.score; });
  if(G.lb.length>LB_MAX) G.lb.length=LB_MAX;
  G.lbNew=-1;
  for(var i=0;i<G.lb.length;i++) if(G.lb[i]===row){ G.lbNew=i; break; }
  G.nameOpen=false; G.nameBuf=""; G.lbPosted=true;
  SFX.clear(); flashIt("#ffd27a",0.2);
  toast("POSTED — "+nm+"  "+row.score);
}
function openBoard(from){
  G.boardFrom = from || G.state;
  G.state="BOARD"; G.timer=0; G.copied=0; G.nameBuf="";
  /* only offer the keyboard when there is actually an unposted run to post */
  G.nameOpen = (G.boardFrom==="OVER"||G.boardFrom==="WIN") &&
               !G.lbPosted && lbQualify(G.score);
}
function closeBoard(){ G.nameOpen=false; G.state=G.boardFrom||"TITLE"; }
function lbText(){
  var L=["DOGELON: MARS PROTOCOL — leaderboard"];
  if(!G.lb.length) L.push("(nothing posted yet)");
  for(var i=0;i<G.lb.length;i++){
    var r=G.lb[i];
    L.push((i+1)+". "+r.name+"  "+r.score+" pts  sector "+r.sec+"  "+
           r.kills+" kills  best combo x"+r.combo+"  "+r.dist+"m");
  }
  L.push("this run: "+G.score+" pts, "+G.kills+" kills, "+
         Math.round(G.dist)+"m, difficulty "+DIFFS[G.diff].name);
  return L.join("\n");
}
function lbCopy(){
  var s=lbText();
  function ok(){ G.copied=1.8; toast("LEADERBOARD COPIED"); }
  function no(){ G.copied=-1.8; toast("CLIPBOARD BLOCKED — screenshot instead"); }
  /* the async clipboard needs a secure context, which a file:// page is not,
     so the failure path is the expected one when opened by double-click     */
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      var pr=navigator.clipboard.writeText(s);
      if(pr&&pr.then) pr.then(ok,no); else ok();
    } else no();
  }catch(e){ no(); }
}
/* ---------- 27d. canvas tap targets ----------------------------------
   The trivia buttons and the name grid have to work on a phone, and adding
   real DOM buttons would mean laying them out against the letterboxed
   canvas.  Instead every menu screen registers its hit rectangles in
   virtual (1280x720) coordinates as it draws, and one pointer handler maps
   the touch back through the canvas rect and dispatches.  The list is
   rebuilt each frame, so it can never point at a stale screen.            */
function tapZone(x,y,w,h,act){ G.taps.push({x:x,y:y,w:w,h:h,act:act}); }
function tapScreen(vx,vy){
  for(var i=G.taps.length-1;i>=0;i--){
    var z=G.taps[i];
    if(vx>=z.x&&vx<=z.x+z.w&&vy>=z.y&&vy<=z.y+z.h){ z.act(); return true; }
  }
  return false;
}
function cvPoint(cx,cy){
  var r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return null;
  return {x:(cx-r.left)/r.width*VW, y:(cy-r.top)/r.height*VH};
}
/* The in-fight sibling of pointerMenu.  It shares the tap list but NEVER falls
   through to advanceState() — a stray tap on the play field has to stay a
   trigger pull, not a state change.  During PLAY / BOSS the only things that
   register zones are the ordnance tiles (renderOrdHUD), so a hit here is
   unambiguous.  Returns true only when a tile actually consumed the press. */
function pointerHud(cx,cy){
  if(G.state!=="PLAY"&&G.state!=="BOSS") return false;
  var p=cvPoint(cx,cy);
  if(!p) return false;
  return tapScreen(p.x,p.y);
}
function pointerMenu(cx,cy){
  var p=cvPoint(cx,cy);
  if(p&&tapScreen(p.x,p.y)) return true;
  /* a miss on the board must not deploy a level out from under the player */
  if(G.state==="BOARD") return true;
  /* and a miss in the armoury must not skip the sector you are shopping for —
     it closes the screen, which is what a tap outside a panel should do.   */
  if(G.state==="SHOP"){ closeShop(); return true; }
  advanceState(); return true;
}
function advanceState(){
  var s=G.state;
  if(s==="TITLE"){ unlockAudio(); G.endless=false; freshRun(); startLevel(0); return; }
  if(s==="SELECT"){ unlockAudio(); G.endless=false; freshRun();
                    startLevel(G.selIdx); return; }
  if(s==="INTRO"){ G.state="PLAY"; return; }
  if(s==="DEAD"){ respawn(); return; }
  if(s==="CLEAR"){
    /* the trivia card sits between the payout and the next briefing, so
       skipping CLEAR early lands on the question rather than on the level */
    if(trivAvailable()){ startTrivia(); return; }
    nextSector(); return;
  }
  if(s==="TRIVIA"){ nextSector(); return; }
  if(s==="BOARD"){ return; }        /* BOARD owns its own keys — see onKey */
  if(s==="OVER"){ freshRun(); startLevel(G.lvIdx); return; }
  if(s==="WIN"){ G.best=Math.max(G.best,G.score);
    G.endless=true; freshRun(); startLevel(endlessIdx());
    toast("ENDLESS — how far can you get?"); return; }
}
function toTitle(){
  G.best=Math.max(G.best,G.score);
  G.state="TITLE"; G.endless=false; G.lvIdx=0; G.lv=LEVELS[0];
  /* quitting mid-ride would otherwise leave Dogelon mounted on the title
     screen with the SLIDE key still labelled BLADE — resetRun does not touch
     the mount, so clear it explicitly                                     */
  dismountRover();
  resetRun(false); stopSynthMusic();
}
function clearLevel(){
  if(G.state!=="PLAY") return;
  G.state="CLEAR"; G.timer=0;
  if(G.lv.bonus){
    /* bonus payout scales with the ride, not with lives held back */
    var ride=G.crushes*RIDE_BONUS*2;
    G.score += 1200 + ride;
    G.rideBest=Math.max(G.rideBest,G.crushes);
    toast("ROVER RUN CLEAR  ·  "+G.crushes+" CRUSHED  ·  +"+(1200+ride));
    /* the ride gets its own payoff: a gold burst and the count thrown up
       in 48px so the number you earned is the thing you actually look at */
    for(var b=0;b<60;b++)
      spawnPart(player.x+rnd(-5,5),rnd(0.4,5),player.z+rnd(3,26),rnd(-14,14),
        rnd(6,22),rnd(-8,18),rnd(0.5,1.4),
        pick(["#ffcf4a","#ffd27a","#ff7a2a","#fff6cc"]),rnd(0.8,2.2),1);
    pops.push({x:player.x,y:3.4,z:player.z+9,txt:G.crushes+" CRUSHED!",
               t:2.0,T:2.0,col:"#ffcf4a",sz:48});
  } else {
    G.score += 2500 + G.lives*750;
    toast(sectorTag(G.lv)+" CLEAR");
  }
  SFX.clear();
  flashIt("#ffffff",0.45);
  for(var i=0;i<70;i++)
    spawnPart(player.x+rnd(-4,4),rnd(0.5,4),player.z+rnd(2,20),rnd(-8,8),
      rnd(4,16),rnd(-6,14),rnd(0.5,1.3),pick(["#fff","#ffd27a","#8fe6a0"]),rnd(0.6,1.6),1);
}
function triggerBoss(){
  if(boss) return;
  /* buildArena() FIRST: it sets G.arena and G.arenaZ0, and makeBoss() reads
     both to pick the 2000 hp / hold-station loadout.  Order matters.      */
  buildArena();
  boss=makeBoss(); G.state="BOSS"; G.bossIntro=1.6;
  ents.length=0; ebullets.length=0;
  /* the fight pins pitch and distance (below); a player 4 units up in the jet
     would sit outside that framing, so any flight in progress is grounded as
     the Kaiju arrives.  The director does not spawn jets on sector 5 either. */
  if(player && (player.jet>0||player.jetDown>0)) endJet(true);
  /* and it is fought on foot: the plough rover has no cover behaviour and its
     hitbox is twice Dogelon's, so the mount is left at the colonnade mouth */
  if(player && player.riding) dismountRover();
  SFX.roar(); shakeIt(30); flashIt("#ff2a4a",0.5); slowmo(0.5);
  /* NO camPreset(3) here.  The TOWER preset pitches the camera down hard and
     pulls it back, which is exactly wrong for a 28-unit monster: it put the
     Kaiju's feet in frame and its head off the top.  updateCam() now clamps
     pitch 0.08 / dist 10.0 for the whole BOSS state instead.               */
  toast("THE SIEGE OF THE RED COLONNADE");
}
/* ---------- 28. key handling ------------------------------------ */
/* called by the keydown listener above with the raw KeyboardEvent.code */
function onKey(c){
  unlockAudio();                     /* any keypress counts as a gesture */
  if(G.lab){
    if(c==="ArrowDown") G.labSel=(G.labSel+1)%LABKEYS.length;
    if(c==="ArrowUp")   G.labSel=(G.labSel+LABKEYS.length-1)%LABKEYS.length;
    if(c==="ArrowRight")labReslice(1,0);
    if(c==="ArrowLeft") labReslice(-1,0);
    if(c==="BracketRight") labReslice(0,1);
    if(c==="BracketLeft")  labReslice(0,-1);
    if(c==="KeyR") { var d=labSheet(); if(d.img) sliceSheet(d); }
    return;
  }
  if(c==="F2"){ if(G.tests) G.tests=null; else runSelfTest(); return; }
  /* BOARD and TRIVIA are intercepted here, ahead of every global shortcut:
     otherwise typing a name would toggle Music on M, cycle the camera on C
     and open the grip menu on F, and answering "C" in trivia would do the
     same.  Both blocks swallow anything they do not use.                  */
  if(G.state==="BOARD"){
    if(G.nameOpen){
      if(/^Key[A-Z]$/.test(c)){ nameType(c.slice(3)); return; }
      if(/^(Digit|Numpad)[0-9]$/.test(c)){ nameType(c.slice(-1)); return; }
      if(c==="Space"){ nameType(" "); return; }
      if(c==="Backspace"||c==="Delete"){ G.nameBuf=G.nameBuf.slice(0,-1); return; }
      if(c==="Enter"||c==="NumpadEnter"){ lbSubmit(G.nameBuf); return; }
      if(c==="Escape"){ G.nameOpen=false; return; }
      return;
    }
    if(c==="KeyC"){ lbCopy(); return; }
    if(c==="Escape"||c==="KeyT"||c==="KeyB"||c==="Enter"||c==="NumpadEnter"||
       c==="Space"){ closeBoard(); return; }
    return;
  }
  if(G.state==="TRIVIA"){
    var ai=-1;
    if(c==="KeyA") ai=0; else if(c==="KeyB") ai=1;
    else if(c==="KeyC") ai=2; else if(c==="KeyD") ai=3;
    else if(/^(Digit|Numpad)[1-4]$/.test(c)) ai=+c.slice(-1)-1;
    if(ai>=0){ answerTrivia(ai); return; }
    /* O has to be handled INSIDE this block, because the block swallows every
       key it does not use — and the moment you have just been paid is exactly
       when you want the armoury.  Only after answering, so it can never be
       used to duck the clock.                                              */
    if(c==="KeyO"&&G.trivPick>=0){ openShop("TRIVIA"); return; }
    if(c==="Enter"||c==="NumpadEnter"||c==="Space"){ nextSector(); return; }
    if(c==="KeyP"||c==="Escape"){ nextSector(); return; }
    return;
  }
  /* the armoury gets the same treatment for the same reason: UP/DOWN move the
     selection, ENTER buys, and M / C / F must not fire underneath it.      */
  if(G.state==="SHOP"){
    if(c==="ArrowUp"||c==="KeyW")   { shopMove(-1); return; }
    if(c==="ArrowDown"||c==="KeyS") { shopMove(1);  return; }
    if(c==="ArrowLeft")  { shopMove(-1); return; }
    if(c==="ArrowRight") { shopMove(1);  return; }
    if(/^(Digit|Numpad)[1-9]$/.test(c)){
      var si=+c.slice(-1)-1;
      if(si<ARMS.length){ G.shopIdx=si; buyItem(si); }
      return;
    }
    if(c==="Enter"||c==="NumpadEnter"||c==="Space"){ buyItem(G.shopIdx); return; }
    if(c==="KeyO"||c==="Escape"||c==="KeyP"||c==="Tab"){ closeShop(); return; }
    return;
  }
  /* O opens the armoury anywhere it is legal — which is everywhere the world
     is already still.  In PLAY / BOSS it says so instead of freezing you.  */
  if(c==="KeyO"){
    if(openShop()) return;
    if(G.state==="PLAY"||G.state==="BOSS"){
      SFX.deny(); toast("PAUSE FIRST [P] — THEN [O] FOR THE ARMOURY"); return;
    }
    return;
  }
  /* the two weapons.  Guarded on state inside throwBomb / fireMissile, so a
     stray B on the title screen is inert rather than an error.             */
  if((G.state==="PLAY"||G.state==="BOSS")&&c==="KeyB"){ throwBomb(); return; }
  if((G.state==="PLAY"||G.state==="BOSS")&&c==="KeyV"){ fireMissile(); return; }
  if(c==="KeyB"&&(G.state==="TITLE"||G.state==="OVER"||G.state==="WIN")){
    openBoard(G.state); return; }
  if(c==="KeyM"){ musicToggle(); return; }
  if(c==="KeyN"){ fMusic.click(); return; }
  if(c==="Period"){ nextTrack(); return; }     /* ".": skip to the next track */
  if(c==="KeyC"){ camPreset((cam.mode+1)%CAMS.length); toast("CAM "+CAMS[cam.mode].name); return; }
  if(c==="Digit1"||c==="Digit2"||c==="Digit3"||c==="Digit4"){
    camPreset(+c.slice(5)-1); toast("CAM "+CAMS[cam.mode].name); return; }
  if(c==="KeyH"){ G.showHelp=!G.showHelp; return; }
  /* G cycles which sheet is used for the firing pose.  I can't see the art,
     so this lets you pick the one that looks right instead of me guessing. */
  if(c==="KeyG"){
    G.poseIdx=(G.poseIdx+1)%POSES.length;
    toast("SHOOT POSE: "+(POSES[G.poseIdx]==="backwalk"?"none (blaster only)"
                                                       :POSES[G.poseIdx]));
    return;
  }
  /* F cycles where the blaster is gripped.  The spec's standing anchor is
     0.72 above the feet, which on a 2.35-unit Dogelon is thigh height, not
     hand height (seated it asks for 0.95 on a 1.62 rider = 59%).  HAND is
     the default because it is what you asked for; CHEST and SHOULDER are
     here so you can pick the one that lines up with the art. */
  if(c==="KeyF"){
    G.gripIdx=(G.gripIdx+1)%GRIPS.length;
    toast("GRIP: "+GRIPS[G.gripIdx].name);
    return;
  }
  /* F3 / comma cycles difficulty; takes effect on the next sector start */
  if(c==="F3"||c==="Comma"){
    G.diff=(G.diff+1)%DIFFS.length;
    toast("DIFFICULTY: "+DIFFS[G.diff].name);
    return;
  }
  /* --- per-state --- */
  if(G.state==="TITLE"){
    if(c==="KeyL"){ G.state="SELECT"; G.selIdx=0; return; }
    if(c==="KeyE"){ unlockAudio(); G.endless=true; freshRun();
                    startLevel(endlessIdx()); toast("ENDLESS MODE"); return; }
    if(c==="Enter"||c==="Space"||c==="NumpadEnter") advanceState();
    return;
  }
  if(G.state==="SELECT"){
    if(c==="ArrowRight") G.selIdx=(G.selIdx+1)%LEVELS.length;
    if(c==="ArrowLeft")  G.selIdx=(G.selIdx+LEVELS.length-1)%LEVELS.length;
    if(c==="Enter"||c==="Space") advanceState();
    if(c==="KeyT"||c==="Escape") G.state="TITLE";
    return;
  }
  if(c==="KeyP"||c==="Escape"){
    if(G.state==="PLAY"||G.state==="BOSS"){ G.pausedState=G.state; G.state="PAUSE"; return; }
    if(G.state==="PAUSE"){ G.state=G.pausedState||"PLAY"; return; }
  }
  if(G.state==="PAUSE"){ if(c==="KeyT") toTitle(); return; }
  if(c==="KeyT"&&(G.state==="OVER"||G.state==="WIN")){ toTitle(); return; }
  if(c==="KeyL"&&(G.state==="OVER"||G.state==="WIN")){ G.state="SELECT"; G.selIdx=0; return; }
  if(c==="Enter"||c==="NumpadEnter"||(c==="Space"&&G.state!=="PLAY"&&G.state!=="BOSS")){
    if(G.state!=="PLAY"&&G.state!=="BOSS") advanceState();
  }
}
/* ---------- 29. file loading (soundtrack + sprite sheets) -------- */
var fMusic=document.getElementById("fMusic"),
    fSprite=document.getElementById("fSprite"),
    dropEl=document.getElementById("drop");
function adoptSpriteFiles(files){
  var n=0;
  for(var i=0;i<files.length;i++){
    var f=files[i]; if(!/\.png$/i.test(f.name)) continue;
    var key=null;
    for(var k in SHEETS)
      if(SHEETS[k].file.toLowerCase()===f.name.toLowerCase()){ key=k; break; }
    if(!key) continue;
    (function(def,file){
      var img=new Image();
      img.onload=function(){
        def.img=img; def.w=img.naturalWidth; def.h=img.naturalHeight;
        def.missing=false; def.keyed=false; def.keyFailed=false;
        keyIfNeeded(def);          /* blob URLs are same-origin, so the white
                                      key actually succeeds on this path even
                                      when the page itself is on file://    */
        sliceSheet(def);
      };
      img.src=URL.createObjectURL(file);
    })(SHEETS[key],f);
    n++;
  }
  if(n) toast(n+" sheet"+(n>1?"s":"")+" loaded — auto-trim enabled");
  else  toast("no matching PNG names found");
}
function handleFiles(files){
  var au=[],px=[];
  for(var i=0;i<files.length;i++){
    if(/\.png$/i.test(files[i].name)) px.push(files[i]);
    else au.push(files[i]);
  }
  if(px.length) adoptSpriteFiles(px);
  if(au.length) loadMusicFiles(au);
}
fMusic.addEventListener("change",function(){ if(this.files.length) loadMusicFiles(this.files); });
fSprite.addEventListener("change",function(){ if(this.files.length) adoptSpriteFiles(this.files); });
document.getElementById("bMusic").addEventListener("click",function(e){
  e.preventDefault(); fMusic.click(); });
document.getElementById("bSprites").addEventListener("click",function(e){
  e.preventDefault(); fSprite.click(); });
/* ---- fullscreen, with an honest iOS path ------------------------------
   Chrome/Edge/Firefox (desktop and Android) implement the Fullscreen API on
   ordinary elements.  iOS Safari does not — it only ever allowed it for
   <video> — so there the button falls back to "fill the viewport", which
   with the safe-area padding removed is as close as the browser permits.
   Launching from an Add-to-Home-Screen icon is the real full screen there. */
var iosLike = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function fsActive(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement);
}
function applyFsClass(){
  var on = fsActive() || document.body.classList.contains("fspoly") ||
           (window.navigator.standalone===true) ||
           (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches);
  document.body.classList.toggle("fs",!!on);
  fitStage();
}
document.getElementById("bFull").addEventListener("click",function(e){
  e.preventDefault();
  var st=document.getElementById("stage"), q=null;
  var canReal = !!(st.requestFullscreen||st.webkitRequestFullscreen) && !iosLike;
  if(!canReal){
    /* viewport-fill fallback: no browser API involved, so it cannot fail */
    document.body.classList.toggle("fspoly");
    applyFsClass();
    toast(document.body.classList.contains("fspoly")
      ? "FILL SCREEN — add to home screen for true fullscreen"
      : "WINDOWED");
    return;
  }
  if(fsActive()){
    q = document.exitFullscreen ? document.exitFullscreen()
      : (document.webkitExitFullscreen && document.webkitExitFullscreen());
  } else if(st.requestFullscreen){ q=st.requestFullscreen();
  } else { st.webkitRequestFullscreen(); }
  /* a refused fullscreen request rejects its promise; unhandled, that trips
     the window-level rejection handler and paints the crash overlay       */
  if(q && q["catch"]) q["catch"](function(){ toast("fullscreen refused"); });
});
document.addEventListener("webkitfullscreenchange",function(){ setTimeout(applyFsClass,60); });
/* an installed home-screen launch reports display-mode: fullscreen, so react
   to that too — Safari 16 and below has no addEventListener on MediaQueryList */
if(window.matchMedia){
  var mqFs=window.matchMedia("(display-mode: fullscreen)");
  if(mqFs.addEventListener) mqFs.addEventListener("change",applyFsClass);
  else if(mqFs.addListener)  mqFs.addListener(applyFsClass);
}
applyFsClass();
["dragenter","dragover"].forEach(function(ev){

["dragleave","dragend"].forEach(function(ev){

/* ---------- 30. responsive letterbox (phone → desktop) ---------- */
var stageEl=document.getElementById("stage"), rotEl=document.getElementById("rot");
var ASPECT=VW/VH;
function fitStage(){
  /* DOM refs are resolved lazily and defensively.  applyFsClass() is called
     during section 29, which is *before* the var below it is assigned — a
     hoisted-but-undefined stageEl threw here and took the whole boot with it,
     including requestAnimationFrame(frame).  Never assume load order.      */
  if(!stageEl) stageEl=document.getElementById("stage");
  if(!rotEl)   rotEl  =document.getElementById("rot");
  if(!stageEl) return;
  var w=window.innerWidth, h=window.innerHeight;
  /* #wrap carries the notch safe-area as padding, so measure its content box
     rather than the raw window — otherwise a notched iPhone in landscape
     pushes the stage a few dozen pixels off the right edge                 */
  var wrapEl=document.getElementById("wrap");
  if(wrapEl && window.getComputedStyle){
    var cs=window.getComputedStyle(wrapEl);
    var pl=parseFloat(cs.paddingLeft)||0, pr=parseFloat(cs.paddingRight)||0;
    var pt2=parseFloat(cs.paddingTop)||0, pb=parseFloat(cs.paddingBottom)||0;
    w=Math.max(120,w-pl-pr); h=Math.max(80,h-pt2-pb);
  }
  /* leave a hair of breathing room on desktop, use everything on phones —
     and everything, full stop, once fullscreen or fill-screen is engaged */
  var pad = (document.body.classList.contains("fs") || w<620) ? 0 : 10;
  var aw=w-pad*2, ah=h-pad*2;
  var sw=aw, sh=Math.round(aw/ASPECT);
  if(sh>ah){ sh=ah; sw=Math.round(ah*ASPECT); }
  stageEl.style.width=sw+"px";
  stageEl.style.height=sh+"px";
  /* nudge the player to rotate only when the window is clearly portrait */
  var portrait = h>w*1.05;
  if(rotEl) rotEl.style.display = (portrait && ("ontouchstart" in window)) ? "flex" : "none";
  /* the backing store stays at render resolution; CSS scales it to the
     stage, so one code path covers a 4K monitor and a 360px phone */
  if(cv.width!==VW){ cv.width=VW; cv.height=VH; ctx.imageSmoothingEnabled=false; }
}
window.addEventListener("resize",fitStage);
window.addEventListener("orientationchange",function(){ setTimeout(fitStage,120); });
document.addEventListener("fullscreenchange",function(){ setTimeout(applyFsClass,60); });
fitStage();
/* ---------- 31. main loop --------------------------------------- */
var last=0, acc=0, fps=60, fpsAcc=0, fpsN=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!last) last=now;
  var raw=(now-last)/1000; last=now;
  if(raw>0.25) raw=0.25;                 // tab was hidden: don't teleport
  fpsAcc+=raw; fpsN++;
  if(fpsAcc>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  G.frameNo++;
  /* slow-motion + hit-stop */
  if(G.slowT>0){ G.slowT-=raw; G.timeScale=approach(G.timeScale,0.34,3.2,raw); }
  else G.timeScale=approach(G.timeScale,1,2.2,raw);
  if(G.hitStop>0){ G.hitStop-=raw; }
  var dt=raw*G.timeScale*(G.hitStop>0?0.12:1);
  G.t+=raw; G.timer+=raw;
  syncPadLabels();
  /* Substep the simulation.  Contacts are point-sampled against a ~4.4 m
     window, and ROVER RUN peaks near 83 m/s, so one catch-up step of 0.25 s
     would carry the player clean through everything ahead of him.  Capping
     each step at 1/45 s means nothing changes at 60 fps (dt is already
     smaller) while a stuttering phone still registers its hits.           */
  var MAXSTEP=1/45, nStep=1;
  if(dt>MAXSTEP) nStep=Math.min(6,Math.ceil(dt/MAXSTEP));
  var sdt=dt/nStep, sraw=raw/nStep;
  for(var si=0;si<nStep;si++) step(sdt,sraw);
  draw();
}
/* The touch pad is HTML, not canvas, so its caption has to be pushed rather
   than drawn.  Only touched when the state actually flips.                */
var _padRide=null;
function syncPadLabels(){
  var r=!!(player&&player.riding&&!player.dead);
  if(_padRide===r) return;
  _padRide=r;
  var el=document.getElementById("pSlide");
  if(!el) return;
  el.textContent = r?"BLADE":"SLIDE";
  el.style.color = r?"#ffcf4a":"";
  el.style.borderColor = r?"#ffcf4a":"";
}
function step(dt,raw){
  readInput();
  updateMusic(raw);
  /* decay shake / flash on real time so they never stall in slow-mo */
  G.shake=approach(G.shake,0,42,raw);
  G.flash=approach(G.flash,0,2.1,raw);
  if(G.toastT>0) G.toastT-=raw;
  if(G.msgT>0) G.msgT-=raw;
  var s=G.state;
  /* the Sprite Lab hides the world, so the sim must halt with it — otherwise
     the director keeps spawning and the arrow keys drive Dogelon blind      */
  if(G.lab){ pressed={}; return; }
  if(s==="LOAD"){
    if(assetsPending && assetsDone>=assetsPending){
      G.state="TITLE"; player=makePlayer(); buildProps();
      /* Missing-sheet accounting stays internal.  It is still visible in the
         Sprite Lab (F1) where it is a tool, but the title screen is a shop
         window and never advertises the renderer's plumbing.              */
      startSynthMusic();
    }
    /* hard timeout so a hung image can never wedge the title screen */
    if(G.t>9 && G.state==="LOAD"){ G.state="TITLE"; player=makePlayer(); buildProps();
      startSynthMusic(); }
    updateCam(raw,player,0);
    pressed={}; return;
  }
  if(s==="TITLE"||s==="SELECT"){
    /* idle demo camera drift so the title screen breathes */
    /* drawPlayer picks the walk frame off .bob, not .anim — driving the
       wrong field left the title-screen hero sliding along frozen        */
    if(player){ player.z+=raw*10; player.bob+=raw*6; updateCam(raw,player,0.3); }
    updateProps(raw); updateFx(raw); pressed={}; return;
  }
  if(s==="PAUSE"){ pressed={}; return; }
  /* the armoury is an inventory screen, so it freezes the world exactly the
     way PAUSE does.  It can only ever be entered from a state that was
     already still (see shopAllowed) — never from PLAY or BOSS.           */
  if(s==="SHOP"){ pressed={}; return; }
  if(s==="BOARD"){
    /* keep the world breathing behind the panel, but only drive the hero when
       we came in off the title screen — arriving from MISSION FAILED means he
       is face down on the sand and should stay there                        */
    if(player && G.boardFrom==="TITLE"){ player.z+=raw*10; player.bob+=raw*6; }
    updateCam(raw,player,0.2); updateProps(raw); updateFx(raw);
    if(G.copied>0) G.copied=Math.max(0,G.copied-raw);
    else if(G.copied<0) G.copied=Math.min(0,G.copied+raw);
    pressed={}; return;
  }
  if(s==="TRIVIA"){
    /* the sector keeps rolling under the card, so the cut reads as a breath
       rather than a freeze frame */
    if(player){ player.z+=levelSpeed()*0.30*dt; player.bob+=dt*4; }
    updateProps(dt); updateFx(dt); updateCam(raw,player,0.15);
    if(G.trivPick>=0){ G.trivT+=raw; if(G.trivT>TRIV_HOLD) nextSector(); }
    else if(G.timer>TRIV_TIME) nextSector();
    pressed={}; return;
  }
  if(s==="INTRO"){
    updatePlayer(dt); updateProps(dt); updateCam(raw,player,0.4); updateFx(dt);
    if(G.timer>2.4) G.state="PLAY";
    pressed={}; return;
  }
  if(s==="DEAD"){
    updateFx(dt); updateEnts(dt); updateProps(dt); updateCam(raw,player,0.2);
    player.deadT+=dt;
    if(G.timer>1.5 && (IN.fire||IN.jump||pressed.Enter||pressed.Space||touch.fire)) respawn();
    if(G.timer>4.0) respawn();
    pressed={}; return;
  }
  if(s==="OVER"||s==="WIN"||s==="CLEAR"){
    updateFx(dt); updateProps(dt); updateCam(raw,player,0.15);
    if(s==="CLEAR"){
      player.z+=levelSpeed()*0.45*dt;
      /* gravity only, no input: this is what lets an ejectRider() tumble
         play out instead of freezing Dogelon mid-air the frame the ride ends */
      if(!player.onGround){
        player.vy-=GRAV*dt; player.y+=player.vy*dt;
        if(player.y<=0){ player.y=0; player.vy=0; player.onGround=true; }
      }
      /* three seconds of payout, then the trivia card comes up on its own.
         ENTER / TAP during CLEAR jumps straight to it (see advanceState). */
      if(G.timer>3.0 && trivAvailable()) startTrivia();
    }
    pressed={}; return;
  }
  /* ---- PLAY / BOSS ---- */
  updatePlayer(dt);                       /* updatePlayer() drives updateFiring() */
  if(s==="PLAY") director(dt);
  updateEnts(dt);
  updateBullets(dt);
  updateOrd(dt);              /* charges + missiles — see section 20b */
  updatePickups(dt);
  updateProps(dt);
  updateFx(dt);
  sectorAmbient(dt);          /* ASHFALL RIFT embers — see section 15b */
  if(boss){ updateBoss(dt); updateRingsHarm(); }
  updateCam(raw,player,clamp(player.speed/60,0,1.2));
  /* combo decay */
  if(G.comboT>0){ G.comboT-=raw; if(G.comboT<=0) G.combo=0; }
  /* progress → boss / sector clear */
  if(s==="PLAY"){
    if(G.lv.boss){ if(G.dist>140 && !boss) triggerBoss(); }
    else if(!G.endless && G.dist>=G.lv.len) clearLevel();
  }
  pressed={};
}
function draw(){
  if(G.lab){ renderLab(); return; }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  renderSky();          /* renderSky() draws the mountains  */
  /* THE SIEGE's skyline goes in between: behind the floor, in front of the
     mountain fbm, so the colonnade reads as a structure standing ON Mars.  */
  if(G.arena) renderArenaBackdrop(horizonY());
  renderGround();       /* renderGround() draws the road    */
  /* per-sector scenery: on top of the flats, under anything you can shoot */
  renderSectorFx(player?player.z:0, horizonY());
  if(G.arena) renderArenaMarks(player?player.z:0);
  renderProps();
  renderRings();
  buildDrawList();
  renderDrawList();
  renderPops();
  renderPost();
  /* Rebuilt every frame by whichever screen is up, so a tap can never hit a
     button that has already scrolled off (see tapZone / pointerMenu).
     THIS MUST STAY ABOVE renderHUD().  It used to sit below it, which was
     harmless while only the menus registered zones — but the ordnance tiles
     are drawn by renderHUD(), and clearing afterwards wiped them in the same
     frame they were added, leaving pointerHud() nothing to hit.           */
  G.taps.length=0;
  if(G.state==="PLAY"||G.state==="BOSS"||G.state==="INTRO"||G.state==="DEAD"){
    renderReticle();
    renderRadar();
    renderHUD();
  }
  switch(G.state){
    case "LOAD":   screenLoad();   break;
    case "TITLE":  screenTitle();  break;
    case "SELECT": screenSelect(); break;
    case "INTRO":  screenIntro();  break;
    case "CLEAR":  screenClear();  break;
    case "TRIVIA": screenTrivia(); break;
    case "SHOP":   screenShop();   break;
    case "BOARD":  screenBoard();  break;
    case "DEAD":   screenDead();   break;
    case "OVER":   screenOver();   break;
    case "WIN":    screenWin();    break;
    case "PAUSE":  screenPause();  break;
  }
  if(G.tests) renderTests();
  if(G.showHelp&&(G.state==="PLAY"||G.state==="BOSS")) renderHint();
  if(G.frameNo<4) ctx.imageSmoothingEnabled=false;
}
function renderHint(){
  /* the jet prompt has to jump the distance gate below — the pickup does not
     even spawn until 55% of the sector is behind you.  Three seconds only,
     so it does not nag for the whole flight.                              */
  if(player && player.jet>JET_TIME-3.2){
    ctx.save(); ctx.globalAlpha=0.9*clamp((player.jet-(JET_TIME-3.2))/0.5+0.4,0,1);
    txt("DOGELON JET  —  TRIPLE SHOT  ·  ← → TO BANK  ·  YOU FLY OVER THE GATES",
        VW*0.5,VH*0.24,14,"#ffd27a","center");
    ctx.restore(); return;
  }
  if(G.dist>180) return;                    // fades out once you're rolling
  var a=clamp(1-(G.dist-120)/60,0,1);
  ctx.save(); ctx.globalAlpha=a*0.9;
  if(player&&player.riding)
    txt("HOLD ↓ = PLOUGH BLADE (x2)     RUN THEM OVER     SPACE / X = SHOOT     ↑ = JUMP",
        VW*0.5,VH*0.24,14,"#ffcf4a","center");
  else
    txt("SPACE / X / CLICK  = SHOOT     ↓ = SLIDE     ↑ = JUMP     C = CAMERA",
        VW*0.5,VH*0.24,14,"#ffe6a0","center");
  ctx.restore();
}
/* ---------- 32. boot -------------------------------------------- */
/* a live player + scenery exist from frame one, so the loading and title
   screens render over the real world instead of a black rectangle      */
player=makePlayer();
buildProps();
camPreset(0);
updateCam(0.016,player,0);
/* probe for soundtrack files sitting beside this HTML — see MUSIC_FILES */
probeMusicFiles();
requestAnimationFrame(frame);
/* one deferred self-test after the first assets settle, reported only if
   something is actually wrong — silent when everything passes.
   Several assertions dereference `player`, which does not exist until the
   sheets settle, so on a slow load the timer waits rather than reporting a
   cabinet full of spurious failures.                                      */
setTimeout(function selfTestLater(){
  if(!player){ setTimeout(selfTestLater,1200); return; }
  try{
    var r=runSelfTest();
    if(G.tests&&G.tests.fail===0) G.tests=null;
    else if(G.tests) reportErr("selftest",r);
  }catch(e){ reportErr("selftest",e); }
},2200);

</script>
