<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- iOS Safari has no element.requestFullscreen(); "Add to Home Screen" is the
     only way to get a truly chromeless full screen there, and these three tags
     are what make that launch without a browser bar. Android Chrome uses the
     Fullscreen button instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DOGELON">
<meta name="theme-color" content="#07050a">
<title>DOGELON: MARS 3D — Chronicles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:#07050a;overflow:hidden;
  font-family:"Trebuchet MS",Tahoma,Verdana,sans-serif;color:#ffd98a}
/* dvh tracks the *visible* viewport, so the game still fills the screen when
   a mobile browser's address bar slides in and out. Older engines fall back
   to the 100% above. */
@supports (height:100dvh){ html,body{height:100dvh} }
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 38%,#1b0d13 0%,#07050a 72%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* once the Fullscreen button (or an installed home-screen launch) takes over,
   drop the rounded corners and glow so the picture reaches every edge */
body.fs #wrap{padding:0;background:#000}
body.fs #stage{border-radius:0;box-shadow:none}
#stage{position:relative;overflow:hidden;border-radius:6px;
  box-shadow:0 0 90px rgba(255,88,40,.20),0 0 0 1px rgba(255,160,90,.20)}
canvas{display:block;width:100%;height:100%;background:#0a0508;touch-action:none}
.pad{position:absolute;display:none;z-index:5;border-radius:50%;
  background:rgba(255,214,138,.10);border:2px solid rgba(255,214,138,.34);
  color:#ffe6b0;font-weight:bold;align-items:center;justify-content:center;
  text-shadow:0 1px 2px #000;backdrop-filter:blur(2px)}
.pad.on{background:rgba(255,150,60,.34);border-color:#ffb066}
body.touch .pad{display:flex}
#pL{left:3%;bottom:7%;width:15%;padding-bottom:15%;font-size:5vmin}
#pR{left:20%;bottom:7%;width:15%;padding-bottom:15%;font-size:5vmin}
#pFire{right:3%;bottom:19%;width:20%;padding-bottom:20%;font-size:3.4vmin}
#pJump{right:24%;bottom:7%;width:16%;padding-bottom:16%;font-size:3.2vmin}
#pSlide{right:4%;bottom:4%;width:15%;padding-bottom:15%;font-size:3vmin}
#rot{position:absolute;inset:0;display:none;z-index:40;background:#0b0609ee;
  align-items:center;justify-content:center;text-align:center;font-size:4vmin;padding:8%}
#drop{position:absolute;inset:0;z-index:30;display:none;align-items:center;
  justify-content:center;background:rgba(10,4,8,.86);border:3px dashed #ff9a4d;
  font-size:2.4vmin;text-align:center;padding:6%}
#drop.show{display:flex}
#tools{position:absolute;right:6px;top:6px;z-index:20;display:flex;gap:5px;opacity:.5}
#tools:hover{opacity:1}
#tools button{font:inherit;font-size:11px;padding:3px 7px;cursor:pointer;
  background:#2a1118;color:#ffcf95;border:1px solid #7a3a22;border-radius:4px}
#err{position:absolute;left:0;right:0;bottom:0;z-index:50;display:none;max-height:42%;
  overflow:auto;background:#2a0408ee;color:#ffb4b4;font:11px/1.45 monospace;padding:8px;
  border-top:2px solid #ff5555;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="pad" id="pL">&#9664;</div><div class="pad" id="pR">&#9654;</div>
  <div class="pad" id="pFire">FIRE</div><div class="pad" id="pJump">JUMP</div>
  <div class="pad" id="pSlide">SLIDE</div>
  <div id="rot">Rotate your device to landscape<br><small>(or just turn it sideways)</small></div>
  <div id="drop">Drop sprite sheets (.png) or music (.mp3/.wav/.ogg) here</div>
  <div id="tools">
    <button id="bMusic">&#9835; Music</button><button id="bSprites">Sheets</button>
    <button id="bFull">Fullscreen</button>
  </div>
  <div id="err"></div>
</div></div>
<input type="file" id="fMusic" accept="audio/*" multiple style="display:none">
<input type="file" id="fSprite" accept="image/png,image/*" multiple style="display:none">
<script>
"use strict";
/* ==== DOGELON: MARS 3D — Chronicles ============================== */
/* ---------- 0. crash reporter (so nothing ever fails silently) ---- */
var errBox=document.getElementById("err"),errCount=0;
function reportErr(tag,e){
  errCount++; if(errCount>12) return;
  errBox.style.display="block";
  errBox.textContent += "["+tag+"] "+(e&&e.stack?e.stack:e)+"\n";
}
window.addEventListener("error",function(ev){reportErr("error",ev.error||ev.message);});
window.addEventListener("unhandledrejection",function(ev){reportErr("promise",ev.reason);});

/* ---------- 1. constants ----------------------------------------- */
var VW=1280, VH=720;                    // internal render resolution
var ROAD_HALF=8.0;                      // metres from centre to road edge
var PLAYER_LIMIT=7.0;                   // how far the player may stray
var LANES=5;
var GRAV=26.0;                          // m/s^2
var JUMP_V=9.4;
var NEARZ=1.6;
var FARZ=170;

/* --- lane-restricted fire -------------------------------------------
   Standing dead centre used to clear the whole road, so the lanes were
   decoration.  Fire is now a corridor: acquisition and damage are both
   gated on horizontal distance from the player.  laneX() spaces lanes
   2.88 m apart, so the 1.5 m damage half-width covers your own lane and
   nothing else, while the 2.8 m acquisition width lets the reticle look
   one lane ahead of where you are standing.  You have to move to clear. */
var LANE_SHOOT_WIDTH = 2.8;             // acquisition / reticle half-width
var LANE_DAMAGE_HALF = 1.5;             // a bullet outside this deals nothing

/* --- Dogelon Jet ----------------------------------------------------- */
var JET_TIME  = 12.0;                   // seconds of flight per pickup
var JET_Y     = 4.0;                    // cruise altitude, world units
var JET_RISE  = 0.4;                    // s to climb
var JET_FALL  = 0.6;                    // s to settle back down

var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;

/* ---------- 2. maths -------------------------------------------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(t){return t*t*(3-2*t);}
function sign(v){return v<0?-1:(v>0?1:0);}
function dist2(a,b,c,d){var x=a-c,y=b-d;return x*x+y*y;}
function rnd(a,b){return a+Math.random()*(b-a);}
function irnd(a,b){return Math.floor(rnd(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function chance(p){return Math.random()<p;}
function approach(cur,tgt,rate,dt){
  var d=tgt-cur, m=rate*dt;
  if(Math.abs(d)<=m) return tgt;
  return cur+sign(d)*m;
}
/* deterministic hash noise for terrain decoration */
function hash1(n){ n=(n<<13)^n; n=(n*(n*n*15731+789221)+1376312589)&0x7fffffff;
  return n/1073741823.5-1; }
function noise1(x){ var i=Math.floor(x),f=x-i;
  return lerp(hash1(i),hash1(i+1),smooth(f)); }
function fbm(x){ return noise1(x)*0.55+noise1(x*2.1)*0.28+noise1(x*4.3)*0.17; }

/* ---------- 3. palette helpers ---------------------------------- */
function rgba(r,g,b,a){return "rgba("+(r|0)+","+(g|0)+","+(b|0)+","+a+")";}
function mixHex(h1,h2,t){
  var a=parseInt(h1.slice(1),16), b=parseInt(h2.slice(1),16);
  var r=lerp((a>>16)&255,(b>>16)&255,t),g=lerp((a>>8)&255,(b>>8)&255,t),
      c=lerp(a&255,b&255,t);
  return "rgb("+(r|0)+","+(g|0)+","+(c|0)+")";
}
/* "#rrggbb" -> "rgba(r,g,b,a)".  Gradient colour stops need a real alpha in
   the string — globalAlpha cannot fade one stop and not another.          */
function hexA(h,a){
  var n=parseInt(h.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
/* lighten toward white and stay in "#rrggbb", so the result can be fed back
   into mixHex — mixHex emits "rgb(...)" and cannot be chained into itself. */
function lightHex(h,t){
  var n=parseInt(h.slice(1),16);
  var r=Math.round(lerp((n>>16)&255,255,t)),
      g=Math.round(lerp((n>>8)&255,255,t)),
      b=Math.round(lerp(n&255,255,t));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* ---------- 4. sprite sheet manifest ----------------------------- */
/* cols/rows were read off the actual uploaded PNGs.  Every sheet is a
   uniform grid; cells that are blank are auto-detected and skipped so a
   wrong row-count can never produce an invisible frame.               */
var SHEETS={
  backwalk : {file:"Dogelon_backwalk.png",  cols:2, rows:2},
  frontwalk: {file:"Dogelon_frontwalk.png", cols:2, rows:2},
  stand    : {file:"Dogelon_Stand.png",     cols:1, rows:1},
  blast    : {file:"Dogelon_Blast.png",     cols:2, rows:2},
  walk     : {file:"Dogelon_Walk.png",      cols:2, rows:2},
  walkng   : {file:"Dogelon_walk_Nogun.png",cols:2, rows:2},
  run      : {file:"Dogelon_Run.png",       cols:2, rows:2},
  slide    : {file:"Dogelon_Slide.png",     cols:2, rows:2},
  duck     : {file:"Dogelon_duck.png",      cols:2, rows:2},
  hit      : {file:"Dogelon_Hit.png",       cols:2, rows:2},
  dead     : {file:"Dogelon_Dead.png",      cols:4, rows:5},
  spawn    : {file:"Dogelon_spawn.png",     cols:2, rows:2},
  respawn  : {file:"Dogelon_respawn.png",   cols:2, rows:2},
  explode  : {file:"Dogelon_explode.png",   cols:2, rows:3},
  drone    : {file:"Dogelon_enemyfly.png",  cols:3, rows:3},
  walker   : {file:"Dogelon_enemywalk.png", cols:3, rows:4},
  kaiju    : {file:"Kaiju_Boss.png",        cols:4, rows:3, keyBlack:true},
  /* The rover replaces the retired bull mount outright.  4 cols x 5 rows,
     already shipped with a transparent background, so it needs no colour
     key at all — it goes straight through trimCell like the dog sheets.
     `alt` is a list of extra filenames to try if the canonical one is not
     on disk; the sprite the user supplied has a machine-generated name and
     this lets the build work either way (see loadSheet).                 */
  rover    : {file:"Dogelon_Rover.png",     cols:4, rows:5,
              alt:["Gemini_Generated_Image_7hmpue7hmpue7hmp-removebg-preview.png",
                   "Dogelon_rover.png","Rover.png"]},
  /* appended, never re-ordered: existing keys keep their identity.  This one
     is the odd sheet out — it ships on an OPAQUE WHITE background, which the
     alpha trim below would happily measure as solid content and then paint as
     a white box over Mars.  keyWhite makes the loader punch that background
     out first; see keyWhiteSheet().                                        */
  jet      : {file:"Dogelon_Ship.png",      cols:4, rows:5, keyWhite:true}
};
/* where to look for the PNGs, in order */
function candidates(file){
  return ["assets/"+file, file, "sprites/"+file, "../uploads/"+file,
          "uploads/"+file, "../"+file];
}
var ASSETS={}, assetsPending=0, assetsDone=0, trimActive=false, trimTried=false;

/* ---- white-background keying ----------------------------------------
   The one additive touch to the loading pipeline, and it exists for a single
   sheet.  trimCell()'s content test is `a>26` — pure alpha — so an opaque
   white backdrop reads as 100% coverage: every cell would measure full, the
   blank cells in a partial last row would never be detected, and the sprite
   would draw as a white rectangle over the Mars sky.

   A BORDER flood fill is the only safe way to strip it.  Seeding from the
   cell edge and walking inward means enclosed white survives — the glass
   canopy, Dogelon's muzzle, his paws, the boots — while the surrounding
   field goes to alpha 0.  A global "all white is transparent" pass would
   punch holes straight through the cockpit.

   Runs once per sheet at load, writes the result back into def.img as a
   canvas so trimCell and drawFrame need no changes at all.  Under file://
   getImageData() throws on a tainted canvas, so this sets keyFailed and the
   procedural fallbackJet() takes the frame instead of a white box.       */
var KEY_MAX_PX=4200000;            /* ~2048x2048; above this, don't bother */
function keyWhiteSheet(def){
  if(!def.img||!def.w||!def.h){ def.keyFailed=true; return; }
  if(def.w*def.h>KEY_MAX_PX){ def.keyFailed=true; return; }
  var kc=document.createElement("canvas");
  kc.width=def.w; kc.height=def.h;
  var kx=kc.getContext("2d");
  kx.clearRect(0,0,def.w,def.h);
  kx.drawImage(def.img,0,0);
  var bmp;
  try{ bmp=kx.getImageData(0,0,def.w,def.h); }
  catch(e){ def.keyFailed=true; return; }   /* file:// taint — use fallback */
  var d=bmp.data, W=def.w, H=def.h;
  var fw=Math.floor(W/def.cols), fh=Math.floor(H/def.rows);
  var seen=new Uint8Array(W*H);
  var stack=new Int32Array(fw*fh+8), sp=0;  /* explicit stack: no recursion */
  var x,y,r,c;
  for(r=0;r<def.rows;r++) for(c=0;c<def.cols;c++){
    var x0=c*fw, y0=r*fh, x1=Math.min(W,x0+fw), y1=Math.min(H,y0+fh);
    sp=0;
    /* seed every pixel on the cell's border */
    for(x=x0;x<x1;x++){
      var t0=y0*W+x, t1=(y1-1)*W+x;
      if(!seen[t0]){ seen[t0]=1; stack[sp++]=t0; }
      if(!seen[t1]){ seen[t1]=1; stack[sp++]=t1; }
    }
    for(y=y0;y<y1;y++){
      var l0=y*W+x0, r0=y*W+(x1-1);
      if(!seen[l0]){ seen[l0]=1; stack[sp++]=l0; }
      if(!seen[r0]){ seen[r0]=1; stack[sp++]=r0; }
    }
    /* marking on PUSH (not on pop) caps total pushes at one per pixel, so
       the stack can never outgrow the cell                              */
    while(sp>0){
      var i4=stack[--sp]*4;
      if(!(d[i4]>=235&&d[i4+1]>=235&&d[i4+2]>=235)) continue;  /* a wall */
      d[i4+3]=0;
      var pi=i4>>2, px=pi%W, py=(pi-px)/W;
      if(px>x0   && !seen[pi-1]){ seen[pi-1]=1; stack[sp++]=pi-1; }
      if(px<x1-1 && !seen[pi+1]){ seen[pi+1]=1; stack[sp++]=pi+1; }
      if(py>y0   && !seen[pi-W]){ seen[pi-W]=1; stack[sp++]=pi-W; }
      if(py<y1-1 && !seen[pi+W]){ seen[pi+W]=1; stack[sp++]=pi+W; }
    }
  }
  kx.putImageData(bmp,0,0);
  def.img=kc; def.keyed=true;
}
function keyIfNeeded(def){ if(def.keyWhite && !def.keyed) keyWhiteSheet(def); }

function loadSheet(key){
  var def=SHEETS[key], list=candidates(def.file), i=0;
  /* extra spellings, tried after every path for the canonical name has been
     exhausted.  Purely additive: sheets without `alt` behave exactly as before */
  if(def.alt) for(var ai=0;ai<def.alt.length;ai++) list=list.concat(candidates(def.alt[ai]));
  assetsPending++;
  var img=new Image();
  img.onload=function(){
    def.img=img; def.w=img.naturalWidth; def.h=img.naturalHeight;
    keyIfNeeded(def);
    sliceSheet(def); assetsDone++;
  };
  img.onerror=function(){
    i++;
    if(i<list.length){ img.src=list[i]; }
    else { def.missing=true; assetsDone++; }
  };
  img.src=list[0];
  ASSETS[key]=def;
}
for(var _k in SHEETS) loadSheet(_k);
/* fallback content boxes (fraction of cell) used when pixel access is
   blocked — e.g. opened straight off the disk with file://            */
var FALLBOX={
  drone :{x:0.24,y:0.04,w:0.54,h:0.66},
  walker:{x:0.21,y:0.09,w:0.58,h:0.73},
  backwalk:{x:0.23,y:0.02,w:0.50,h:0.95},
  frontwalk:{x:0.23,y:0.02,w:0.50,h:0.95},
  kaiju :{x:0.05,y:0.03,w:0.90,h:0.94},
  rover :{x:0.04,y:0.14,w:0.92,h:0.74},
  /* the ship is wide and short in its cell; if keying fails we never draw
     the sheet at all, but the Sprite Lab still needs a sane box           */
  jet   :{x:0.03,y:0.16,w:0.94,h:0.66},
  explode:{x:0.05,y:0.05,w:0.90,h:0.90},
  dead  :{x:0.05,y:0.05,w:0.90,h:0.90},
  _def  :{x:0.14,y:0.03,w:0.72,h:0.94}
};
var scratch=document.createElement("canvas"), sctx=scratch.getContext("2d");

function sliceSheet(def){
  var fw=Math.floor(def.w/def.cols), fh=Math.floor(def.h/def.rows);
  def.fw=fw; def.fh=fh; def.frames=[];
  var box=FALLBOX[keyOf(def)]||FALLBOX._def, canTrim=false, data=null;
  if(!trimTried){ trimTried=true; }
  try{
    scratch.width=fw; scratch.height=fh;
    sctx.clearRect(0,0,fw,fh); sctx.drawImage(def.img,0,0);
    sctx.getImageData(0,0,1,1);          // throws when tainted
    canTrim=true; trimActive=true;
  }catch(e){ canTrim=false; }
  for(var r=0;r<def.rows;r++) for(var c=0;c<def.cols;c++){
    var f={sx:c*fw, sy:r*fh, sw:fw, sh:fh, empty:false};
    f.cx=f.sx+box.x*fw; f.cy=f.sy+box.y*fh; f.cw=box.w*fw; f.ch=box.h*fh;
    if(canTrim){
      var t=trimCell(def,f.sx,f.sy,fw,fh);
      if(t){ f.cx=t.x; f.cy=t.y; f.cw=t.w; f.ch=t.h; f.cover=t.cover; }
      else { f.empty=true; }
    }
    def.frames.push(f);
  }
  /* every non-empty index, in reading order */
  def.live=[]; for(var i=0;i<def.frames.length;i++) if(!def.frames[i].empty) def.live.push(i);
  if(def.live.length===0){ for(var j=0;j<def.frames.length;j++) def.live.push(j); }
}
function keyOf(def){ for(var k in SHEETS) if(SHEETS[k]===def) return k; return "_def"; }
/* Alpha / luminance scan at low resolution — cells are up to 1728px so a
   full-res scan would stall.  S x S is plenty to find a content box.   */
var SCAN=80, scanC=document.createElement("canvas"), scanX;
scanC.width=SCAN; scanC.height=SCAN; scanX=scanC.getContext("2d");
function trimCell(def,sx,sy,fw,fh){
  scanX.clearRect(0,0,SCAN,SCAN);
  scanX.drawImage(def.img,sx,sy,fw,fh,0,0,SCAN,SCAN);
  var d;
  try{ d=scanX.getImageData(0,0,SCAN,SCAN).data; }catch(e){ return null; }
  var minx=SCAN,miny=SCAN,maxx=-1,maxy=-1,hits=0,black=!!def.keyBlack;
  for(var y=0;y<SCAN;y++) for(var x=0;x<SCAN;x++){
    var i=(y*SCAN+x)*4, a=d[i+3], on;
    if(black) on = a>8 && (d[i]*0.35+d[i+1]*0.5+d[i+2]*0.35) > 26;
    else      on = a>26;
    if(on){ hits++;
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }
  }
  if(hits < 6) return null;                       // effectively empty cell
  var px=fw/SCAN, py=fh/SCAN;
  return { x:sx+minx*px, y:sy+miny*py,
           w:Math.max(px,(maxx-minx+1)*px), h:Math.max(py,(maxy-miny+1)*py),
           cover:hits/(SCAN*SCAN) };
}
/* ---------- 5. drawing a frame ---------------------------------- */
/* Draws frame `idx` of sheet `key` so that its *content* is centred on
   (x,y) with the given on-screen height, preserving aspect.  This is the
   single place that fixes "sprites drawn tiny / off-centre".           */
function drawFrame(key,idx,x,y,h,opt){
  var def=ASSETS[key]; if(!def||!def.img||!def.frames) return false;
  var f=def.frames[((idx%def.frames.length)+def.frames.length)%def.frames.length];
  if(!f||f.empty) return false;
  opt=opt||{};
  var flip=opt.flip?-1:1, aspect=f.cw/f.ch, w=h*aspect;
  var a=(opt.alpha===undefined)?1:opt.alpha;
  if(a<=0.004) return true;
  ctx.save();
  ctx.globalAlpha=a;
  if(def.keyBlack||opt.additive) ctx.globalCompositeOperation="screen";
  ctx.translate(x,y);
  if(opt.rot) ctx.rotate(opt.rot);
  if(opt.sy) ctx.scale(1,opt.sy);
  ctx.scale(flip,1);
  try{ ctx.drawImage(def.img,f.cx,f.cy,f.cw,f.ch,-w/2,-h/2,w,h); }catch(e){}
  ctx.restore();
  return true;
}
/* Tinted / silhouette draw.  Uses source-atop on an offscreen canvas so it
   works even when getImageData is blocked (file:// tainting).           */
var tmpC=document.createElement("canvas"), tmpX=tmpC.getContext("2d");
function drawFrameTint(key,idx,x,y,h,color,amount,opt){
  var def=ASSETS[key]; if(!def||!def.img||!def.frames) return false;
  var f=def.frames[((idx%def.frames.length)+def.frames.length)%def.frames.length];
  if(!f||f.empty) return false;
  opt=opt||{};
  var aspect=f.cw/f.ch, w=Math.max(2,Math.round(h*aspect)); h=Math.max(2,Math.round(h));
  if(w>1400||h>1400){ return drawFrame(key,idx,x,y,h,opt); }
  tmpC.width=w; tmpC.height=h;
  tmpX.clearRect(0,0,w,h);
  tmpX.imageSmoothingEnabled=false;
  try{ tmpX.drawImage(def.img,f.cx,f.cy,f.cw,f.ch,0,0,w,h); }catch(e){ return false; }
  tmpX.globalCompositeOperation="source-atop";
  tmpX.globalAlpha=clamp(amount,0,1);
  tmpX.fillStyle=color; tmpX.fillRect(0,0,w,h);
  tmpX.globalCompositeOperation="source-over"; tmpX.globalAlpha=1;
  ctx.save();

     is folded into the TARGETS rather than added after the lerps: adding an
     offset post-lerp compounds every frame (the lerp only claws back ~10% of
     it per frame at 60Hz, so a +2.2 nudge settles at roughly +22) and the
     camera would run away.  Targets are parameters — the projection maths

     the whole fight the pitch and the dogleg distance are pinned, hard, after
     the interpolation rather than as lerp targets, so nothing can drag them
     back toward the preset.  These are the only two values overridden; y, foc
     and cy still breathe with speed.                                       */

  var n=0; for(var i=0;i<LEVELS.length;i++) if(!LEVELS[i].bonus) n++;
  return n;

   G.lvIdx used to double as this, which meant inserting the bonus stage at
   index 2 silently sped up enemy fire on every sector after it.  lv.n cannot
   be used either: it is the string "B" on the bonus stage, so lv.n-1 is NaN. */
function tier(){
  var n=0; for(var i=0;i<G.lvIdx && i<LEVELS.length;i++) if(!LEVELS[i].bonus) n++;

/* ---------- 10b. ROVER RUN — the ride ---------------------------------
   Behind the wheel, three things change: contact becomes offence (see
   crush()), DOWN stops being a slide and drops the plough BLADE, and running
   out of hull throws you clear instead of costing a life.  Everything else —
   the blaster, the camera, the director — carries over unchanged, which is
   why the bonus stage needs no separate game loop.

   This replaces the retired charged-bull rodeo.  Nothing about the bull
   survives: not the sheet, not the enemy type, not the mount.            */
var ROVER_H=1.74;       /* world height of the chassis                     */
var RIDER_H=1.52;       /* world height of Dogelon sitting in the cockpit  */
var RIDE_BONUS=70;      /* flat score per crush, doubled with the blade down */
function mountRover(){
  var p=player;
  if(!p) return;
  p.riding=true; p.rideT=0; p.ram=0;
  p.maxJumps=1;                        /* six wheels do not double-jump    */
  p.h=ROVER_H*0.86+RIDER_H; p.r=1.42;  /* taller and wider than on foot    */
  G.crushes=0;
  SFX.power&&SFX.power();
}
function dismountRover(){
  var p=player;
  if(!p) return;
  p.riding=false; p.ram=0; p.maxJumps=2; p.h=2.35; p.r=1.05;
}
/* Thrown clear: ends the bonus stage on the spot but never costs a life. */
function ejectRider(){
  var p=player;
  G.rideBest=Math.max(G.rideBest,G.crushes);
  /* Lift him to the height he was actually sitting at BEFORE clearing the
     mount, otherwise drawPlayer's baseY drops 1.5 m in one frame and he
     teleports down instead of being thrown.  The CLEAR branch of step()
     integrates gravity, so the arc plays out.                             */
  p.y = ROVER_H*0.86;
  dismountRover();
  p.hp=Math.max(1,p.hp); p.inv=3.0; p.vy=11; p.onGround=false;
  SFX.boom(); shakeIt(26); flashIt("#ffcf4a",0.46); slowmo(0.4);
  for(var i=0;i<40;i++)
    spawnPart(p.x,p.y+1.6,p.z,rnd(-15,15),rnd(2,20),rnd(-12,12),rnd(0.4,1.0),
      pick(["#fff","#ffcf4a","#ff7a2a"]),rnd(0.6,1.6),1);
  toast("ROVER WRECKED — ride over");
  if(G.state==="PLAY"){ G.state="CLEAR"; G.timer=0; SFX.clear(); }
}

/* ---- RUIN COURSE: the jump / slide / dodge obstacles -------------------
   The lane used to be a shooting gallery with a floor: JUMP existed for one
   thing (the odd rock) and SLIDE for none.  These three ruins make both keys
   load-bearing, Subway-Surfers style, and they route through the existing
   `hazard` entity so the draw list, the culler and collideEnt() need no new
   plumbing — only a new `sub`.

     arch     a fallen lintel with a gap beneath  -> SLIDE  (or duck)
     tower    a standing column, floor to sky     -> STEER around it

   times you meet it, then the prompts stop (G.ruinCleared gates them), and

var RUIN_KINDS=["barrier","arch","tower"];

   face, hi = rim/edge highlight and the colour the debris and rings take. */

function laneX(i){ return -ROAD_HALF*0.72 + i*(ROAD_HALF*1.44/(LANES-1)); }

/* wave director: keeps the road interesting and always survivable.
   Sector 1 was over-stuffed — you reported it as unreadable, and the numbers
   agreed: rate 1.35 with a 0.72 floor meant ~1 wave/second from the first
   metre, and a "wall of drones" wave puts LANES-1 = 4 of them on screen at
   once.  Three things fix it: a quiet opening stretch, a hard cap on how many
   live enemies may share the screen, and gating the dense patterns behind
   progress so they arrive after you have found your feet.                 */
function liveThreats(){
  var n=0;
  for(var i=0;i<ents.length;i++){
    var e=ents[i];
    if(e.dead||e.kind==="hazard") continue;
    if(e.z>player.z-4 && e.z<player.z+FARZ) n++;
  }
  return n;
}
/* ---- per-sector crowd control ---------------------------------------
   One global cap was why sector 1 was a wall of drones you couldn't see
   through and why sector 4 felt no different from it.  Every sector now
   owns its live on-screen ceiling and, where it matters, its own spawn
   rate.  Indices match LEVELS: 0 RED DUNES, 1 ASHFALL, 2 ROVER RUN,
   3 CRYO BASIN, 4 ELON SPIRE, 5 KAIJU.                                */
var SEC_CAP  = [6, 10, 0, 14, 18, 8];    /* 0 = fall through to the rules */
var SEC_RATE = [0,  0, 0,  0,  0, 2.0];  /* 0 = keep the LEVELS rate      */
function sectorCap(){
  var D=DIFFS[G.diff], lv=G.lv;
  /* ROVER RUN inverts the rule: at the wheel a crowd is a payday, not a threat */
  if(lv.ride) return D.cap+7;
  var base=SEC_CAP[G.lvIdx]||D.cap;
  /* the numbers above are the NORMAL figures; EASY and HARD scale off their
     own caps (7/11 and 16/11) so the difficulty selector still bites, and a
     floor of 4 keeps every sector from ever feeling bot-free             */
  return Math.max(4, Math.round(base*(D.cap/DIFFS[1].cap)));
}
function sectorRate(){ return SEC_RATE[G.lvIdx]||G.lv.rate; }
function director(dt){
  var lv=G.lv, D=DIFFS[G.diff];
  var prog=clamp(G.dist/lv.len,0,1);
  /* opening grace: the first stretch of every sector stays clear so you can
     see the road, read the lanes and get a shot off before anything arrives.
     Sector 1 gets 200m of it because it is also where you learn the lanes. */
  var grace = (G.lvIdx===0 ? 200 : 90);
  if(G.dist<grace){ G.spawnAcc=0; }
  else {
    /* the floor used to be 0.72 of full rate; starting at 0.42 and reaching
       full only at the sector's end makes the ramp feel like a ramp        */
    var ramp = 0.42 + prog*0.95;
    G.spawnAcc += dt*(sectorRate()*ramp*D.rate);
  }
  var cap = sectorCap();
  while(G.spawnAcc>=1){
    G.spawnAcc-=1;
    /* never let the screen clog: past the cap, the wave is simply skipped */
    if(liveThreats()>=cap) continue;
    var room = cap - liveThreats();
    G.waveN++;
    var z=player.z+rnd(88,138), pat=Math.random();
    /* Sector 1 alone is gated: scatter only for its first half, and never a
       wall or a walker line before the 400m mark.  Sectors 2-5 get their
       formations from the opening metre.                                  */
    var scatterOnly = (G.lvIdx===0 && prog<0.5);
    var formed = (G.lvIdx!==0) || (G.dist>400 && !scatterOnly);
    var allowWall = formed && room>=LANES-1;
    var allowLine = formed && room>=3;
    var allowDiag = (G.lvIdx!==0 || !scatterOnly) && room>=3;
    /* ELON SPIRE's signature: a diagonal stream guaranteed every third wave,
       so the sector reads as sweeping traffic rather than random noise    */
    if(G.lvIdx===4 && G.waveN%3===0 && room>=3){
      var fdir=chance(0.5)?1:-1, fst=irnd(0,LANES-1);
      for(var fi=0;fi<4&&liveThreats()<cap;fi++)
        spawnDrone(z+fi*7, laneX(clamp(fst+fi*fdir,0,LANES-1)), prog>0.5?1:0);
    }
    else if(pat<0.16 && allowWall){                // wall of drones with a gap
      /* sector 1 gets two gaps — one is a reflex test, two is a lesson */
      var gap=irnd(0,LANES-1), gap2=(G.lvIdx===0)?((gap+irnd(1,LANES-1))%LANES):-1;
      for(var i=0;i<LANES;i++)
        if(i!==gap&&i!==gap2) spawnDrone(z+rnd(-3,3),laneX(i),prog>0.6?1:0);
    } else if(pat<0.28 && allowLine){               // walker line
      var g2=irnd(0,LANES-1);
      for(var j=0;j<LANES;j++)
        if(j!==g2&&chance(0.8)&&liveThreats()<cap) spawnWalker(z+rnd(-4,4),laneX(j));
    } else if(pat<0.36 && allowLine){               // paired flank walkers
      spawnWalker(z+rnd(-4,4),laneX(0)); spawnWalker(z+rnd(-4,4),laneX(LANES-1));
    } else if(pat<0.50 && allowDiag){               // diagonal drone stream
      var d=chance(0.5)?1:-1, st=irnd(0,LANES-1);
      for(var k2=0;k2<4&&liveThreats()<cap;k2++)
        spawnDrone(z+k2*7, laneX(clamp(st+k2*d,0,LANES-1)));
    } else {                                        // scatter by mix
      var n=Math.min(irnd(1,3),Math.max(1,room));
      for(var m=0;m<n;m++){
        var r=Math.random(), lx=laneX(irnd(0,LANES-1))+rnd(-0.8,0.8);
        if(r<lv.mix.drone) spawnDrone(z+rnd(-8,8),lx,chance(prog*0.4)?1:0);
        else spawnWalker(z+rnd(-8,8),lx);
      }
    }
    /* hazards were rolling 42% on top of every wave; sector 1 gets half that,
       and ROVER RUN barely any — rocks are the one thing that can throw you  */
    var hz = lv.ride ? 0.12 : (G.lvIdx===0?0.20:0.36);
    if(chance(hz)) spawnHazard(player.z+rnd(70,150), laneX(irnd(0,LANES-1)));
  }
  /* ---- the ruin obstacle course ---------------------------------------
     On its own accumulator rather than piggy-backing the wave roll, because
     the course has to feel rhythmic: a steady drum of things to jump, slide
     and steer around no matter what the bots are doing.  Spacing is in
     METRES OF ROAD, not seconds, so the rhythm is identical at 26 m/s and at
     68 m/s.  The first 120 m of every sector stays clear of ruins so the
     opening still reads as an opening.                                   */
  if(lv.obst>0 && G.state!=="BOSS" && !G.arena){
    if(G.nextRuin<=0) G.nextRuin = player.z + 120;
    /* IN THE ROVER, ARCHES ARE UNSURVIVABLE — and that is a design bug, not a
       difficulty setting.  DOWN is the plough blade behind the wheel, so there
       is no slide to duck one with, and the chassis stands 1.74 m against an
       arch soffit at 1.35 m.  So the ride draws from a two-kind deck: barriers
       (which it SMASHES for +90 instead of jumping) and towers (which it
       steers around).  Teaching order collapses to those two as well.      */
    var deck = lv.ride ? ["barrier","tower"] : RUIN_KINDS;
    while(G.nextRuin < player.z + FARZ*0.92){
      var rz=G.nextRuin, sub=pick(deck);
      /* Teach it in order.  The first three ruins you ever meet in a sector
         arrive one kind at a time — barrier, then arch, then tower — so the
         key you need is learned in isolation before they interleave.      */
      if(G.ruinCleared<deck.length) sub=deck[G.ruinCleared];
      if(sub==="tower"){
        /* a column is only fair if there is a way past it, so it always
           spawns off-centre and never fills the road                     */
        spawnRuin(rz, laneX(chance(0.5)?irnd(0,1):irnd(LANES-2,LANES-1)), "tower");
        /* pair it with a second column on the far side often enough that the
           gap between them becomes the thing you aim for                 */
        if(chance(0.42)) spawnRuin(rz+rnd(6,14), laneX(irnd(1,LANES-2)), "tower");
      } else {
        /* barriers and arches span the middle: they are meant to be gone
           OVER or UNDER, not around, which is what makes the keys matter  */
        spawnRuin(rz, rnd(-2.2,2.2), sub);
        /* and a flanking column now and then, so "just hug the edge" is not
           a free answer to the whole course                               */
        if(chance(0.34)) spawnRuin(rz+rnd(4,10), laneX(chance(0.5)?0:LANES-1), "tower");
      }
      G.nextRuin += lerp(150, 74, clamp(lv.obst,0,1)) * rnd(0.78,1.34);
    }
  }
  /* coin rush: the bonus stage pays in a dense, mostly-coin stream */
  while(G.nextPick < player.z+FARZ){
    spawnPickup(G.nextPick, laneX(irnd(0,LANES-1)), lv.ride?(chance(0.86)?"coin":null):null);
    G.nextPick += lv.ride ? rnd(11,22) : rnd(26,64);
  }
  /* ---- the guaranteed jet ---------------------------------------------
     One per sector, placed at 55% of the run, spawned FAR ahead so it
     arrives as a visible landmark rather than materialising in your face.
     Not on ROVER RUN (there is no room for a jet pack in the cockpit) and not
     at the boss, where leaving the ground would break the fight camera.
     G.jetGiven is reset per level in startLevel(), so it is exactly once. */
  if(!G.jetGiven && !lv.ride && G.lvIdx!==5 && G.dist > lv.len*0.55){
    G.jetGiven=true;
    spawnPickup(player.z+rnd(110,150), laneX(irnd(0,LANES-1)), "jet");
    toast("JET SIGNAL AHEAD");
  }
}
/* ---------- 13. player ------------------------------------------ */
function levelSpeed(){
  var lv=G.lv, prog=clamp(G.dist/lv.len,0,1);
  var s=lerp(lv.speed[0],lv.speed[1],prog);
  if(G.endless) s=lv.speed[1]+Math.min(26,G.dist/900);
  var p=player;
  if(p){
    if(p.sliding>0) s*=1.10;          /* sliding tucks and gains a little  */
    if(p.ram>0)     s*=1+p.ram*0.22;  /* blade down in the rover = full tilt */
  }
  if(G.state==="BOSS") s*=0.55;
  return s;
}
/* ---- DOGELON JET ------------------------------------------------------
   A twelve-second vehicle, not a jump.  It owns p.y outright while it lasts:
   gravity is suspended, the ground test is bypassed, and the climb and the
   settle are both fixed-duration lerps so the transition is always readable
   no matter what the frame rate is doing.  Everything it borrows — p.h, p.r,
   p.maxJumps — is written down on take-off and put back on landing, because
   forgetting to restore p.maxJumps would silently cost you your double jump
   for the rest of the run.                                               */
function smooth(k){ return k*k*(3-2*k); }
function startJet(){
  var p=player;
  /* "fresh" means not already inside a flight cycle — and the descent counts
     as inside it.  This matters: p.h/p.r are still the JET values all the way
     through jetDown, so grabbing a second crate mid-descent while treating it
     as a fresh take-off would save 2.05/1.55 as the *walking* rig and you
     would keep the ship's hitbox on foot for the rest of the run.         */
  var fresh = !(p.jet>0) && !(p.jetDown>0);
  if(fresh){
    p.jetT = 0;
    /* clear the slide FIRST: p.h is 1.10 mid-slide, and capturing that as the
       walking height would hand back a crouched hitbox on landing         */
    p.sliding = 0; p.slideCd = 0;
    p.h = 2.35;
    p.hSave = p.h; p.rSave = p.r; p.jumpSave = p.maxJumps;
    SFX.power(); flashIt("#ffd27a",0.28); shakeIt(9);
    toast("DOGELON JET — 12s");
    for(var i=0;i<26;i++)
      spawnPart(p.x+rnd(-1.2,1.2), rnd(0.2,2.4), p.z+rnd(-1,2),
                rnd(-9,9), rnd(2,16), rnd(-6,6), rnd(0.3,0.7),
                pick(["#ffd27a","#ff9a3a","#fff4d0"]), rnd(0.6,1.3), 1);
  } else {
    /* resuming out of a descent: rewind the climb clock to the altitude the
       ship is actually at, or it snaps to the ground and re-climbs.  The
       inverse of smoothstep has no cheap closed form, so sqrt is the
       approximation — over a 0.4s transition it is invisible.           */
    p.jetT = JET_RISE*Math.sqrt(clamp(p.y/JET_Y,0,1));
    SFX.power(); toast("JET REFUELLED");
  }
  p.jet = JET_TIME;                 /* re-grabbing refills, never stacks */
  p.jetDown = 0;
}
/* the single restore path for the borrowed rig.  Anything that can cut a
   flight short — the descent finishing normally, or dying in mid-air — goes
   through here, so p.maxJumps can never be left at 0 and strand you without
   a double jump for the rest of the run.                                  */
function endJet(instant){
  var p=player; if(!p) return;
  p.jet=0; p.jetDown=0; p.jetBank=0; p.jetT=0;
  p.maxJumps = (p.jumpSave===undefined?2:p.jumpSave);
  p.h        = (p.hSave===undefined?2.35:p.hSave);
  p.r        = (p.rSave===undefined?1.05:p.rSave);
  if(instant){ p.y=0; p.vy=0; p.onGround=true; p.jumps=0; }
}
function updateJet(dt){
  var p=player;
  if(p.jet>0){
    p.jet -= dt; p.jetT += dt;
    var climb = clamp(p.jetT/JET_RISE,0,1);
    /* a slow idle hover on top of the climb so it never looks pinned to a
       grid line; scaled by climb so take-off stays clean                */
    p.y  = JET_Y*smooth(climb) + Math.sin(G.t*2.1)*0.17*climb;
    p.vy = 0;
    p.onGround = false; p.jumps = 0; p.maxJumps = 0;
    p.sliding = 0; p.ram = 0;       /* riding is impossible here: grabPickup
                                       cashes a jet out for score in the rover
                                       rather than half-dismounting you    */
    p.h = 2.05; p.r = 1.55;         /* wider, shorter: it is a ship now   */
    p.jetBank = lerp(p.jetBank, clamp(p.vx/19,-1,1), 1-Math.pow(0.004,dt));
    if(chance(dt*52))
      spawnPart(p.x+rnd(-0.5,0.5), p.y+0.30, p.z-1.3, rnd(-3,3), rnd(-3,1),
                rnd(-30,-16), rnd(0.14,0.36),
                pick(["#ffd27a","#ff8a2a","#fff2c0","#ff5a10"]), rnd(0.5,1.2), 1);
    if(p.jet<=0){
      p.jet = 0; p.jetDown = JET_FALL; p.jetY0 = p.y;
      toast("JET OFFLINE"); flashIt("#ff9a3a",0.16);
    }
    return true;
  }
  if(p.jetDown>0){
    p.jetDown -= dt;
    var k = clamp(1-p.jetDown/JET_FALL,0,1);
    p.y = Math.max(0, lerp(p.jetY0||JET_Y, 0, smooth(k)));
    p.jetBank = lerp(p.jetBank,0,1-Math.pow(0.004,dt));
    if(p.jetDown<=0){
      endJet(true);
      SFX.land(); dustBurst(p,16);
    }
    return true;
  }
  return false;
}
function updatePlayer(dt){
  var p=player, lv=G.lv;
  if(p.spawnT>0) p.spawnT-=dt;
  /* THE SIEGE owns the player outright — see updateArena().  Returning here
     is what stops the lane code and the arena code fighting over p.x/p.z;
     nothing below this line runs inside the colonnade.                    */
  if(G.arena){
    if(p.dead){ p.deadT+=dt; return; }
    if(updateArena(dt)) return;
  }
  p.speed=levelSpeed();
  if(p.dead){ p.deadT+=dt; p.z+=p.speed*0.25*dt; return; }
  /* the jet owns altitude while it is up, so it runs before anything that
     might want to read or write p.y                                     */
  var airborne = updateJet(dt);
  var flying = p.jet>0;
  /* --- lateral movement with momentum + per-level traction --------- */
  var traction = (lv.hazard==="ice")?0.42:1.0;
  var onIce=false;
  for(var i=0;i<ents.length;i++){ var h=ents[i];
    if(h.kind==="hazard"&&h.sub==="ice"&&Math.abs(h.z-p.z)<h.r*1.4&&Math.abs(h.x-p.x)<h.r)
      onIce=true; }
  if(airborne){ traction=1; onIce=false; }   /* four units up, ice is moot */
  var grip = traction*(onIce?0.45:1);
  /* the jet's whole feel is authority: it turns harder AND coasts further,
     so accel goes up 60% while the settling drag is halved              */
  var accel = 78*grip*(flying?1.6:1), drag = (onIce?1.4:9.0)*(flying?0.5:1);
  var dir=(IN.right?1:0)-(IN.left?1:0);
  if(dir!==0) p.vx += dir*accel*dt; else p.vx = approach(p.vx,0,drag*11,dt);
  p.vx = clamp(p.vx, flying?-25:-19, flying?25:19);
  p.x += p.vx*dt;
  if(p.x<-PLAYER_LIMIT){ p.x=-PLAYER_LIMIT; p.vx*=-0.28; }
  if(p.x> PLAYER_LIMIT){ p.x= PLAYER_LIMIT; p.vx*=-0.28; }
  p.tilt = lerp(p.tilt, clamp(p.vx/19,-1,1), 1-Math.pow(0.002,dt));
  /* --- jump / double jump ---------------------------------------- */
  if(!airborne && IN.jump && !p.jumpHeld){
    if(p.onGround){ p.vy=JUMP_V; p.onGround=false; p.jumps=1; SFX.jump(); dustBurst(p,10); }
    else if(p.jumps<p.maxJumps){ p.vy=JUMP_V*0.88; p.jumps++; SFX.jump(); dustBurst(p,8); }
  }
  p.jumpHeld=!!IN.jump;
  if(!airborne && !p.onGround){
    p.vy -= GRAV*dt*(IN.jump&&p.vy>0?0.72:1);   // hold to float a little
    p.y  += p.vy*dt;
    if(p.y<=0){ p.y=0; p.vy=0; p.onGround=true; p.jumps=0; SFX.land(); dustBurst(p,12); }
  }
  /* --- slide / duck (Down arrow), or the plough BLADE while driving --- */
  if(p.slideCd>0) p.slideCd-=dt;
  /* ordnance is buyable from sector 1, so its cooldowns cannot live only in
     updateArena() — a charge thrown in the lane would never re-arm.       */
  if(p.throwCd>0) p.throwCd-=dt;
  if(p.lockCd>0)  p.lockCd-=dt;
  if(airborne){
    /* nothing to do: startJet/updateJet already own h, r and the pose */
  }
  else if(p.riding){
    /* In the rover, DOWN drops the plough blade instead of ducking: wider
       sweep, double crush bonus, extra speed — but you give up the low
       profile, so drone fire you would have slid under now connects.     */
    var wasRam = p.ram>0.35;
    p.ram = IN.slide ? Math.min(1, p.ram + dt*3.4)
                     : Math.max(0, p.ram - dt*2.6);
    if(!wasRam && p.ram>0.35){ SFX.slide(); dustBurst(p,14); }
    p.sliding=0;
    p.h = ROVER_H*0.86 + RIDER_H;
    p.r = 1.42 + p.ram*0.62;           /* the sweep the crush box uses     */
    p.rideT += dt;
    if(p.ram>0.2 && chance(dt*22))
      spawnPart(p.x+rnd(-1,1), p.y+0.15, p.z+1.6, rnd(-4,4), rnd(1,5), rnd(-9,-2),
                rnd(0.2,0.45), pick([G.lv.dust,"#ffcf4a","#fff2c0"]), rnd(0.4,0.9), 1);
  } else {
    if(IN.slide && p.onGround && p.sliding<=0 && p.slideCd<=0){
      p.sliding=0.62; p.slideCd=0.34; SFX.slide(); dustBurst(p,16);
    }
    if(p.sliding>0){ p.sliding-=dt; if(!IN.slide&&p.sliding>0.16) p.sliding=0.16; }
    p.h = 2.35 - (p.sliding>0?1.25:0);
    p.ram = 0;
  }
  p.bob += dt*(p.onGround?p.speed*0.55:2.5);
  p.z += p.speed*dt;
  G.dist += p.speed*dt;
  if(p.inv>0) p.inv-=dt;
  if(p.hurtT>0) p.hurtT-=dt;
  if(p.rapid>0) p.rapid-=dt;
  if(p.shield>0) p.shield-=dt;
  if(p.quad>0) p.quad-=dt;
  updateFiring(dt);
}
/* ---------- 14. SHOOTING (the part that had no visible effect) ---- */
/* inLane() is the single source of truth for "can I shoot this".  Acquisition,
   the reticle, the homing correction and the damage test all call it, so the
   thing the crosshair locks onto is always the thing the bullet can kill.
   The boss is deliberately exempt: it is 26 units wide and sways with you, so
   a 3 m corridor would make it unhittable from anywhere but dead centre.    */
function inLane(e,p,extra){
  if(!e) return false;
  if(e.kind==="boss") return true;
  var w=(extra===undefined?LANE_DAMAGE_HALF:extra)+(e.r||0)*0.5;
  return Math.abs(e.x-p.x) < w;
}
function nearestTarget(p,maxZ,coneX){
  var best=null, bd=1e9;
  var cone=(coneX===undefined)?LANE_SHOOT_WIDTH:Math.min(coneX,LANE_SHOOT_WIDTH);
  for(var i=0;i<ents.length;i++){
    var e=ents[i];
    if(e.dead||e.kind==="hazard") continue;
    var dz=e.z-p.z; if(dz<1||dz>maxZ) continue;
    /* lane gate first, and with no distance term — the old "cone + dz*0.22"
       opened to 20 units wide at the far end, which is what let a stationary
       player delete the entire road without ever touching left or right   */
    if(!inLane(e,p,cone)) continue;
    var d=dz+Math.abs(e.x-p.x)*1.4;
    if(d<bd){ bd=d; best=e; }
  }
  if(boss && !boss.dead){
    var dzb=boss.z-p.z;
    if(dzb>1&&dzb<maxZ*2&&bd>dzb) best=boss;
  }
  return best;
}
/* GRIPS — WHY THIS IS SPLIT IN TWO -------------------------------------------
   There are two different questions here and the old code answered both with
   one number, which is exactly why the blaster kept reading as strapped to his
   chest instead of held in a paw.

   1. WHERE DOES THE SHOT COME FROM?  That is a world-space question — the
      tracer, the brass and the AI's line of sight all live in metres.  Fields
      `stand/slide/ride` (height above the feet) and `ox/sx/rx` (offset to his
      right) answer it.

   2. WHERE IS HIS HAND ON SCREEN?  That is NOT a world-space question.
      Dogelon is a billboard: drawPlayer() centres the sprite on the projection
      of his mid-height point and then scales it by hpx.  Project any other
      world height and you do not get the matching row of pixels, because the
      perspective divide is non-linear — at a typical chase distance the feet
      land ~12 px below where the sprite's feet actually are, and the old
      anchor's extra `z+0.85` push moved it a further ~26 px, i.e. 16% of his
      height, up the frame.  0.72 m above the feet therefore drew at CHEST
      level.  Fields `px/py` answer question 2 instead: fractions of hpx from
      the sprite's centre (px right, py down), so the paw is pinned to the art
      no matter what the camera is doing.
   Press K in-game to cycle the three presets and see the difference.       */
var GRIPS=[
  {name:"HAND (spec)", stand:1.06, slide:0.52, ride:0.98, ox:0.46, sx:0.54, rx:0.52,
                       px:0.235,  py:0.075},
  {name:"CHEST",       stand:1.24, slide:0.62, ride:1.32, ox:0.48, sx:0.54, rx:0.52,
                       px:0.200,  py:-0.050},
  {name:"SHOULDER",    stand:1.46, slide:0.74, ride:1.58, ox:0.52, sx:0.56, rx:0.54,
                       px:0.180,  py:-0.160}
];
function muzzlePos(p){
  /* world origin of the shot.  Kept close to p.z now (0.85 was a big enough
     push to visibly shrink and lift the projected point — see the note above) */
  var g=GRIPS[G.gripIdx||0];
  var base=g.stand, off=g.ox;
  if(p.sliding>0){ base=g.slide; off=g.sx; }
  if(p.riding && !p.dead){ base=ROVER_H*0.86 + g.ride; off=g.rx; }
  if(p.jet>0){ base=0.55; off=0.06; }        /* wing cannons, near centre so
                                                the three-round fan reads
                                                symmetric about the nose   */
  return { x:p.x + off - p.tilt*0.10,
           y:base + p.y + Math.sin(p.bob*0.5)*0.05,
           z:p.z + 0.12 };
}
/* SCREEN position of the paw that holds the grip.  Deliberately mirrors the
   two lines at the top of drawPlayer() rather than borrowing its `pt`, so any
   caller (the gun, the muzzle flash) can ask for it independently and they can
   never disagree about where his hand is.                                   */
function pawAnchor(p,hpx){
  var riding = p.riding && !p.dead;
  var bodyH  = riding ? RIDER_H : p.h;
  var baseY  = riding ? (p.y + ROVER_H*0.86) : p.y;
  var pt=project(p.x, baseY + bodyH*0.5, p.z);
  if(!pt) return null;
  if(!hpx) hpx=bodyH*pt.s;
  var g=GRIPS[G.gripIdx||0], px=g.px, py=g.py;
  /* sliding, the whole silhouette is short and long, and the arm punches
     forward rather than hanging: shift the paw up and further out.          */
  if(p.sliding>0){ px=g.px+0.045; py=g.py-0.115; }
  else if(riding){ px=g.px+0.040; py=g.py-0.045; }
  /* he leans into a lane change, so the paw swings with the lean            */
  px += clamp(p.tilt,-1,1)*0.035;
  return { x:pt.x + hpx*px, y:pt.y + hpx*py, s:pt.s, cx:pt.x, cy:pt.y, hpx:hpx };
}
/* both hands go to the wheel when the plough blade drops, so the weapon is
   stowed — and a stowed weapon cannot fire.  drawBlaster() honours the same
   test, otherwise a muzzle flash would bloom off an empty paw.             */
function gunOut(p){ return !(p.riding && p.ram>0.35); }
function updateFiring(dt){
  var p=player;
  if(p.fireCd>0) p.fireCd-=dt;
  if(p.muzzle>0) p.muzzle-=dt;
  if(p.recoil>0) p.recoil-=dt;
  if(p.shootT>0) p.shootT-=dt;
  if(!IN.fire||p.fireCd>0||p.spawnT>0) return;
  if(!gunOut(p)) return;                 /* blade down = both paws on the wheel */
  if(!arenaCanFire(p)) return;           /* flat behind a pillar = no shot      */
  var rate = p.rapid>0 ? p.fireRate*0.45 : p.fireRate;
  p.fireCd = rate;
  var m=muzzlePos(p), tgt=nearestTarget(p,110,LANE_SHOOT_WIDTH);
  /* inside the colonnade the Kaiju is the only target and it is 82 m out at
     the first rank, so acquisition cannot be capped at 110                */
  if(G.arena) tgt=(boss&&!boss.dead)?boss:null;
  var dmg=p.dmg*(p.quad>0?3:1);
  var shots = p.quad>0?3:1;
  /* the jet's wing cannons fire a fixed three-round fan regardless of quad,
     so the power-ups stack into a five-round curtain rather than overriding */
  var jetFan = p.jet>0;
  if(jetFan) shots = (p.quad>0?5:3);
  /* jump-shooting the Kaiju lifts your aim to its head — 2.2x damage.
     "Aim for the head" is a real mechanic, not flavour text.          */
  var high = !!(tgt && tgt.kind==="boss" && p.y>0.6);
  var aimCore = !!(G.arena && tgt===boss && coreOpen(boss));
  for(var s=0;s<shots;s++){
    var mid=(shots-1)*0.5;
    var spread=(shots>1)?((s-mid)*(jetFan?0.08:0.055)):0;
    var vx=spread*90, vy=0, vz=112;
    if(tgt){                                  /* gentle aim assist */
      var dz=Math.max(4,tgt.z-m.z);
      var ay=tgt.y+tgt.h*(high?0.80:0.45);
      if(aimCore) ay=coreY(boss);
      vx += clamp((tgt.x-m.x)/dz*vz, -34, 34);
      /* the core sits 21 m up.  From the back rank that is a 28 unit rise, but
         from the front rank it is 95 — so the arena needs a taller ceiling on
         the assist or every close-range shot would fall short of the eye.  */
      vy += clamp((ay-m.y)/dz*vz, -30, G.arena?150:62);
    }
    bullets.push({ x:m.x, y:m.y, z:m.z, px:m.x, py:m.y, pz:m.z,
      vx:vx, vy:vy, vz:vz, life:1.35, dmg:dmg, r:0.9, born:G.t,
      home:tgt?0.9:0.35, hi:high?1:0, lane:p.x, arena:G.arena?1:0,
      hue:(p.quad>0?"q":"n"), trail:[] });
  }
  /* instant streak so *every* trigger pull is visible, even at 60m/s */
  streaks.push({x:m.x,y:m.y,z:m.z, tx:(tgt?tgt.x:m.x), ty:(tgt?tgt.y+1:m.y),
                tz:m.z+(tgt?Math.min(tgt.z-m.z,70):52), t:0.10, T:0.10});
  /* MUZZLE holds a frame longer than the old 0.075s, and shootT holds the
     blast pose for longer than one shot interval, so while the trigger is
     down Dogelon stays visibly braced with the weapon up instead of
     cycling the plain walk sheet                                        */
  p.muzzle=MUZZLE_T; p.shootT=0.22; p.recoil=0.12;
  p.heat=Math.min(1,p.heat+0.10);
  G.shots++; SFX.shoot(); shakeIt(1.1);
  /* hot brass out of the ejection port — small, but it sells "a gun fired" */
  for(var sp=0;sp<3;sp++)
    spawnPart(m.x,m.y,m.z,rnd(-7,-2),rnd(1,4),rnd(-4,4),rnd(0.25,0.5),
              pick(["#ffd27a","#ff9a4d","#fff2c0"]),rnd(0.22,0.4),1);
  spawnPart(m.x,m.y,m.z,rnd(-3,3),rnd(-1,3),rnd(6,16),0.16,"#ffd27a",0.5,1);
}
var MUZZLE_T=0.11;
var streaks=[];
function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.px=b.x; b.py=b.y; b.pz=b.z;
    /* every round remembers the lane it was fired from.  Using the *live*
       player x here would let a bullet already in flight retarget the moment
       you strafed, and would also expire your own shots behind you; pinning
       the corridor at trigger-pull keeps it stable and still means you have
       to physically move into a lane before you can clear it.             */
    if(b.lane===undefined) b.lane=player.x;
    if(b.home>0){                             /* visible homing correction */
      var t=nearestTarget(player,120,LANE_SHOOT_WIDTH);
      /* the assist may only pull toward something inside the same corridor —
         otherwise the homing itself would drag rounds across the lanes and
         quietly undo the restriction                                      */
      if(t && !inLane(t,{x:b.lane},LANE_SHOOT_WIDTH)) t=null;
      if(t){
        var dz=Math.max(3,t.z-b.z);
        var ay=t.y+t.h*(b.hi?0.80:0.45);
        /* in the arena the assist pulls to the CORE while it is open, because
           that is the only box that scores — anywhere else is plating.  The
           pull is weak (0.45 cap), so it helps your aim without taking the
           shot for you: you still have to be leaning out and lined up.    */
        if(G.arena && t===boss && coreOpen(boss)) ay=coreY(boss);
        b.vx=lerp(b.vx, (t.x-b.x)/dz*b.vz, clamp(b.home*dt*7,0,0.45));
        b.vy=lerp(b.vy, (ay-b.y)/dz*b.vz, clamp(b.home*dt*7,0,0.45));
      }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
    b.life-=dt;
    /* drifted out of its lane: dies here, deals nothing.  Arena rounds are
       exempt — the colonnade floor is 26.8 m wide and you are MEANT to be
       shooting across it from the wings, so a 4 m corridor would delete
       every shot the finale asks you to take.                            */
    var strayed = !b.arena && Math.abs(b.x-b.lane) > LANE_SHOOT_WIDTH+1.2;
    var hitSomething=false;
    if(!strayed) for(var j=0;j<ents.length;j++){
      var e=ents[j];
      if(e.dead||e.kind==="hazard") continue;
      if(Math.abs(e.z-b.z) > e.r+2.4) continue;
      if(!inLane(e,{x:b.lane})) continue;      /* out of lane, out of luck */
      var dx=e.x-b.x, dy=(e.y+e.h*0.45)-b.y;
      if(dx*dx+dy*dy < (e.r+1.5)*(e.r+1.5)){ damage(e,b.dmg,b); hitSomething=true; break; }
    }
    if(!hitSomething && !strayed && boss && !boss.dead){
      if(G.arena){
        /* the arena has its own hit model: plating absorbs, only the core
           counts.  No lane gate, and a deeper z window because the Kaiju is
           30 m across and 36 m tall at this range.                        */
        if(Math.abs(boss.z-b.z)<8.5 && arenaBossHit(b)) hitSomething=true;
      } else {
        var bz=boss.z, bx=boss.x;
        if(Math.abs(bz-b.z)<6.5 && Math.abs(bx-b.x)<boss.w*0.5 &&
           b.y>boss.y && b.y<boss.y+boss.h){
          var head = b.y > boss.y+boss.h*0.68;
          damage(boss, b.dmg*(head?2.2:1), b, head); hitSomething=true;
        }
      }
    }
    /* an arena round that sails past the Kaiju is spent; without this it
       would fly on for its whole 1.35 s life and clutter the sky.         */
    if(!hitSomething && b.arena && boss && b.z > boss.z+10) hitSomething=true;
    if(hitSomething || strayed || b.life<=0 || b.y<-1 || Math.abs(b.x)>ROAD_HALF+22)
      bullets.splice(i,1);
  }
  for(var s=streaks.length-1;s>=0;s--){ streaks[s].t-=dt; if(streaks[s].t<=0) streaks.splice(s,1); }
  for(var k=ebullets.length-1;k>=0;k--){
    var eb=ebullets[k];
    eb.px=eb.x; eb.py=eb.y; eb.pz=eb.z;
    eb.x+=eb.vx*dt; eb.y+=eb.vy*dt; eb.z+=eb.vz*dt; eb.life-=dt;
    var p=player;
    if(!p.dead && Math.abs(eb.z-p.z)<1.8 &&
       Math.abs(eb.x-p.x)<p.r+0.7 && eb.y>p.y-0.3 && eb.y<p.y+p.h){
      hurtPlayer(14,"shot"); ebullets.splice(k,1); continue;
    }
    if(eb.life<=0||eb.z<p.z-6) ebullets.splice(k,1);
  }
}
/* ---------- 15. damage + feedback -------------------------------- */
function damage(e,dmg,b,head){
  G.hits++;
  e.hp-=dmg; e.flash=0.13; e.hitT=0.2;
  e.z += 0.9;                                    /* visible knock-back */
  if(e.kind==="drone"||e.kind==="walker") e.x += (b?sign(e.x-b.x):0)*0.12;
  var px=b?b.x:e.x, py=b?b.y:e.y+e.h*0.5, pz=b?b.z:e.z;
  for(var i=0;i<10;i++)
    spawnPart(px,py,pz, rnd(-9,9),rnd(-3,11),rnd(-14,4), rnd(0.18,0.42),
              pick(["#fff3c4","#ffb14d","#ff6a2a"]), rnd(0.35,0.8),1);
  pops.push({x:px,y:py,z:pz,txt:(head?"CRIT ":"")+Math.round(dmg),
             t:0.72,T:0.72,col:head?"#ff5a5a":"#ffe6a0",sz:head?26:20});
  SFX.hit(G.combo); shakeIt(head?3.4:1.7);
  if(e.hp<=0 && !e.dead) killEnt(e,b);
}
function killEnt(e,b){
  e.dead=1; e.deadT=0;
  if(e===boss){ bossDown(); return; }
  G.kills++;
  G.combo++; G.comboT=2.6; G.maxCombo=Math.max(G.maxCombo,G.combo);
  var mult=1+Math.min(G.combo,25)*0.10;
  var pts=Math.round(e.score*mult);
  G.score+=pts;
  pops.push({x:e.x,y:e.y+e.h*0.8,z:e.z,txt:"+"+pts,t:1.0,T:1.0,
             col:"#7dffb0",sz:24});
  if(G.combo>1) pops.push({x:e.x,y:e.y+e.h*1.25,z:e.z,txt:"x"+G.combo+" COMBO",
             t:1.1,T:1.1,col:"#ffd27a",sz:18});
  for(var i=0;i<26;i++)
    spawnPart(e.x,e.y+e.h*0.5,e.z, rnd(-13,13),rnd(-4,15),rnd(-18,8),
              rnd(0.3,0.8), pick(["#fff","#ffd27a","#ff7a2a","#ff3a2a"]),
              rnd(0.5,1.5),1);
  rings.push({x:e.x,y:e.y+e.h*0.4,z:e.z,r:0.4,max:e.r*4.2,t:0.42,T:0.42,col:"#ffb877"});
  SFX.kill(); shakeIt(6.5); flashIt("#ffbb77",0.16);
  /* two frames of hit-stop: the freeze is what makes a kill *land* */
  G.hitStop=Math.max(G.hitStop,0.045);
  /* tier-1 bots (the armoured drones, e.tier>=1) carry a 10% jet.  Gated on
     tier so the jet stays a reward for taking on the harder targets rather
     than something that falls out of the first thing you shoot, and gated on
     the level rules so ROVER RUN and the boss never drop one.            */
  if((e.tier|0)>=1 && !G.lv.ride && G.lvIdx!==5 && e.kind!=="boss" && chance(0.10))
    spawnPickup(e.z-1, e.x, "jet");
  else if(chance(0.30)) spawnPickup(e.z-1, e.x, chance(0.6)?"coin":null);
  if(G.combo%5===0){ slowmo(0.10); toast("COMBO x"+G.combo+"!"); }
}
function hurtPlayer(amount,why){
  var p=player;
  if(p.dead||p.inv>0) return;
  /* In the rover, a collision is damage the *plough* deals, not damage you
     take: "walker"/"drone"/"ruin" are body contact and are cancelled here.
     Everything else still lands — enemy fire ("shot"), terrain ("lava",
     "gate", "rock") and the Kaiju ("beam", "shock") — which is what makes
     the blade trade-off real and keeps ejectRider() reachable.             */
  if(p.riding && (why==="walker"||why==="drone"||why==="ruin")) return;
  if(p.shield>0){ p.shield=0; p.inv=1.1; SFX.deny(); flashIt("#7dd8ff",0.30);
    toast("SHIELD BROKEN"); shakeIt(10); return; }
  amount=Math.max(1,Math.round(amount*DIFFS[G.diff].dmg));
  p.hp-=amount; p.inv=1.25; p.hurtT=0.4; G.combo=0;
  SFX.hurt(); shakeIt(15); flashIt("#ff3a3a",0.38);
  pops.push({x:p.x,y:p.y+2.1,z:p.z,txt:"-"+amount,t:0.8,T:0.8,col:"#ff6a6a",sz:24});
  for(var i=0;i<18;i++)
    spawnPart(p.x,p.y+1.2,p.z,rnd(-8,8),rnd(0,10),rnd(-6,6),rnd(0.2,0.5),"#ff5a4a",0.9,1);
  if(p.hp<=0){ if(p.riding) ejectRider(); else killPlayer(); }
}
function killPlayer(){
  var p=player; if(p.dead) return;
  p.dead=true; p.deadT=0; p.hp=0; G.combo=0;
  SFX.boom(); shakeIt(26); flashIt("#ff2a2a",0.5); slowmo(0.35);
  for(var i=0;i<44;i++)
    spawnPart(p.x,p.y+1.2,p.z,rnd(-16,16),rnd(0,20),rnd(-14,14),
      rnd(0.4,1.1),pick(["#fff","#ffd27a","#ff6a2a","#ff2a2a"]),rnd(0.6,1.8),1);
  rings.push({x:p.x,y:p.y+1,z:p.z,r:0.5,max:9,t:0.6,T:0.6,col:"#ff9a6a"});
  G.lives--;
  G.timer=0;
  G.state = (G.lives>0) ? "DEAD" : "OVER";
  if(G.state==="OVER"){ SFX.over(); G.best=Math.max(G.best,G.score); }
}
function respawn(){
  var p=player;
  p.dead=false; p.hp=p.maxHp; p.inv=2.6; p.x=0; p.vx=0; p.y=0; p.vy=0;
  p.onGround=true; p.sliding=0; p.spawnT=0.75;
  /* a respawn on a non-ride level must never inherit the mount's hitbox */
  if(!G.lv.ride && p.riding) dismountRover();
  /* nor the jet's.  p.h/p.r/p.maxJumps are only put back at the END of the
     descent, and dying in mid-air cuts the descent off, so restore here. */
  if(p.jet>0 || p.jetDown>0) endJet(true);
  /* clear the immediate area so you don't die on arrival */
  for(var i=ents.length-1;i>=0;i--)
    if(ents[i].z > p.z-6 && ents[i].z < p.z+44) ents.splice(i,1);
  ebullets.length=0;
  rings.length=0;
  /* going back into the boss fight must not drop you into the normal
     runner state, or the director would spawn drones mid-Kaiju          */
  G.state = (boss && !boss.dead) ? "BOSS" : "PLAY";
  flashIt("#7dd8ff",0.34);
  for(var j=0;j<26;j++)
    spawnPart(p.x,p.y+1,p.z,rnd(-7,7),rnd(0,9),rnd(-7,7),rnd(0.3,0.7),"#8fe6ff",1,1);
}
/* ---------- 16. particles / popups / rings ----------------------- */
/* nog=1 makes a particle weightless and stops it bouncing off the ground —
   ashfall cinders have to drift upward for their whole life, and a bounce at
   y=0 would give them a visible floor the rest of the level does not have. */
function spawnPart(x,y,z,vx,vy,vz,life,col,size,glow,nog){
  if(parts.length>620) parts.shift();
  parts.push({x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,life:life,T:life,col:col,
              s:size||0.6,g:glow?1:0,ng:nog?1:0});
}
function dustBurst(p,n){

              rnd(-9,-1),rnd(0.25,0.6),G.lv.dust,rnd(0.4,1.0),0);
}
function updateFx(dt){
  for(var i=parts.length-1;i>=0;i--){
    var q=parts[i];
    q.life-=dt; if(q.life<=0){ parts.splice(i,1); continue; }
    if(!q.ng) q.vy-=18*dt;
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
    if(q.y<0 && !q.ng){ q.y=0; q.vy*=-0.32; q.vx*=0.7; q.vz*=0.7; }
  }

  }
  for(var k=rings.length-1;k>=0;k--){

/* ---------- 17. enemies ----------------------------------------- */
function updateEnts(dt){
  var p=player;
  for(var i=ents.length-1;i>=0;i--){
    var e=ents[i];
    if(e.flash>0) e.flash-=dt;
    if(e.dead){ e.deadT+=dt; if(e.deadT>0.7){ ents.splice(i,1); } continue; }
    if(e.z < p.z-9){ ents.splice(i,1); continue; }
    if(e.z > p.z+FARZ+70){ ents.splice(i,1); continue; }
    if(e.kind==="drone"){
      e.anim+=dt*9;
      e.phase+=dt*e.spd;
      e.x += Math.cos(e.phase)*e.amp*dt*1.6;
      e.y  = clamp(e.y + Math.sin(e.phase*1.7)*dt*1.3, 1.2, 5.2);
      e.z += e.zSpd*dt*(1+ (e.tier?0.5:0));
      if(Math.abs(e.x)>ROAD_HALF+3) e.x=clamp(e.x,-ROAD_HALF-3,ROAD_HALF+3);
      e.fireCd-=dt;
      if(e.fireCd<=0 && e.z-p.z<70 && e.z-p.z>6){
        e.fireCd=rnd(1.7,3.6)/(1+tier()*0.18);
        enemyShot(e);
      }
    } else if(e.kind==="walker"){
      e.anim+=dt*7; e.step+=dt*7;
      e.x += e.vx*dt; e.z += e.zSpd*dt;
      if(Math.abs(e.x)>ROAD_HALF-0.5){ e.vx*=-1; e.x=clamp(e.x,-ROAD_HALF+0.5,ROAD_HALF-0.5); }
      e.fireCd-=dt;
      if(e.fireCd<=0 && e.z-p.z<58 && e.z-p.z>5){ e.fireCd=rnd(2.2,4.4); enemyShot(e); }
    } else if(e.kind==="hazard"){
      e.t+=dt;
      if(e.hitCd>0) e.hitCd-=dt;
      if(e.sub==="lava") e.active = (Math.sin(e.t*3.1+e.phase)>0.15)?1:0;
      if(e.sub==="gate") e.gapX = Math.sin(e.t*0.8+e.phase)*4.2;
    }
    collideEnt(e,dt);
  }
}
function enemyShot(e){
  var p=player, dz=Math.max(6,e.z-p.z), sp=48+tier()*7;
  var lead=0.35;
  var tx=p.x+p.vx*lead, ty=p.y+0.9;
  ebullets.push({x:e.x,y:e.y+e.h*0.4,z:e.z,px:e.x,py:e.y,pz:e.z,
    vx:(tx-e.x)/dz*sp, vy:(ty-(e.y+e.h*0.4))/dz*sp, vz:-sp,
    life:3.0, r:0.5});
  tone(300,0.1,"sawtooth",0.10,900);
}
function collideEnt(e,dt){
  var p=player;
  if(p.dead||p.spawnT>0) return;
  var dz=e.z-p.z;
  if(dz>2.4||dz<-2.0) return;
  var dx=Math.abs(e.x-p.x);
  if(e.kind==="hazard"){
    if(e.ruin){ collideRuin(e,dx,dz); return; }
    if(e.sub==="ice") return;
    if(e.sub==="lava"){ if(e.active && dx<e.r+0.7 && p.y<1.5) hurtPlayer(20,"lava"); return; }
    if(e.sub==="gate"){
      var inGap = Math.abs(p.x-e.gapX)<2.6;
      /* JET: four units up clears the pylon outright — that is the whole
         reason the jet exists in ELON SPIRE.  Credited once per gate so it
         reads as a stunt you pulled, not as a hitbox that quietly failed. */
      if(p.jet>0 && p.y>2.4){
        if(!e.flew){
          e.flew=1; G.score+=120;
          pops.push({x:p.x,y:p.y+1.1,z:p.z+7,txt:"CLEARED +120",t:0.75,T:0.75,
                     col:"#ffd27a",sz:20});
        }
        return;
      }
      if(!inGap && p.y<2.4) hurtPlayer(24,"gate");
      return;
    }
    if(e.sub==="rock"){ if(dx<e.r+0.8 && p.y<1.6) hurtPlayer(18,"rock"); return; }
    return;
  }
  if(dx > e.r+p.r) return;
  /* vertical dodge windows: slide under drones, jump over ground units */
  var eLo=e.y, eHi=e.y+e.h;
  var pLo=p.y, pHi=p.y+p.h;
  if(pHi<eLo-0.15 || pLo>eHi-0.15) return;
  /* IN THE ROVER: contact is offence.  Anything the plough touches is scrap
     and paid out, and nothing it touches costs you HP.                    */
  if(p.riding){ crush(e); return; }
  if(e.kind==="walker") hurtPlayer(24,"walker");
  else hurtPlayer(18,"drone");
  /* the bot takes a hit too — a body-check kills weak drones */
  damage(e, 2, null);
}
/* ---- THE RUIN COURSE: barrier / arch / tower ---------------------------
   Three obstacles, one control each, which is the whole point of them: the
   JUMP and SLIDE keys existed but nothing in the world ever demanded them, so
   the lane was a left/right corridor with decorations.  Now:

     barrier  a low wall, top at 1.45 m   -> JUMP  (jump apex clears ~2.6 m,
                                             the 1.10 m slide profile does NOT
                                             fit under a solid wall)
     arch     a crossbeam whose underside sits at 1.35 m, legs to either side
                                          -> SLIDE (standing profile is 2.35 m
                                             and hits it; sliding is 1.10 m and
                                             passes; jumping cannot get over
                                             the 5.6 m top, so it must be slid)
     tower    a solid spire, lane-blocking -> STEER (no vertical answer at all)

   Clean passes pay out, and G.ruinCleared drives the coaching prompt so the
   first three arrive one kind at a time and teach themselves.            */
function collideRuin(e,dx,dz){
  var p=player, span=e.span||e.r;
  /* passed it cleanly — book the clear on the way out                     */
  if(dz<-0.5){
    if(!e.cleared && !e.hit){
      e.cleared=1; G.ruinCleared++;
      var v=e.sub==="tower"?40:60;
      G.score+=v; G.comboT=Math.max(G.comboT,2.2);
      pops.push({x:e.x,y:1.9,z:e.z,txt:(e.sub==="arch"?"UNDER":e.sub==="barrier"?"OVER":"PAST")+"  +"+v,
                 t:0.7,T:0.7,col:"#9fe8ff",sz:17});
      tone(660,0.07,"triangle",0.05,1180);
    }
    return;
  }
  if(dx > span + p.r*0.55) return;
  var pHi = p.y + p.h;
  var clear =
      e.sub==="barrier" ? (p.y > e.top-0.10) :
      e.sub==="arch"    ? (pHi < e.lo-0.05 || p.y > e.hi) :
                          false;                     /* towers: no way over */
  if(clear) return;
  /* the plough turns low stonework into gravel; arches and spires are load
     bearing and will still stop a rover dead                              */
  if(p.riding && e.sub==="barrier" && !e.smashed){
    e.smashed=1; e.cleared=1; e.dead=1; e.deadT=0; G.ruinCleared++;
    G.score+=90; G.crushes++;
    ruinDebris(e,26);
    pops.push({x:e.x,y:1.7,z:e.z,txt:"SMASHED +90",t:0.8,T:0.8,col:"#ffcf4a",sz:20});
    shakeIt(6); SFX.crunch&&SFX.crunch(); tone(120,0.14,"square",0.13,220);
    return;
  }
  if(e.hitCd>0) return;
  e.hit=1; e.hitCd=0.6;
  ruinDebris(e,14);
  hurtPlayer(e.sub==="tower"?26:20,"ruin");
  /* a wall does not just hurt, it stops you: kill the forward lean and shove
     the runner back a touch so the impact is felt as well as read          */
  p.vx*=-0.35; p.tilt*=0.4;
  if(!p.riding && p.y>0.05){ p.vy=Math.min(p.vy,-2); }
}
function ruinDebris(e,n){
  var pal = RUIN_PAL[e.style] || RUIN_PAL.stone;
  for(var i=0;i<n;i++)
    spawnPart(e.x+rnd(-(e.span||1),(e.span||1)), rnd(0.3,Math.min(3.2,e.h)), e.z,
              rnd(-11,11), rnd(1,13), rnd(-16,4), rnd(0.3,0.8),
              pick([pal.lo,pal.mid,pal.hi]), rnd(0.5,1.4), 0);
  rings.push({x:e.x,y:0.3,z:e.z,r:0.4,max:(e.span||2)*3.4,t:0.5,T:0.5,col:pal.hi});
}
/* ---- ROVER RUN: crush -------------------------------------------------
   Kills outright regardless of HP — six wheels and a plough do not chip away
   at a drone.  Pays the normal kill score (via killEnt) plus a flat ride
   bonus, doubled with the blade down, and every hit re-arms the combo so a
   clean run chains the whole stage together.                             */
function crush(e){
  var p=player;
  if(e.dead) return;
  if(e.ruin){ collideRuin(e,Math.abs(e.x-p.x),e.z-p.z); return; }
  G.crushes++;
  var bladed=p.ram>0.35;
  var bonus=Math.round(RIDE_BONUS*(bladed?2:1));
  G.score+=bonus;
  /* killEnt() is still the right kill path — it books the score, the combo and
     the pickup drop — but its two floating labels and its two frames of
     hit-stop are tuned for one deliberate kill.  At this cadence they become
     strobing mush, so the freeze is restored afterwards and killEnt's popups
     are trimmed away, leaving exactly one label per flattened bot.        */
  var hs=G.hitStop, np=pops.length;
  e.hp=0; killEnt(e,null);
  G.hitStop=hs;
  pops.length=Math.min(pops.length,np);
  pops.push({x:e.x,y:e.y+e.h*1.15,z:e.z,
             txt:(bladed?"SHREDDED  +":"FLATTENED  +")+bonus,
             t:0.95,T:0.95,col:"#ffcf4a",sz:bladed?24:19});
  shakeIt(bladed?4.5:2.5); flashIt("#ffcf4a",0.09);
  G.comboT=Math.max(G.comboT,2.6);
  /* killEnt already threw 26 particles; this is a short gold accent on top,
     not a second explosion                                                */
  for(var i=0;i<9;i++)
    spawnPart(e.x,e.y+e.h*0.45,e.z, rnd(-17,17),rnd(0,15),rnd(-24,3),
              rnd(0.25,0.6), pick(["#ffcf4a","#ff7a2a","#fff"]), rnd(0.5,1.2),1);
  rings.push({x:e.x,y:e.y+e.h*0.4,z:e.z,r:0.4,max:e.r*7,t:1.2,T:1.2,col:"#ffcf4a"});
  tone(90,0.16,"square",0.14,180);
}
function updatePickups(dt){
  var p=player;
  for(var i=pickups.length-1;i>=0;i--){
    var k=pickups[i]; k.t+=dt;
    if(k.z<p.z-6){ pickups.splice(i,1); continue; }
    if(k.got) continue;
    /* magnet: coins drift toward you when close.  Mounted, it becomes a
       proper hoverboard-style vacuum — 18 units of reach at 22 m/s — because
       in the rover you cannot make fine lateral corrections and the stage is
       supposed to pay out.                                                */
    if(k.kind==="coin"){
      var mr = p.riding?18:16, ms = p.riding?22:7;
      if(Math.abs(k.z-p.z)<mr) k.x=approach(k.x,p.x,ms,dt);
    }
    if(Math.abs(k.z-p.z)<2.0 && Math.abs(k.x-p.x)<2.0 &&
       p.y<k.y+1.4 && p.y+p.h>k.y-1.2){
      k.got=1; grabPickup(k); pickups.splice(i,1);
    }
  }
}
var coinStreak=0;
function grabPickup(k){
  var p=player;
  if(k.kind==="coin"){
    coinStreak++;
    var gain=Math.round(45*(1+Math.min(G.combo,20)*0.05));
    G.score+=gain;
    SFX.coin(coinStreak);
    pops.push({x:k.x,y:k.y+0.9,z:k.z,txt:"+"+gain,t:0.6,T:0.6,col:"#ffe06a",sz:17});
  } else if(k.kind==="hp"){
    p.hp=Math.min(p.maxHp,p.hp+34); SFX.power(); toast("+34 HP");
    flashIt("#7dffb0",0.2);
  } else if(k.kind==="rapid"){
    p.rapid=9; SFX.power(); toast("RAPID FIRE"); flashIt("#ffd27a",0.22);
  } else if(k.kind==="shield"){
    p.shield=12; SFX.power(); toast("SHIELD"); flashIt("#7dd8ff",0.22);
  } else if(k.kind==="quad"){
    p.quad=9; SFX.power(); toast("QUAD PLASMA"); flashIt("#d08cff",0.24);
  } else if(k.kind==="jet"){
    /* in the rover a jet is nonsense — you cannot fly six wheels.  Rather than
       drop the reward on the floor it cashes out, which also means ROVER RUN
       can never strand you in a half-state.                                */
    if(p.riding){ G.score+=400; SFX.power(); toast("+400 (NO JET IN THE ROVER)");
      pops.push({x:k.x,y:k.y+1,z:k.z,txt:"+400",t:0.8,T:0.8,col:"#ffd27a",sz:22}); }
    else startJet();
  } else if(k.kind==="nuke"){
    SFX.boom(); toast("EMP BURST"); flashIt("#ffffff",0.55); shakeIt(22);
    for(var i=ents.length-1;i>=0;i--){
      var e=ents[i];
      if(!e.dead && e.kind!=="hazard" && e.z<p.z+80) damage(e,999,null);
    }
    rings.push({x:p.x,y:1,z:p.z,r:1,max:60,t:0.7,T:0.7,col:"#ffffff"});
  }
  for(var j=0;j<14;j++)
    spawnPart(k.x,k.y,k.z,rnd(-6,6),rnd(0,8),rnd(-4,4),rnd(0.2,0.5),
              pickupCol(k.kind),0.7,1);
}
function pickupCol(k){
  return k==="coin"?"#ffd24a":k==="hp"?"#6dffa0":k==="rapid"?"#ffb14d":
         k==="shield"?"#7dd8ff":k==="quad"?"#cc7dff":k==="jet"?"#ffd27a":"#ffffff";
}
/* ---------- 18. KAIJU BOSS -------------------------------------- */
/* h was 20 and it held station 52 m out.  At the fight camera that filled
   barely a third of the frame — a distant lizard, not a kaiju.  28 tall at
   38 m fills roughly two thirds of a 720-line frame.  w stays 26 so the
   hit box and the beam origin are unchanged.                            */
var BOSS_Z=38, BOSS_H=28;
function makeBoss(){
  var b={ kind:"boss", x:0, y:0, z:player.z+BOSS_Z+24, w:26, h:BOSS_H, r:12,
    hp:340, maxHp:340, phase:1, dead:false, deadT:0, anim:0, flash:0,
    atk:2.2, mode:"idle", modeT:0, sway:0, roarT:0, hitT:0, score:9000,
    stomps:0, beam:0, beamX:0, beamDir:1, grow:0,
    /* arena-only.  core/coreT/coreCd are the chest weak point, stagger is the
       plating meter that opens it, didAttack alternates attack -> recovery so
       there is always a window to shoot into.                             */
    core:0, coreT:0, coreCd:0, stagger:0, warn:0, didAttack:0,
    salvo:0, salvoT:0, stompT:0 };
  /* THE SIEGE loadout.  20 crits x 100 hp = 2000, so the bar IS the crit
     counter; and he holds station at AR_BOSS instead of riding the lane. */
  if(G.arena){
    b.hp=b.maxHp=KAIJU_CRITS*CORE_DMG;
    b.h=BOSS_H*1.28; b.w=30; b.r=14;
    b.z=arenaBossZ(); b.mode="roar"; b.roarT=2.0; b.modeT=2.0;
  }
  return b;
}
function updateBoss(dt){
  var b=boss, p=player;
  if(!b) return;
  b.anim+=dt*4;
  /* entrance: 0.1x -> 1.0x of the target height over 1.2s, so it looms in
     rather than popping into existence at full size                       */
  if(b.grow<1) b.grow=Math.min(1,b.grow+dt/1.2);
  if(b.flash>0) b.flash-=dt;
  if(b.dead){ b.deadT+=dt; return; }
  /* ---- THE SIEGE takes over here.  No helper wave (the finale is a duel,
     not a crowd), no lane ride, and its own attack deck.                  */
  if(G.arena){
    updateArenaBoss(dt);
    var afr=b.hp/b.maxHp;
    var aph=afr>0.66?1:(afr>0.33?2:3);
    if(aph!==b.phase){
      b.phase=aph; b.modeT=0; b.mode="roar"; b.roarT=1.4; b.warn=0;
      b.didAttack=0; b.coreT=0; b.core=0; b.stagger=0;
      SFX.roar(); shakeIt(28); flashIt("#ff5a5a",0.42); slowmo(0.3);
      toast("KAIJU PHASE "+b.phase+" — IT IS ANGRY NOW");
    }
    b.modeT-=dt;
    if(G.bossIntro>0){ G.bossIntro-=dt; b.mode="roar"; b.roarT=Math.max(b.roarT,0.2); }
    else if(G.advT<=0 && b.modeT<=0) arenaBossMove();
    runArenaMove(dt);
    return;
  }
  /* helper wave on its own clock.  director() is switched off during BOSS,
     so without this the arena empties out and a boss fight turns into a
     staring contest.  Deliberately NOT routed through the director.      */
  G.bossHelp+=dt;
  if(G.bossHelp>=8){
    G.bossHelp=0;
    var want=1+(b.phase>1?1:0), room=sectorCap()-liveThreats();
    for(var hi=0;hi<Math.min(want,room);hi++)
      spawnDrone(p.z+rnd(46,72), laneX(irnd(0,LANES-1)), 1);
  }
  b.z = lerp(b.z, p.z+BOSS_Z, 1-Math.pow(0.02,dt));
  b.sway += dt*0.7;
  b.x = lerp(b.x, Math.sin(b.sway)*5.2 + p.x*0.35, 1-Math.pow(0.02,dt));
  var frac=b.hp/b.maxHp;
  var newPhase = frac>0.66?1:(frac>0.33?2:3);
  if(newPhase!==b.phase){
    b.phase=newPhase; b.modeT=0; b.mode="roar"; b.roarT=1.2;
    SFX.roar(); shakeIt(26); flashIt("#ff5a5a",0.4); slowmo(0.3);
    toast("KAIJU PHASE "+b.phase);
  }
  b.modeT-=dt;
  /* the arrival roar gets 1.6s of its own before the Kaiju may attack, so
     you are never beamed the instant it lands on screen                  */
  if(G.bossIntro>0){ G.bossIntro-=dt; b.mode="roar"; b.roarT=Math.max(b.roarT,0.2); }
  else if(b.modeT<=0) chooseBossMove();
  runBossMove(dt);
}
function chooseBossMove(){
  var b=boss, r=Math.random(), ph=b.phase;
  if(r<0.34){ b.mode="stomp"; b.modeT=1.5-ph*0.18; b.stomps=ph; }
  else if(r<0.62){ b.mode="beam"; b.modeT=2.3; b.beam=2.3;
    b.beamX=-ROAD_HALF; b.beamDir=chance(0.5)?1:-1;
    b.beamX=b.beamDir>0?-ROAD_HALF:ROAD_HALF; SFX.beam(); }
  else if(r<0.82){ b.mode="spawn"; b.modeT=1.4;
    for(var i=0;i<1+ph;i++)
      chance(0.5)?spawnDrone(player.z+rnd(40,70),laneX(irnd(0,LANES-1)),1)
                 :spawnWalker(player.z+rnd(40,70),laneX(irnd(0,LANES-1)),1); }
  else { b.mode="idle"; b.modeT=1.0; }
}
function runBossMove(dt){
  var b=boss, p=player;
  if(b.mode==="roar"){ b.roarT-=dt; if(b.roarT<=0) b.mode="idle"; return; }
  if(b.mode==="stomp"){
    if(b.stomps>0 && b.modeT < (1.5-b.phase*0.18) - (b.phase-b.stomps+1)*0.42){
      b.stomps--;
      rings.push({x:b.x,y:0.2,z:b.z,r:1,max:90,t:1.7,T:1.7,col:"#ff8a5a",
                  harm:1, speed:1});
      shakeIt(18); SFX.boom();
      for(var i=0;i<24;i++)
        spawnPart(b.x+rnd(-6,6),0.1,b.z,rnd(-10,10),rnd(2,12),rnd(-22,-4),
          rnd(0.4,0.9),G.lv.dust,rnd(0.8,2.0),0);
    }
  }
  if(b.mode==="beam"){
    b.beam-=dt;
    b.beamX += b.beamDir*dt*8.4;
    if(Math.abs(p.x-b.beamX)<2.9 && p.y<3.2 && !p.dead) hurtPlayer(9,"beam");
    for(var j=0;j<3;j++)
      spawnPart(b.beamX+rnd(-1,1),rnd(0.2,3),p.z+rnd(4,40),rnd(-2,2),rnd(1,5),
        rnd(-8,0),0.3,"#ff7ad2",rnd(0.4,1.1),1);
  }
}
/* harmful shockwave rings */
function updateRingsHarm(){
  var p=player;
  for(var i=0;i<rings.length;i++){
    var r=rings[i]; if(!r.harm) continue;
    var d=Math.sqrt(dist2(p.x,p.z,r.x,r.z));
    if(Math.abs(d-r.r)<2.4 && p.y<1.5 && !p.dead && !r.hitOnce){
      r.hitOnce=1; hurtPlayer(22,"shock");
    }
  }
}
function bossDown(){
  var b=boss;
  b.dead=true; b.deadT=0;
  G.score+=9000; G.bossDefeated=true;
  SFX.boom(); SFX.roar(); shakeIt(40); flashIt("#ffffff",0.7); slowmo(0.6);
  for(var i=0;i<120;i++)
    spawnPart(b.x+rnd(-9,9),rnd(1,17),b.z+rnd(-5,5),rnd(-20,20),rnd(2,26),
      rnd(-24,10),rnd(0.6,1.8),pick(["#fff","#ffd27a","#ff7a2a","#ff2a5a","#d08cff"]),
      rnd(0.9,2.6),1);
  G.state="WIN"; G.timer=0;
}
/* ---------- 18b. THE SIEGE — the Kaiju arena --------------------------------
   THE COMPLAINT THIS ANSWERS: "the kaiju scene is far too boring for an
   ending, dogelon is incapble of dodging the rays from the kaiju, he's
   basically on the lane troughout the fight ... no cool graphics like a wall
   he hide behind while the kaiju bombards him ... he only goes down after
   about three hits."  Four things had to change and all four are here.

   1. IT IS NOT A LANE.  The road stops at the colonnade.  Inside the arena
      p.z is pinned to a cover RANK and the lateral limit opens from 7.0 to
      AR_HALF (13.4), so the floor is a plaza you run across instead of a
      corridor you fall down.  project() is untouched — only cam parameters
      and two clamps move.
   2. THERE IS COVER.  G.covers holds one rank of broken Martian masonry.
      Hold DOWN near a pillar to slam into it; the pillar eats the sweep for
      you and loses HP doing it.  Lean out with LEFT/RIGHT while still in
      cover to shoot.  Safe but blind, or exposed and shooting — that trade
      is the fight.
   3. EVERY ATTACK HAS A DIFFERENT ANSWER.  sweep -> cover.  mortar -> move,
      because plunging fire ignores cover.  lance -> sprint, because it
      tracks slowly and burns straight through masonry.  stomp -> jump.  All
      four telegraph on the floor first, so "incapable of dodging" becomes a
      skill question instead of a dice roll.
   4. TWENTY CRITICAL HITS.  The hide is armour: body shots deal no HP at
      all, they build b.stagger.  Fill the stagger (or wait out a recovery)
      and the chest core irises open for a window; only shots inside the core
      box count, each is exactly CORE_DMG, and a coreCd between them stops
      one window dumping twenty.  maxHp is KAIJU_CRITS*CORE_DMG, which makes
      the existing boss bar a crit counter that cannot disagree with G.crits
      — and damage() / killEnt() / bossDown() needed no changes at all.

   The rank push gives the fight a shape: every CRITS_PER_LINE crits the
   Kaiju reels, Dogelon sprints to the next rank, and the monster is closer
   and louder than it was.  Four ranks, five crits each, twenty.          */
var KAIJU_CRITS=20, CORE_DMG=100, CRITS_PER_LINE=5;
var AR_HALF=13.4;                    /* half-width of the arena floor       */
var AR_LINES=[0,22,42,58];           /* rank z, measured from G.arenaZ0      */
var AR_BOSS=82;                      /* the z the Kaiju holds, forever       */
var COVER_HP=120, STAGGER_MAX=220, MORT_WARN=1.25;
function arenaBossZ(){ return G.arenaZ0+AR_BOSS; }
function rankZ(i){ return G.arenaZ0 + AR_LINES[clamp(i,0,AR_LINES.length-1)]; }
/* One rank of masonry.  The kinds are mostly silhouette — "wall" is wide and
   low, "pillar" is narrow and tall, "altar" is squat with a rune bowl — what
   matters mechanically is x, half-width w and hp.  Seven of them across a
