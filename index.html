   26.8 m floor means there is always another one to run to, which is what
   stops a destroyed pillar being a death sentence.                       */
var COVER_KINDS=["pillar","wall","altar"];
function buildCoverLine(i){
  G.covers.length=0;
  var z=rankZ(i)+3.4, n=7;
  for(var k=0;k<n;k++){
    var f=(k/(n-1))*2-1;                        /* -1 .. 1 across the floor  */
    var kind=COVER_KINDS[(k+i)%3];
    G.covers.push({
      x:f*(AR_HALF-2.0)+rnd(-0.5,0.5), z:z+rnd(-2.6,2.6),
      w:kind==="wall"?2.05:(kind==="pillar"?1.15:1.60),
      h:kind==="wall"?2.30:(kind==="pillar"?5.40:1.75),
      kind:kind, hp:COVER_HP, maxHp:COVER_HP, rubble:0, dead:0,
      seed:Math.random()*100, flash:0, shakeT:0, id:k });
  }
  G.lastCover=null;
  if(player){ player.cover=0; player.coverId=-1; player.peek=0; }
}
function buildArena(){
  G.arena=true; G.arenaT=0; G.line=0; G.advT=0; G.advFrom=0; G.crits=0;
  G.mortars=[]; G.warnT=0; G.warnKind=""; G.lanceT=0; G.lanceX=0;
  G.arenaHint=7.0; G.coreHint=0;
  /* the mouth of the colonnade is wherever the run happened to end, so the
     approach never cuts — Dogelon simply runs in off the road            */
  G.arenaZ0=player?player.z:0;
  buildCoverLine(0);
  ents.length=0; ebullets.length=0; rings.length=0;
}
function coverById(id){
  for(var i=0;i<G.covers.length;i++)
    if(G.covers[i].id===id) return G.covers[i];
  return null;
}
/* the cover you are entitled to: nearest standing masonry, just in front of
   you, on the rank you are holding                                        */
function nearestCover(p){
  var best=null, bd=1e9;
  for(var i=0;i<G.covers.length;i++){
    var c=G.covers[i];
    if(c.rubble>=2) continue;
    var dx=Math.abs(c.x-p.x), dz=c.z-p.z;
    if(dx>c.w+1.6) continue;
    if(dz<-0.8 || dz>6.4) continue;
    var d=dx+Math.abs(dz)*0.4;
    if(d<bd){ bd=d; best=c; }
  }
  return best;
}
/* the masonry actually between you and the Kaiju right now, or null */
function coverBlocks(p){
  if(!G.arena || p.cover<=0.5 || p.coverId<0) return null;
  var c=coverById(p.coverId);
  return (c && c.rubble<2) ? c : null;
}
/* THE ARENA MOVEMENT MODEL.  Returns true once it has taken ownership of the
   player for this substep, so updatePlayer() skips the lane code entirely and
   the two can never fight over p.x / p.z.  Everything here uses the SAME five
   inputs the rest of the game uses, which is deliberate: the touch pad has
   exactly five buttons and the finale is not allowed to need a sixth.     */
function updateArena(dt){
  var p=player;
  G.arenaT+=dt;
  if(G.arenaHint>0) G.arenaHint-=dt;
  if(p.throwCd>0)   p.throwCd-=dt;
  if(p.lockCd>0)    p.lockCd-=dt;
  /* the camera reads p.speed; in here that has to be how fast he is actually
     moving, not the lane's scroll rate, or the rig drifts back and up.    */
  p.speed=Math.abs(p.vx)*0.85;
  /* --- the rank push: a scripted sprint, invulnerable ------------------ */
  if(G.advT>0){
    G.advT-=dt;
    var k=1-clamp(G.advT/1.15,0,1), sm=k*k*(3-2*k);
    p.z=lerp(G.advFrom,rankZ(G.line),sm);
    p.cover=0; p.coverId=-1; p.peek=0; p.sliding=0;
    p.inv=Math.max(p.inv,0.25); p.h=2.35; p.bob+=dt*12;
    if(chance(dt*26))
      spawnPart(p.x+rnd(-0.8,0.8),0.12,p.z-0.7,rnd(-3,3),rnd(1,5),rnd(-7,-1),
                rnd(0.2,0.5),G.lv.dust,rnd(0.4,1.0),0);
    if(G.advT<=0){ p.z=rankZ(G.line); SFX.land(); shakeIt(9); }
    updateCovers(dt); updateMortars(dt); updateFiring(dt);
    return true;
  }
  /* --- cover: hold DOWN near masonry ---------------------------------- */
  var near=nearestCover(p);
  var wantCover=!!(IN.slide && near && p.onGround);
  if(wantCover){
    if(p.coverId!==near.id){ p.coverId=near.id; SFX.slide(); dustBurst(p,10); }
    G.lastCover=near;
    p.cover=Math.min(1,p.cover+dt*6.0);
  } else {
    p.cover=Math.max(0,p.cover-dt*4.5);
    if(p.cover<=0) p.coverId=-1;
  }
  var inCover=p.cover>0.5;
  /* --- lateral: a full run in the open, a lean while pinned ------------ */
  var dir=(IN.right?1:0)-(IN.left?1:0);
  if(inCover && near){
    /* LEAN.  Welded to the pillar; left/right slides you past its edge, which
       is what exposes you and lets your rounds out (see arenaCanFire).   */
    p.peek=approach(p.peek||0,dir,4.2,dt);
    p.x=lerp(p.x, near.x + p.peek*(near.w+1.15), 1-Math.pow(0.0006,dt));
    p.vx=0;
    p.z=lerp(p.z, Math.min(near.z-1.5, rankZ(G.line)+2.4), 1-Math.pow(0.004,dt));
  } else {
    p.peek=approach(p.peek||0,0,5.0,dt);
    if(dir!==0) p.vx += dir*86*dt; else p.vx=approach(p.vx,0,99,dt);
    p.vx=clamp(p.vx,-21,21);
    p.x += p.vx*dt;
    p.z=lerp(p.z, rankZ(G.line), 1-Math.pow(0.02,dt));
  }
  if(p.x<-AR_HALF){ p.x=-AR_HALF; p.vx*=-0.25; }
  if(p.x> AR_HALF){ p.x= AR_HALF; p.vx*=-0.25; }
  p.tilt=lerp(p.tilt,clamp(p.vx/19,-1,1),1-Math.pow(0.002,dt));
  /* --- jump, still the only answer to a shockwave ---------------------- */
  if(IN.jump && !p.jumpHeld && !inCover){
    if(p.onGround){ p.vy=JUMP_V; p.onGround=false; p.jumps=1; SFX.jump(); dustBurst(p,10); }
    else if(p.jumps<p.maxJumps){ p.vy=JUMP_V*0.88; p.jumps++; SFX.jump(); dustBurst(p,8); }
  }
  p.jumpHeld=!!IN.jump;
  if(!p.onGround){
    p.vy -= GRAV*dt*(IN.jump&&p.vy>0?0.72:1);
    p.y  += p.vy*dt;
    if(p.y<=0){ p.y=0; p.vy=0; p.onGround=true; p.jumps=0; SFX.land(); dustBurst(p,12); }
  }
  /* pinned he is crouched: 1.30 is the profile the sweep test reads, and it
     is deliberately lower than the 2.30 m "wall" so cover is honest.     */
  p.sliding=0;
  p.h=2.35-(inCover?1.05:0);
  p.ram=0;
  p.bob += dt*(inCover?1.2:(Math.abs(p.vx)*0.5+2.2));
  if(p.inv>0)    p.inv-=dt;
  if(p.hurtT>0)  p.hurtT-=dt;
  if(p.rapid>0)  p.rapid-=dt;
  if(p.shield>0) p.shield-=dt;
  if(p.quad>0)   p.quad-=dt;
  updateCovers(dt); updateMortars(dt); updateFiring(dt);
  return true;
}
/* flat behind a pillar you cannot shoot through it.  Lean out and the shot
   goes.  Sprinting between ranks both paws are pumping, so no fire then.  */
function arenaCanFire(p){
  if(!G.arena) return true;
  if(G.advT>0) return false;
  if(p.cover>0.5 && Math.abs(p.peek||0)<0.45) return false;
  return true;
}
function updateCovers(dt){
  for(var i=0;i<G.covers.length;i++){
    var c=G.covers[i];
    if(c.flash>0)  c.flash-=dt;
    if(c.shakeT>0) c.shakeT-=dt;
  }
}
/* Masonry takes damage in three states: standing, rubble (a waist-high stub
   that is worse cover but not no cover) and gone.  The middle state exists
   purely so a rank cannot be reduced to bare floor and strand the player. */
function hitCover(c,dmg,why){
  if(!c || c.rubble>=2 || dmg<=0) return;
  if(c.rubble) dmg*=0.5;
  c.hp-=dmg; c.flash=0.12; c.shakeT=0.18;
  var P=RUIN_PAL.bone;
  for(var i=0;i<6;i++)
    spawnPart(c.x+rnd(-c.w,c.w),rnd(0.4,Math.max(0.6,c.h)),c.z,
      rnd(-6,6),rnd(1,9),rnd(-6,6),rnd(0.25,0.6),
      pick([P.hi,P.mid,"#fff2c0"]),rnd(0.4,1.0),0);
  if(c.hp<=0) shatterCover(c,why);
}
function shatterCover(c,why){
  var p=player, full=!c.rubble, P=RUIN_PAL.bone;
  if(full){
    c.rubble=1; c.dead=1;
    c.hp=COVER_HP*0.45; c.maxHp=COVER_HP*0.45;
    c.h=Math.min(c.h,1.15);
  } else { c.rubble=2; c.hp=0; }
  SFX.boom(); shakeIt(full?16:9);
  rings.push({x:c.x,y:0.3,z:c.z,r:0.5,max:full?16:9,t:0.5,T:0.5,col:P.hi});
  for(var i=0;i<(full?42:18);i++)
    spawnPart(c.x+rnd(-c.w,c.w),rnd(0.2,c.h+1.4),c.z,rnd(-13,13),rnd(2,17),
      rnd(-11,11),rnd(0.5,1.3),pick([P.lo,P.mid,P.hi,"#fff"]),rnd(0.7,2.0),0);
  /* thrown clear if you were behind it — the forced relocation the whole
     fight is built around.  Standing still is never the answer.          */
  if(p && !p.dead && p.cover>0.4 && p.coverId===c.id){
    p.cover=0; p.coverId=-1; p.peek=0;
    p.vx += (sign(p.x-c.x)||1)*11; p.vy=6.2; p.onGround=false; p.jumps=1;
    hurtPlayer(8,"shock");
    toast("COVER DOWN — MOVE");
  } else if(full && c.z>(p?p.z:0)-4) toast("COVER DOWN");
}
/* THE RANK PUSH.  Five crits and the Kaiju reels; Dogelon breaks cover and
   sprints to the next rank of the colonnade, which is closer, so the monster
   fills more of the frame every single time.  Fresh masonry comes with it,
   which is also the answer to "what if I broke everything".              */
function advanceLine(){
  var b=boss;
  if(G.line>=AR_LINES.length-1){ toast("NO GROUND LEFT — FINISH IT"); return; }
  G.advFrom=player.z;
  G.line++; G.advT=1.15;
  buildCoverLine(G.line);
  G.mortars.length=0; G.warnT=0; G.warnKind="";
  if(b){ b.mode="roar"; b.roarT=1.3; b.modeT=1.3; b.warn=0; b.coreT=0;
         b.core=0; b.stagger=0; b.didAttack=0; b.salvo=0; }
  SFX.roar(); SFX.power(); shakeIt(24); flashIt("#ffe066",0.34); slowmo(0.34);
  toast("ADVANCE — RANK "+(G.line+1)+" OF "+AR_LINES.length);
}
/* ---- the armour and the core ------------------------------------------- */
function coreY(b){ return b.y + b.h*0.60; }
function coreOpen(b){ return !!(b && !b.dead && b.coreT>0 && b.core>0.35); }
function openCore(t){
  var b=boss; if(!b) return;
  b.coreT=Math.max(b.coreT,t); b.stagger=0;
  G.coreHint=Math.max(G.coreHint,1.4);
  SFX.power();
}
function updateArenaBoss(dt){
  var b=boss;
  /* The Kaiju does NOT follow you in here.  It holds its own ground and you
     close on it — that is the only reason the rank push means anything.   */
  b.z = lerp(b.z, arenaBossZ(), 1-Math.pow(0.05,dt));
  b.sway += dt*0.55;
  b.x = lerp(b.x, Math.sin(b.sway)*3.4, 1-Math.pow(0.04,dt));
  if(b.coreT>0)  b.coreT-=dt;
  if(b.coreCd>0) b.coreCd-=dt;
  b.core = approach(b.core, b.coreT>0?1:0, 3.4, dt);
  if(G.coreHint>0) G.coreHint-=dt;
  /* stagger bleeds off, so chip fire has to be sustained to pay for itself */
  if(b.coreT<=0) b.stagger=Math.max(0,b.stagger-dt*26);
}
/* THE ATTACK DECK.  The rule the old three-move boss broke: no two moves in
   the deck may share an answer.  A recovery window always follows an attack,
   which is the reliable route to a crit for a player who never staggers it. */
function arenaBossMove(){
  var b=boss, ph=b.phase, r=Math.random();
  if(b.didAttack){
    b.didAttack=0; b.mode="open"; b.modeT=1.30; openCore(1.30);
    G.warnKind=""; G.warnT=0; return;
  }
  b.didAttack=1;
  if(r<0.30){
    b.mode="sweep"; b.warn=1.05; b.modeT=1.05+2.4; b.beam=2.4;
    b.beamDir=chance(0.5)?1:-1;
    b.beamX=b.beamDir>0?-(AR_HALF+3.5):(AR_HALF+3.5);
    arenaWarn("sweep",1.05);
  } else if(r<0.58){
    b.mode="mortar"; b.warn=1.35; b.modeT=1.35+2.1;
    b.salvo=2+ph; b.salvoT=0;
    arenaWarn("mortar",1.35);
  } else if(r<0.80){
    b.mode="lance"; b.warn=1.50; b.modeT=1.50+1.6;
    G.lanceX=player.x; G.lanceT=0;
    arenaWarn("lance",1.50);
  } else {
    b.mode="stomp"; b.warn=0.85; b.modeT=0.85+1.5;
    b.stomps=1+ph; b.stompT=0;
    arenaWarn("stomp",0.85);
  }
}
function arenaWarn(kind,t){ G.warnKind=kind; G.warnT=t; G.warnMax=t; SFX.deny(); }
function runArenaMove(dt){
  var b=boss, p=player;
  if(G.warnT>0) G.warnT-=dt;
  if(b.mode==="roar"){ b.roarT-=dt; if(b.roarT<=0) b.mode="idle"; return; }
  /* the lance aims DURING its wind-up: the marker has to be honest or the
     dodge is guesswork, which is the exact bug the old beam had.         */
  if(b.mode==="lance" && b.warn>0) G.lanceX=approach(G.lanceX,p.x,2.2,dt);
  if(b.warn>0){
    b.warn-=dt;
    if(b.warn<=0){
      if(b.mode==="sweep"||b.mode==="lance"){ SFX.beam(); shakeIt(7); }
      else if(b.mode==="mortar") SFX.boom();
      G.warnT=0;
    }
    return;
  }
  if(b.mode==="sweep")       runSweep(dt);
  else if(b.mode==="mortar") runMortar(dt);
  else if(b.mode==="lance")  runLance(dt);
  else if(b.mode==="stomp")  runStomp(dt);
}
/* THE SWEEP — answer: COVER.  A chest-high ray dragged across the floor.  A
   jump does NOT clear it (it is not a ground wave) and it erases the masonry
   it crosses, which is how the arena decays over the fight.              */
function runSweep(dt){
  var b=boss, p=player, i;
  b.beam-=dt;
  b.beamX += b.beamDir*dt*7.6;
  if(Math.abs(p.x-b.beamX)<3.1 && !p.dead){
    var sh=coverBlocks(p);
    if(sh) hitCover(sh,58*dt,"sweep");
    else if(p.y<3.4) hurtPlayer(16,"beam");
  }
  for(i=0;i<G.covers.length;i++){
    var c=G.covers[i];
    if(c.rubble>=2) continue;
    if(Math.abs(c.x-b.beamX)<c.w+1.4) hitCover(c,34*dt,"sweep");
  }
  for(i=0;i<3;i++)
    spawnPart(b.beamX+rnd(-1.2,1.2),rnd(0.2,3.4),rankZ(G.line)+rnd(1,18),
      rnd(-3,3),rnd(1,6),rnd(-6,2),0.32,"#ff7ad2",rnd(0.4,1.2),1);
}
/* THE MORTARS — answer: KEEP MOVING.  Plunging fire: cover does nothing for
   you, though it does take the splash.  This is the move that empties the
   pillars and stops the fight becoming a camp.                           */
function runMortar(dt){
  var b=boss, p=player;
  b.salvoT-=dt;
  if(b.salvo>0 && b.salvoT<=0){
    b.salvo--; b.salvoT=0.34;
    /* led target: where you will be, not where you are                    */
    var tx=clamp(p.x + p.vx*0.42 + rnd(-1.8,1.8), -AR_HALF, AR_HALF);
    G.mortars.push({x:tx, z:p.z+rnd(-2.2,3.6), t:MORT_WARN, T:MORT_WARN, r:3.5});
    SFX.shoot();
  }
}
function updateMortars(dt){
  var p=player, i, k;
  for(i=G.mortars.length-1;i>=0;i--){
    var m=G.mortars[i]; m.t-=dt;
    if(m.t>0) continue;
    G.mortars.splice(i,1);
    SFX.boom(); shakeIt(15); flashIt("#ffb14d",0.18);
    rings.push({x:m.x,y:0.25,z:m.z,r:0.6,max:m.r*4.2,t:0.44,T:0.44,col:"#ffb14d"});
    for(k=0;k<32;k++)
      spawnPart(m.x+rnd(-1.6,1.6),0.2,m.z+rnd(-1.6,1.6),rnd(-14,14),rnd(4,22),
        rnd(-14,14),rnd(0.4,1.0),
        pick(["#fff2c0","#ffb14d","#ff6a2a",G.lv.dust]),rnd(0.6,1.8),1);
    for(k=0;k<G.covers.length;k++){
      var cv=G.covers[k];
      if(cv.rubble>=2) continue;
      var rr=m.r+cv.w;
      if(dist2(cv.x,cv.z,m.x,m.z) < rr*rr) hitCover(cv,46,"mortar");
    }
    if(p && !p.dead && dist2(p.x,p.z,m.x,m.z) < m.r*m.r) hurtPlayer(20,"mortar");
  }
}
/* THE LANCE — answer: SPRINT.  A narrow column that tracks your x at 3.4 m/s
   and burns for 1.6 s.  It goes THROUGH masonry, so hiding is the wrong
   answer and the telegraph says RUN.  A full-tilt run is 21 m/s; the lance
   turns at 3.4.  Outrunning it is arithmetic, not luck.                  */
function runLance(dt){
  var p=player, i;
  G.lanceT+=dt;
  G.lanceX=approach(G.lanceX,p.x,3.4,dt);
  if(Math.abs(p.x-G.lanceX)<1.9 && !p.dead) hurtPlayer(24,"beam");
  for(i=0;i<G.covers.length;i++){
    var c=G.covers[i];
    if(c.rubble>=2) continue;
    if(Math.abs(c.x-G.lanceX)<c.w+0.9) hitCover(c,70*dt,"lance");
  }
  for(i=0;i<4;i++)
    spawnPart(G.lanceX+rnd(-0.7,0.7),rnd(0.2,7),rankZ(G.line)+rnd(1,15),
      rnd(-1.5,1.5),rnd(3,13),rnd(-3,3),0.28,"#ffe066",rnd(0.4,1.1),1);
}
/* THE STOMP — answer: JUMP.  Reuses the existing harmful-ring path, which
   already requires p.y<1.5 to connect, so the dodge is the one the lane
   taught you.  Radius 120 so it actually reaches the back rank.          */
function runStomp(dt){
  var b=boss;
  b.stompT-=dt;
  if(b.stomps>0 && b.stompT<=0){
    b.stomps--; b.stompT=0.55;
    rings.push({x:b.x,y:0.2,z:arenaBossZ(),r:1,max:120,t:2.0,T:2.0,
                col:"#ff8a5a",harm:1,speed:1});
    shakeIt(20); SFX.boom();
    for(var i=0;i<30;i++)
      spawnPart(b.x+rnd(-8,8),0.1,arenaBossZ(),rnd(-13,13),rnd(3,15),
        rnd(-26,-4),rnd(0.4,1.0),G.lv.dust,rnd(0.9,2.2),0);
  }
}
/* ---- the crit test -------------------------------------------------------
   THE COMPLAINT: "he only goes down after about threee hits, that's boring
   ... make him very very resilient, like 20 critical hits needed to kill
   him".  So: maxHp = KAIJU_CRITS*CORE_DMG = 2000 and a core hit is worth
   exactly CORE_DMG.  Twenty crits, no more and no fewer, and because the
   arithmetic lives in the HP the existing boss bar cannot lie about it.
   Body fire does ZERO hp — it is absorbed by the plating and converted into
   b.stagger, which is what prises the core open.  That is the whole loop:
   pour rounds into the shell, break it, then put your shots in the eye.  */
function arenaBossHit(bl){
  var b=boss;
  if(!b || b.dead) return false;
  var core=coreOpen(b),
      dx=Math.abs(bl.x-b.x), dy=Math.abs(bl.y-coreY(b));
  /* the core is a small target: ~3.6 m across on a 28 m body.  Deliberate —
     twenty crits should be twenty earned shots, not twenty sprayed ones.  */
  if(core && dx < b.w*0.13 && dy < b.h*0.085){
    if(b.coreCd>0) return true;                /* one crit per 0.30 s window */
    b.coreCd=0.30;
    /* the pip bar, the hp and the rank ladder are three views of one number,
       so a bullet books its crit through the same writer a charge and a
       missile use.  Everything that used to live here — the counter, critFx,
       damage(), the pop, the KAIJU_CRITS ceiling and the once-only rank push
       — is inside creditCrit() now.  See section 20b.                      */
    creditCrit(1,bl.x,bl.y,bl.z);
    return true;
  }
  /* body: plating.  No hp, but it staggers him.                            */
  if(dx < b.w*0.5 && bl.y > b.y && bl.y < b.y+b.h){
    sparkOff(bl.x,bl.y,bl.z);
    if(!core){
      b.stagger += bl.dmg*0.9;
      if(b.stagger>=STAGGER_MAX){
        b.stagger=0;
        openCore(1.55);
        shakeIt(13); flashIt("#ffe066",0.24); slowmo(0.22);
        toast("ARMOUR BREACHED — HIT THE CORE");
      }
    }
    return true;
  }
  return false;
}
/* a crit reads as a crit: white flash, hard shake, a ring at the wound */
function critFx(x,y,z){
  var i;
  SFX.kill(); shakeIt(17); flashIt("#fff6c8",0.30); slowmo(0.16);
  G.hitStop=Math.max(G.hitStop,0.055);
  rings.push({x:x,y:y,z:z,r:0.4,max:11,t:0.40,T:0.40,col:"#fff2a0"});
  for(i=0;i<40;i++)
    spawnPart(x,y,z,rnd(-17,17),rnd(-6,18),rnd(-16,6),rnd(0.3,0.9),
      pick(["#ffffff","#fff2a0","#ffb14d","#ff6a2a","#ff3a7a"]),rnd(0.6,1.9),1);
}
/* a round off the plating reads as a ricochet, so you can FEEL that body
   fire is not working and go looking for the core                        */
function sparkOff(x,y,z){
  var i;
  SFX.hit(0); shakeIt(0.7);
  for(i=0;i<5;i++)
    spawnPart(x,y,z,rnd(-11,11),rnd(1,9),rnd(-9,1),rnd(0.14,0.32),
      pick(["#cfe4ff","#9fb8d8","#fff"]),rnd(0.3,0.7),1);
  if(chance(0.14))
    pops.push({x:x,y:y,z:z,txt:"ARMOUR",t:0.42,T:0.42,col:"#9fb8d8",sz:15});
}
/* ---------- 20b. THE ARMOURY — trivia gold, bombs and missiles --------------
   THE CLAUSE THIS ANSWERS: "the bombs and missiles mentioned can be made
   available to players and the currency for their purchase can be the gold
   from the trivia dogelon questions."

   Two rules shape the whole section.

   1. GOLD IS A SECOND LEDGER.  answerTrivia() still credits the SCORE by
      exactly TRIV_GOLD — a self-test pins that — and now credits G.gold by
      the same amount.  Spending gold never touches the score, so nobody can
      buy their way up the leaderboard, and the old contract is untouched.

   2. ORDNANCE IS AN ASSIST, NEVER A SUBSTITUTE.  A perfect run banks four
      cards x TRIV_GOLD = 2000 gold.  That is two missiles: six of the
      Kaiju's twenty crits, and only if you spend nothing on charges.  The
      other fourteen are still fourteen earned shots into an open core.

   The two weapons are deliberately not interchangeable:

     THERMITE CHARGE   arcs OVER masonry, so it is the one thing you can use
                       while still flat behind a pillar.  It bursts on the
                       ground, blows the Kaiju's plating open, cracks any
                       masonry in the blast — including your own — and kills
                       mortar shells already in the air.
     COLONNADE MISSILE flies flat and needs a firing line, so you have to
                       lean out or be in the open to launch it.  It locks the
                       core, forces the armour open and is worth
                       ORD_MISSILE_CRIT crits.

   The shop is a state, SHOP, that records where it was opened from and puts
   the game back exactly there — an overlay with a return address, not a new
   link in the chain.  CLEAR -> TRIVIA -> INTRO is never re-routed.        */
var ARMS=[
  {id:"bomb",    name:"THERMITE CHARGE",   cost:400, cap:6, col:"#ff8a3a",
   line:"lobbed in an arc  ·  bursts on the ground  ·  breaks Kaiju plating",
   note:"the only weapon you can use from FULL cover — it goes over the stone"},
  {id:"missile", name:"COLONNADE MISSILE", cost:800, cap:4, col:"#7dd8ff",
   line:"locks the core  ·  forces the armour open  ·  worth 3 critical hits",
   note:"needs a firing line: lean out of cover or stand in the open"}
];
var ORD_BOMB_R=7.4;          /* blast radius, metres                          */
var ORD_MISSILE_CRIT=3;      /* crits a missile is worth inside the arena     */
var ORD_THROW_CD=0.85, ORD_LOCK_CD=1.25;
var ORD_BOMB_VZ=44;          /* lob speed down-range; the arc solves for vy   */
function armsById(id){
  for(var i=0;i<ARMS.length;i++) if(ARMS[i].id===id) return ARMS[i];
  return null;
}
function ordHeld(id){ return id==="bomb" ? G.bombs : G.missiles; }
function ordSet(id,n){ if(id==="bomb") G.bombs=n; else G.missiles=n; }
/* ---- the shop ---------------------------------------------------------- */
/* PLAY and BOSS are excluded on purpose: an inventory screen that stops the
   world mid-fight is a different game.  Pause first (P), then open it.     */
function shopAllowed(s){
  s=s||G.state;
  return s==="TITLE"||s==="SELECT"||s==="INTRO"||s==="CLEAR"||s==="TRIVIA"||
         s==="PAUSE"||s==="OVER"||s==="WIN";
}
function openShop(from){
  if(G.state==="SHOP") return false;
  from=from||G.state;
  if(!shopAllowed(from)) return false;
  G.shopFrom=from; G.shopIdx=clamp(G.shopIdx|0,0,ARMS.length-1);
  G.shopSeen=true; G.state="SHOP"; SFX.coin(2);
  return true;
}
function closeShop(){
  if(G.state!=="SHOP") return;
  G.state=G.shopFrom||"CLEAR";
  /* G.timer runs on REAL time in frame(), not on the state, so a long browse
     would otherwise drop you back onto CLEAR with its three-second payout
     already expired and the trivia card firing in the same frame.  Handing
     the clock back is what keeps the chain feeling untouched.             */
  G.timer=0;
  if(G.state==="TRIVIA") G.trivT=0;
  SFX.coin(1);
}
function shopMove(d){
  var n=ARMS.length;
  G.shopIdx=((G.shopIdx+d)%n+n)%n;
  SFX.coin(G.shopIdx+1);
}
function buyItem(i){
  var it=ARMS[clamp(i|0,0,ARMS.length-1)];
  if(!it) return false;
  if(ordHeld(it.id)>=it.cap){ SFX.deny(); toast(it.name+" — RACK FULL"); return false; }
  if(G.gold<it.cost){
    SFX.deny();
    toast("NOT ENOUGH GOLD — "+(it.cost-G.gold)+" SHORT");
    return false;
  }
  G.gold-=it.cost;
  ordSet(it.id,ordHeld(it.id)+1);
  SFX.power(); flashIt("#ffd27a",0.16);
  toast(it.name+" x"+ordHeld(it.id)+"  ·  "+G.gold+" GOLD LEFT");
  return true;
}
/* ---- ONE PLACE A CRIT CAN BE SCORED ------------------------------------
   The 20-pip boss bar, the Kaiju's hp and the rank ladder are three views of
   the same number, and before this existed each of them was incremented at
   the call site.  Ordnance would have made that three-way agreement a
   coin-toss (a missile crosses several thresholds at once), so every crit —
   from a bullet, a charge or a missile — now goes through here.
   Returns how many crits were actually banked, which may be fewer than
   asked for: KAIJU_CRITS is a ceiling, never a target to overshoot.      */
function creditCrit(n,hx,hy,hz){
  var b=boss;
  if(!G.arena || !b || b.dead) return 0;
  n=Math.max(1,Math.round(n||1));
  n=Math.min(n, KAIJU_CRITS-G.crits);
  if(n<=0) return 0;
  var before=G.crits;
  if(hx===undefined) hx=b.x;
  if(hy===undefined) hy=coreY(b);
  if(hz===undefined) hz=b.z;
  G.crits+=n;
  critFx(hx,hy,hz);
  damage(b,CORE_DMG*n,{x:hx,y:hy,z:hz},true);
  pops.push({x:b.x,y:coreY(b)+2.2,z:b.z,
             txt:(n>1?"x"+n+"  ":"")+"CRIT "+G.crits+"/"+KAIJU_CRITS,
             t:1.0,T:1.0,col:"#fff2a0",sz:n>1?32:26});
  if(b.hp<=0 || b.dead || G.crits>=KAIJU_CRITS) return n;
  /* the rank push fires ONCE even when a missile carried you over the line,
     and the kill above must never also shove you forward — hence the guard */
  if(((before/CRITS_PER_LINE)|0) !== ((G.crits/CRITS_PER_LINE)|0)) advanceLine();
  else if(b.coreT<=0.35){ b.coreT=0; b.core=0; }
  return n;
}
/* ---- launching -------------------------------------------------------- */
function throwBomb(){
  var p=player;
  if(!p||p.dead) return false;
  if(G.state!=="PLAY"&&G.state!=="BOSS") return false;
  if(G.bombs<=0){ SFX.deny(); toast("NO CHARGES  ·  [O] ARMOURY"); return false; }
  if(p.throwCd>0||p.spawnT>0) return false;
  if(!gunOut(p)){ SFX.deny(); return false; }   /* both paws on the wheel     */
  G.bombs--; p.throwCd=ORD_THROW_CD;
  var m=muzzlePos(p);
  var tgt = G.arena ? ((boss&&!boss.dead)?boss:null)
                    : nearestTarget(p,96);
  if(!tgt && boss && !boss.dead) tgt=boss;
  /* the arc is solved to land ON THE FLOOR at the target's feet, which is
     both easier to read than a mid-air burst and what makes the blast catch
     masonry and mortar shells as well as the thing you aimed at.          */
  var dz=clamp(tgt?(tgt.z-m.z):46, 12, 96);
  var tof=dz/ORD_BOMB_VZ;
  var vy=(0.55-m.y)/tof + GRAV*tof*0.5;
  var vx=tgt ? clamp((tgt.x-m.x)/tof,-30,30) : 0;
  G.ord.push({ kind:"bomb", x:m.x, y:m.y, z:m.z, px:m.x, py:m.y, pz:m.z,
    vx:vx, vy:vy, vz:ORD_BOMB_VZ, t:0, life:tof+1.1, spin:0, arm:0.10,
    dmg:64, r:ORD_BOMB_R, tgt:null });
  p.shootT=0.22; p.recoil=0.18; p.muzzle=MUZZLE_T*0.6;
  SFX.slide(); shakeIt(1.8);
  toast("CHARGE AWAY  ·  "+G.bombs+" LEFT");
  return true;
}
function fireMissile(){
  var p=player;
  if(!p||p.dead) return false;
  if(G.state!=="PLAY"&&G.state!=="BOSS") return false;
  if(G.missiles<=0){ SFX.deny(); toast("NO MISSILES  ·  [O] ARMOURY"); return false; }
  if(p.lockCd>0||p.spawnT>0) return false;
  if(!gunOut(p)){ SFX.deny(); return false; }
  /* flat behind a pillar there is no firing line — the same rule the blaster
     obeys, which is what keeps the charge and the missile different weapons */
  if(!arenaCanFire(p)){ SFX.deny(); toast("NO FIRING LINE — LEAN OUT"); return false; }
  var tgt = (boss&&!boss.dead) ? boss
                               : nearestTarget(p,150);
  if(!tgt){ SFX.deny(); toast("NO LOCK"); return false; }
  G.missiles--; p.lockCd=ORD_LOCK_CD;
  var m=muzzlePos(p);
  G.ord.push({ kind:"missile", x:m.x, y:m.y+0.30, z:m.z, px:m.x, py:m.y, pz:m.z,
    vx:0, vy:3.4, vz:56, t:0, life:3.8, spin:0, arm:0.06,
    dmg:190, r:ORD_BOMB_R*0.82, tgt:tgt });
  p.shootT=0.26; p.recoil=0.30; p.muzzle=MUZZLE_T;
  SFX.beam(); shakeIt(4.2); flashIt("#7dd8ff",0.12);
  toast("MISSILE AWAY  ·  "+G.missiles+" LEFT");
  return true;
}
/* ---- flight ------------------------------------------------------------
   Ordnance rides its OWN array and its own update, not bullets[].  Two
   reasons: updateBullets() is a protected path with a lane gate and a 1.35 s
   life that a 96 m lob would fail, and a charge has to keep living after it
   stops moving (the fuse).  Nothing here touches bullets[].              */
function updateOrd(dt){
  var p=player, i, j;
  for(i=G.ord.length-1;i>=0;i--){
    var o=G.ord[i];
    o.px=o.x; o.py=o.y; o.pz=o.z;
    o.t+=dt; o.life-=dt; o.spin+=dt*(o.kind==="bomb"?9.0:2.4);
    if(o.arm>0) o.arm-=dt;
    if(o.kind==="missile"){
      var tg=o.tgt;
      if(tg&&tg.dead) tg=null;
      if(!tg && boss && !boss.dead) tg=boss;
      o.vz=Math.min(120,o.vz+160*dt);
      if(tg){
        /* while the core is open the missile flies at the EYE, which is what
           makes it worth three crits instead of three ricochets           */
        var ay=(G.arena&&tg===boss&&coreOpen(boss)) ? coreY(boss)
              :(tg.kind==="boss" ? tg.y+tg.h*0.55 : tg.y+tg.h*0.5);
        var dz=Math.max(3,tg.z-o.z);
        o.vx=lerp(o.vx,(tg.x-o.x)/dz*o.vz,clamp(dt*7,0,0.5));
        o.vy=lerp(o.vy,(ay-o.y)/dz*o.vz,clamp(dt*7,0,0.5));
      }
    } else o.vy-=GRAV*dt;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.z+=o.vz*dt;
    if(chance(dt*(o.kind==="missile"?52:24)))
      spawnPart(o.x,Math.max(0.1,o.y),o.z,rnd(-2.2,2.2),rnd(-1,2.4),rnd(-9,-2),
        rnd(0.25,0.65),
        o.kind==="missile" ? pick(["#cfe4ff","#9fb8d8","#ffffff"])
                           : pick(["#ffb14d","#ff7a2a","#9a8a7a"]),
        rnd(0.35,0.85),1);
    var hit=false;
    if(o.arm<=0){
      if(boss && !boss.dead &&
         Math.abs(boss.z-o.z) < (o.kind==="missile"?7.5:5.5) &&
         Math.abs(boss.x-o.x) < boss.w*0.58 &&
         o.y > boss.y-1.5 && o.y < boss.y+boss.h) hit=true;
      if(!hit) for(j=0;j<ents.length;j++){
        var e=ents[j];
        if(e.dead||e.kind==="hazard") continue;
        if(Math.abs(e.z-o.z) > e.r+2.4) continue;
        var dx=e.x-o.x, dy=(e.y+e.h*0.45)-o.y;
        if(dx*dx+dy*dy < (e.r+1.7)*(e.r+1.7)){ hit=true; break; }
      }
      /* the floor.  A charge is MEANT to end here; a missile that misses
         everything ploughs in and still throws its blast.               */
      if(!hit && o.y<=0.12){ o.y=0.08; hit=true; }
    }
    if(hit || o.life<=0){ detonate(o); G.ord.splice(i,1); continue; }
    if(o.z<(p?p.z:0)-10 || o.z>(p?p.z:0)+FARZ+30 || Math.abs(o.x)>ROAD_HALF+40)
      G.ord.splice(i,1);
  }
}
function detonate(o){
  var i, big=(o.kind==="missile"), R=o.r, y=Math.max(0.25,o.y);
  SFX.boom(); shakeIt(big?19:13);
  flashIt(big?"#cfe4ff":"#ffb14d", big?0.30:0.22);
  slowmo(big?0.16:0.08);
  rings.push({x:o.x,y:y,z:o.z,r:0.6,max:R*1.7,t:0.52,T:0.52,
              col:big?"#cfe4ff":"#ffcf4a"});
  rings.push({x:o.x,y:0.25,z:o.z,r:0.4,max:R*2.1,t:0.62,T:0.62,col:"#ff7a2a"});
  for(i=0;i<(big?56:42);i++)
    spawnPart(o.x,y,o.z,rnd(-19,19),rnd(-2,22),rnd(-17,17),rnd(0.35,1.15),
      pick(big?["#ffffff","#cfe4ff","#7dd8ff","#ffd27a"]
              :["#ffffff","#ffe066","#ff7a2a","#ff3a1a"]),rnd(0.6,2.1),1);
  pops.push({x:o.x,y:y+2.0,z:o.z,txt:big?"MISSILE":"THERMITE",
             t:0.7,T:0.7,col:big?"#cfe4ff":"#ffcf4a",sz:20});
  /* --- the Kaiju.  Inside the arena every crit goes through creditCrit(), so
     the pip bar, the hp and the rank ladder cannot be told apart.       */
  if(G.arena && boss && !boss.dead && Math.abs(boss.z-o.z) < R+10){
    if(big){
      openCore(1.9);
      creditCrit(ORD_MISSILE_CRIT,boss.x,coreY(boss),boss.z);
      toast("MISSILE HIT — CORE FORCED OPEN");
    } else if(coreOpen(boss)){
      creditCrit(1,boss.x,coreY(boss),boss.z);
    } else {
      boss.stagger += STAGGER_MAX*0.8;
      if(boss.stagger>=STAGGER_MAX){
        boss.stagger=0; openCore(1.55);
        shakeIt(13); flashIt("#ffe066",0.24); slowmo(0.22);
        toast("PLATING BLOWN — HIT THE CORE");
      } else toast("PLATING BUCKLING");
    }
  } else if(boss && !boss.dead && Math.abs(boss.z-o.z) < R+7 &&
            Math.abs(boss.x-o.x) < boss.w*0.62){
    damage(boss,o.dmg,o,true);              /* the lane Kaiju has plain hp */
  }
  /* --- everything else caught in the blast, with falloff --- */
  for(i=ents.length-1;i>=0;i--){
    var e=ents[i];
    if(e.dead||e.kind==="hazard") continue;
    var dx=e.x-o.x, dz=e.z-o.z, d=Math.sqrt(dx*dx+dz*dz);
    if(d>R) continue;
    damage(e,o.dmg*(1-d/R*0.55),o);
  }
  /* --- masonry.  A charge dropped short takes your own cover with it: that
     is the price of being allowed to throw from behind it.             */
  if(G.arena) for(i=0;i<G.covers.length;i++){
    var c=G.covers[i];
    if(c.rubble>=2) continue;
    var cx=c.x-o.x, cz=c.z-o.z, cd=Math.sqrt(cx*cx+cz*cz);
    if(cd>R*0.85) continue;
    hitCover(c,COVER_HP*(big?0.5:0.72)*(1-cd/(R*0.85)*0.5),"ordnance");
  }
  /* --- and it kills mortar shells already in the air, which is a real use
     for a charge you would otherwise be hoarding.                     */
  if(G.arena) for(i=G.mortars.length-1;i>=0;i--){
    var mo=G.mortars[i];
    if(Math.abs(mo.x-o.x)<R && Math.abs(mo.z-o.z)<R){
      G.mortars.splice(i,1);
      pops.push({x:mo.x,y:1.2,z:mo.z,txt:"SHELL KILLED",t:0.8,T:0.8,
                 col:"#7dffb0",sz:16});
    }
  }
  /* the player is not immune to their own charge — but at 40% and gated by
     the usual invulnerability window, so it stings instead of killing.  */
  if(player && !player.dead){
    var pd=Math.sqrt((player.x-o.x)*(player.x-o.x)+(player.z-o.z)*(player.z-o.z));
    if(pd<R*0.72) hurtPlayer(o.dmg*0.40*(1-pd/(R*0.72)),"shock");
  }
}
/* ---- drawn ---------------------------------------------------------------
   Both weapons get a shadow on the sand, which is the whole reason a lobbed
   charge is readable at all: the shadow tells you where it will land while
   the shell itself is still high in the air.                             */
function drawOrd(o){
  var pz=player?player.z:0;
  if(o.z<pz-6) return;
  var pt=project(o.x,Math.max(0.05,o.y),o.z); if(!pt) return;
  var fa=fogAlpha(o.z);
  var big=(o.kind==="missile");
  shadow(o.x,0,o.z,big?0.55:0.7,0.85);
  /* the trail: previous position to current, so speed reads as length      */
  var pp=project(o.px,Math.max(0.05,o.py),o.pz);
  if(pp){
    ctx.save();
    ctx.globalAlpha=fa*(big?0.9:0.55);
    ctx.strokeStyle=big?"#cfe4ff":"#ffb14d";
    ctx.lineWidth=Math.max(1.5,pt.s*(big?0.09:0.06));
    ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(pt.x,pt.y); ctx.stroke();
    ctx.restore();
  }
  var r=Math.max(2,pt.s*(big?0.16:0.13));
  ctx.save();
  ctx.globalAlpha=fa;
  if(big){
    /* a stubby dart: nose cone, body, fin, and a bloom at the tail          */
    ctx.translate(pt.x,pt.y);
    var ang=Math.atan2((pp?pt.y-pp.y:0),(pp?pt.x-pp.x:1));
    ctx.rotate(ang);
    ctx.fillStyle="#e8f2ff";
    roundRect(-r*2.4,-r*0.55,r*4.0,r*1.1,r*0.4); ctx.fill();
    ctx.fillStyle="#7dd8ff";
    ctx.beginPath();
    ctx.moveTo(r*1.6,-r*0.55); ctx.lineTo(r*2.9,0); ctx.lineTo(r*1.6,r*0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="#5a6a80";
    ctx.beginPath();
    ctx.moveTo(-r*2.4,-r*0.5); ctx.lineTo(-r*3.2,-r*1.15);
    ctx.lineTo(-r*1.7,-r*0.5); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r*2.4,r*0.5); ctx.lineTo(-r*3.2,r*1.15);
    ctx.lineTo(-r*1.7,r*0.5); ctx.closePath(); ctx.fill();
    var fl=r*(2.0+Math.sin(o.t*46)*0.6);
    ctx.globalAlpha=fa*0.9;
    var g=ctx.createLinearGradient(-r*2.4-fl,0,-r*2.2,0);
    g.addColorStop(0,hexA("#7dd8ff",0)); g.addColorStop(0.55,hexA("#9fe6ff",0.8));
    g.addColorStop(1,"#ffffff");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(-r*2.2,-r*0.62); ctx.lineTo(-r*2.4-fl,0);
    ctx.lineTo(-r*2.2,r*0.62); ctx.closePath(); ctx.fill();
  } else {
    /* a tumbling canister with a lit fuse band that pulses faster as the
       fuse burns down — a countdown you can read without a HUD element    */
    ctx.translate(pt.x,pt.y); ctx.rotate(o.spin);
    ctx.fillStyle="#6b5442";
    roundRect(-r*0.95,-r*1.25,r*1.9,r*2.5,r*0.55); ctx.fill();
    ctx.fillStyle="#3a2c22";
    ctx.fillRect(-r*0.95,-r*0.2,r*1.9,r*0.42);
    var pulse=0.45+0.55*Math.abs(Math.sin(o.t*(7+o.t*9)));
    ctx.globalAlpha=fa*pulse;
    ctx.fillStyle="#ff8a3a";
    ctx.fillRect(-r*0.95,-r*0.95,r*1.9,r*0.4);
    ctx.globalAlpha=fa;
    ctx.fillStyle=pulse>0.6?"#fff2c0":"#ffb14d";
    ctx.beginPath(); ctx.arc(0,-r*1.45,r*0.34,0,6.2832); ctx.fill();
  }
  ctx.restore();
  /* the glow goes on last and unrotated so it never smears with the sprite  */
  ctx.save();
  ctx.globalAlpha=fa*0.5;
  var gg=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,r*(big?5.2:3.6));
  gg.addColorStop(0,hexA(big?"#7dd8ff":"#ffb14d",0.85));
  gg.addColorStop(1,hexA(big?"#7dd8ff":"#ffb14d",0));
  ctx.fillStyle=gg;
  ctx.beginPath(); ctx.arc(pt.x,pt.y,r*(big?5.2:3.6),0,6.2832); ctx.fill();
  ctx.restore();
}
/* ARENA_PLACEHOLDER_A */
/* ================= RENDERING ==================================== */
function renderSky(){
  var lv=G.lv, hz=horizonY();
  var g=ctx.createLinearGradient(0,-VH*0.15,0,hz+40);
  g.addColorStop(0,lv.sky[0]); g.addColorStop(0.45,lv.sky[1]);
  g.addColorStop(0.82,lv.sky[2]); g.addColorStop(1,lv.sky[3]);
  ctx.fillStyle=g; ctx.fillRect(0,-VH*0.2,VW,hz+42+VH*0.2);
  /* stars */
  ctx.save();
  for(var i=0;i<90;i++){
    var sx=((i*137.5)%VW + (-cam.x*3)%VW + VW)%VW;
    var sy=(i*53)%Math.max(40,hz-20);
    var tw=0.35+0.65*Math.abs(Math.sin(G.t*1.6+i));
    ctx.globalAlpha=tw*0.7*clamp(1-(sy/Math.max(1,hz)),0.15,1);
    ctx.fillStyle="#fff"; ctx.fillRect(sx,sy,1.6,1.6);
  }
  ctx.restore();
  /* twin moons */
  drawMoon(VW*0.20 - cam.x*6, hz-VH*0.30, 46, "#e8d0c0", 0.85);
  drawMoon(VW*0.76 - cam.x*4, hz-VH*0.19, 26, "#cbb8d8", 0.7);
  /* sun / glare at the horizon */
  var sx2=VW*0.5-cam.x*10;
  var sg=ctx.createRadialGradient(sx2,hz-8,4,sx2,hz-8,VW*0.42);
  sg.addColorStop(0,"rgba(255,240,210,0.85)");
  sg.addColorStop(0.18,"rgba(255,180,110,0.34)");
  sg.addColorStop(1,"rgba(255,120,60,0)");
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.fillStyle=sg; ctx.fillRect(0,0,VW,hz+60); ctx.restore();
  renderMountains(hz);
}
function drawMoon(x,y,r,col,a){
  ctx.save(); ctx.globalAlpha=a;
  var g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  g.addColorStop(0,"#fff"); g.addColorStop(0.5,col); g.addColorStop(1,"rgba(0,0,0,0.25)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  ctx.globalAlpha=a*0.30; ctx.globalCompositeOperation="screen";
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r*1.5,0,6.283); ctx.fill();
  ctx.restore();
}
function renderMountains(hz){
  var lv=G.lv;
  for(var layer=0;layer<3;layer++){
    var par=[14,26,44][layer], amp=[46,80,124][layer];
    var col=mixHex(lv.mtn,lv.fog,[0.62,0.36,0.10][layer]);
    var off=(-cam.x*par - G.dist*0.06*(layer+1));
    ctx.beginPath();
    ctx.moveTo(-4,hz+30);
    for(var x=-4;x<=VW+8;x+=8){
      var n=fbm((x+off)*0.0022+layer*13.7);
      var y=hz - 6 - amp*(0.45+0.55*n) - layer*8;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(VW+8,hz+30); ctx.closePath();
    ctx.fillStyle=col; ctx.fill();
    if(layer===2){                        /* rim light on the near ridge */
      ctx.save(); ctx.globalCompositeOperation="screen"; ctx.globalAlpha=0.30;
      ctx.strokeStyle=lv.sky[3]; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    }
  }
  /* haze band */
  var hg=ctx.createLinearGradient(0,hz-30,0,hz+26);
  hg.addColorStop(0,"rgba(0,0,0,0)");
  hg.addColorStop(1,lv.fog);
  ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle=hg;
  ctx.fillRect(0,hz-30,VW,56); ctx.restore();
}
/* ---- ground: perspective strips ------------------------------- */
function renderGround(){
  var lv=G.lv, pz=player?player.z:0, hz=horizonY();
  ctx.fillStyle=lv.ground2;
  ctx.fillRect(0,hz+1,VW,VH-hz);
  var z=pz+NEARZ, prev=null, i=0;
  var segs=[];
  while(z<pz+FARZ){
    var step=0.9+ (z-pz)*0.055;
    segs.push(z); z+=step; i++;
    if(i>420) break;
  }
  /* draw far -> near */
  for(var k=segs.length-1;k>=1;k--){
    var zf=segs[k], zn=segs[k-1];
    var aF=project(-ROAD_HALF-26,0,zf), bF=project(ROAD_HALF+26,0,zf);
    var aN=project(-ROAD_HALF-26,0,zn), bN=project(ROAD_HALF+26,0,zn);
    if(!aF||!bF||!aN||!bN) continue;
    var band=Math.floor(zf/5)%2;
    var fogT=clamp((zf-pz)/FARZ,0,1);
    var base=band?lv.ground:lv.ground2;
    ctx.fillStyle=mixHex(base.length===7?base:"#000000", lv.fog, fogT*0.78);
    ctx.beginPath();
    ctx.moveTo(aF.x,aF.y); ctx.lineTo(bF.x,bF.y);
    ctx.lineTo(bN.x,bN.y); ctx.lineTo(aN.x,aN.y); ctx.closePath(); ctx.fill();
  }
  /* 01 RED DUNES lays its ridges here, under the track: drawn after the flats
     so it reads as raised sand, before the road so the lane ticks stay sharp */
  if(lv.n===1) sectorDunes(pz);
  /* "the scene should absolutely not be some boring looking lane we've been
     using all through since level 1" — so inside the colonnade the 16 m road
     with its five lane ticks is replaced outright by a 26.8 m flagstone
     plaza.  Same strip loop, same projection, completely different place. */
  if(G.arena) renderArenaFloor(segs,pz,hz);
  else renderRoad(segs,pz,hz);
}
function renderRoad(segs,pz,hz){
  var lv=G.lv;
  for(var k=segs.length-1;k>=1;k--){
    var zf=segs[k], zn=segs[k-1];
    var aF=project(-ROAD_HALF,0,zf), bF=project(ROAD_HALF,0,zf);
    var aN=project(-ROAD_HALF,0,zn), bN=project(ROAD_HALF,0,zn);
    if(!aF||!bF||!aN||!bN) continue;
    var fogT=clamp((zf-pz)/FARZ,0,1);
    var band=Math.floor(zf/5)%2;
    ctx.fillStyle=mixHex(lv.road, lv.fog, fogT*0.72+(band?0.04:0));
    ctx.beginPath();
    ctx.moveTo(aF.x,aF.y); ctx.lineTo(bF.x,bF.y);
    ctx.lineTo(bN.x,bN.y); ctx.lineTo(aN.x,aN.y); ctx.closePath(); ctx.fill();
    /* lane ticks — depth cues that survive occlusion */
    if(Math.floor(zf/5)%2===0 && fogT<0.72){
      ctx.globalAlpha=(1-fogT)*0.30;
      ctx.fillStyle=lv.rail;
      for(var L=1;L<LANES;L++){
        var lx=-ROAD_HALF+L*(ROAD_HALF*2/LANES);
        var t1=project(lx-0.075,0.02,zf), t2=project(lx+0.075,0.02,zn);
        if(t1&&t2){ ctx.fillRect(t1.x, Math.min(t1.y,t2.y),
                       Math.max(1,Math.abs(t2.x-t1.x)+1), Math.max(1,Math.abs(t2.y-t1.y)+1)); }
      }
      ctx.globalAlpha=1;
    }
    /* edge rails, glowing */
    var eF=project(-ROAD_HALF,0.55,zf), eN=project(-ROAD_HALF,0.55,zn);
    var fF=project( ROAD_HALF,0.55,zf), fN=project( ROAD_HALF,0.55,zn);
    if(eF&&eN&&fF&&fN&&fogT<0.9){
      ctx.save(); ctx.globalCompositeOperation="screen";
      ctx.globalAlpha=(1-fogT)*((Math.floor(zf/5)%2)?0.55:0.22);
      ctx.strokeStyle=lv.rail; ctx.lineWidth=Math.max(1,3*(1-fogT));
      ctx.beginPath(); ctx.moveTo(eF.x,eF.y); ctx.lineTo(eN.x,eN.y);
      ctx.moveTo(fF.x,fF.y); ctx.lineTo(fN.x,fN.y); ctx.stroke();
      ctx.restore();
    }
  }
  /* centre dashes */
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(var z=Math.floor(pz/8)*8; z<pz+FARZ*0.8; z+=8){
    var c1=project(0,0.03,z), c2=project(0,0.03,z+3.4);
    if(!c1||!c2) continue;
    var ft=clamp((z-pz)/FARZ,0,1);
    ctx.globalAlpha=(1-ft)*0.28; ctx.strokeStyle="#fff5d0";
    ctx.lineWidth=Math.max(1,7*c1.s/90);
    ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
  }
  ctx.restore();
}
/* ---------- 15b. per-sector visual signatures -------------------------
   Every sector already had its own palette, but a palette is not a
   silhouette: at speed all of them read as "coloured road, coloured rails".
   Each numbered sector now gets one structural motif that is unmistakable
   in a single still frame.  None of it has a hitbox — this is scenery.
     01 RED DUNES     sand ridges crossing the flats every 40 m
     02 ASHFALL RIFT  embers drifting UP out of the seam (weightless)
     03 CRYO BASIN    mist banked on the horizon + an aurora ribbon
     04 ELON SPIRE    vertical light curtains on every lane boundary
     05 KAIJU         a red vignette that pulses faster each boss phase   */
var DUNE_STEP=40, DUNE_H=0.30;
function sectorDunes(pz){
  var lv=G.lv, W=ROAD_HALF+26;
  /* the ridge is drawn from inside renderGround, BEFORE the road goes down,
     so the track stays legible and the drift reads as being under it     */
  var lit=lightHex(lv.ground,0.20);          /* "ground lightened 20%" */
  ctx.save();
  for(var z=Math.floor((pz+NEARZ)/DUNE_STEP)*DUNE_STEP; z<pz+FARZ*0.86; z+=DUNE_STEP){
    var fog=clamp((z-pz)/FARZ,0,1);
    if(fog>0.86) continue;
    var a=project(-W,0,z),        b=project(W,0,z),
        c=project(W,DUNE_H,z+3.4), d=project(-W,DUNE_H,z+3.4);
    if(!a||!b||!c||!d) continue;
    ctx.globalAlpha=(1-fog)*0.9;
    ctx.fillStyle=mixHex(lit,lv.fog,fog*0.7);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
    /* wind-scoured crest, so the ridge has an edge and not just a shade */
    ctx.globalAlpha=(1-fog)*0.34;
    ctx.strokeStyle=mixHex(lv.rail,"#ffffff",0.35);
    ctx.lineWidth=Math.max(1,2.2*(1-fog));
    ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  }
  ctx.restore();
}
function sectorLaneCurtains(pz){
  var lv=G.lv;
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(var z=Math.floor(pz/25)*25; z<pz+FARZ*0.62; z+=25){
    var fog=clamp((z-pz)/FARZ,0,1);
    if(fog>0.62) continue;
    for(var L=1;L<LANES;L++){
      var lx=-ROAD_HALF+L*(ROAD_HALF*2/LANES);
      var f=project(lx,0,z), t=project(lx,3.5,z);
      if(!f||!t) continue;
      ctx.globalAlpha=(1-fog/0.62)*(0.35+0.15*Math.sin(G.t*4+L));
      ctx.strokeStyle=lv.rail; ctx.lineWidth=Math.max(1,2.6*(1-fog));
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(t.x,t.y); ctx.stroke();
    }
  }
  ctx.restore();
}
/* ---- 03 CRYO BASIN: mist banked on the horizon + an aurora ribbon ---- */
function sectorMist(hz){
  var lv=G.lv;
  /* sits ON the horizon line and fades downward into the flats, so the basin
     reads as a bowl of standing cold air rather than a tinted sky.  The stops
     need per-stop alpha, which globalAlpha cannot give — hence hexA().     */
  var g=ctx.createLinearGradient(0,hz,0,hz+20);
  g.addColorStop(0,hexA(lv.rail,0.25));
  g.addColorStop(1,hexA(lv.rail,0));
  ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,hz,VW,20); ctx.restore();
}
function sectorAurora(hz){
  /* one slow ribbon above the horizon, screen-composited so it brightens the
     sky instead of painting a flat band across it                          */
  var y0=hz-30, amp=14;
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.strokeStyle="#a8e4ff"; ctx.lineJoin="round";
  ctx.beginPath();
  for(var x=0;x<=VW;x+=26){
    var y=y0+Math.sin(x*0.006+G.t*0.55)*amp
             +Math.sin(x*0.017-G.t*0.31)*amp*0.35;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.globalAlpha=0.18; ctx.lineWidth=9;  ctx.stroke();
  /* a thin bright core over the same path, or the ribbon reads as a smudge */
  ctx.globalAlpha=0.10; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}
/* ---- 02 ASHFALL RIFT: embers rising out of the seam -------------------
   Rate-accumulated rather than a flat "2 per call": step() substeps up to six
   times when the frame rate drops, and a per-call spawn would multiply the
   ember count by the substep count exactly when the machine can least afford
   it.  The leftover fraction carries over, so the rate is frame-independent. */
var CIND_RATE=120;                                  /* 2/frame at 60 Hz */
var CIND_COL=["#ff7a2a","#ff4a10","#ffd27a"];
function sectorAmbient(dt){
  if(!player||!G.lv||G.lv.n!==2) return;
  G.cindAcc+=dt*CIND_RATE;
  var n=Math.min(6,Math.floor(G.cindAcc)); G.cindAcc-=n;
  for(var i=0;i<n;i++)
    spawnPart(rnd(-ROAD_HALF*3,ROAD_HALF*3), 0,
              player.z+rnd(NEARZ,FARZ*0.5),
              rnd(-2,2), rnd(3,8), rnd(-4,4),
              1.2, pick(CIND_COL), rnd(0.18,0.42), 1, 1);
}
/* one dispatcher on lv.n — NOT G.lvIdx, because LEVELS[2] is the ROVER RUN
   bonus stage (n:"B") and is meant to inherit none of these motifs.  Called
   from draw() directly after renderGround(), so the scenery lands on the
   flats and under everything that can be shot.                            */
function renderSectorFx(pz,hz){
  var n=G.lv?G.lv.n:0;
  if(n===3){ sectorMist(hz); sectorAurora(hz); }
  else if(n===4) sectorLaneCurtains(pz);
}
/* ---------- 15c. THE SIEGE — arena rendering --------------------------------
   The whole visual brief in one place: "the scene looking cool and awe
   inspiring like scenes from kratos the god of war".  Four layers, drawn in
   this order so each one reads against the last:
     renderArenaBackdrop  twin moons, a burning sky, ranks of colossal broken
                          columns marching off both wings, and the ring wall
     renderArenaFloor     a flagstone plaza with molten fissures — no lanes
     renderArenaMarks     the floor telegraphs (every attack announces itself)
     drawCover / drawKaijuCore / drawArenaBeams  in the sorted draw list
   None of it changes project().  It is all quads fed through the same
   projection the rest of the game uses.                                   */
var AR_PAL={
  slab :{lo:"#3a2118", mid:"#6b4130", hi:"#a8735a", trim:"#241310"},
  col  :{lo:"#2c1a16", mid:"#5b382c", hi:"#c69a7c", trim:"#180d0a"},
  rune :"#ffb14d", ember:"#ff5a1e", moon:"#ffd9c2", sky:"#2a0d14"
};
function arenaFog(z,pz){ return clamp((z-pz)/(FARZ*0.85),0,1); }
function renderArenaFloor(segs,pz,hz){
  var P=AR_PAL.slab, W=AR_HALF, k, i;
  /* the plaza: one quad per depth strip, coursed light/dark every 4 m so the
     flagstones give the speed cue the lane ticks used to give              */
  for(k=segs.length-1;k>=1;k--){
    var zf=segs[k], zn=segs[k-1];
    var aF=project(-W,0,zf), bF=project(W,0,zf),
        aN=project(-W,0,zn), bN=project(W,0,zn);
    if(!aF||!bF||!aN||!bN) continue;
    var fog=arenaFog(zf,pz), course=Math.floor(zf/4)%2;
    ruinQuad(aF,bF,bN,aN, mixHex(course?P.mid:P.lo, G.lv.fog, fog*0.74), 1);
    /* transverse joint at the head of every course */
    if(!course && fog<0.8){
      ctx.globalAlpha=(1-fog)*0.30; ctx.fillStyle=P.trim;
      ctx.fillRect(Math.min(aF.x,aN.x), Math.min(aF.y,aN.y),
        Math.max(1,Math.abs(bF.x-aF.x)), Math.max(1,aF.s*0.035));
    }
    ctx.globalAlpha=1;
  }
  /* longitudinal joints — eight of them, so the plaza has grain             */
  ctx.save(); ctx.globalAlpha=0.20; ctx.strokeStyle=P.trim; ctx.lineWidth=1.6;
  for(i=-3;i<=3;i++){
    var jx=i*(W/3.4);
    var j1=project(jx,0.01,pz+NEARZ), j2=project(jx,0.01,pz+FARZ*0.62);
    if(j1&&j2){ ctx.beginPath(); ctx.moveTo(j1.x,j1.y); ctx.lineTo(j2.x,j2.y); ctx.stroke(); }
  }
  ctx.restore();
  renderArenaFissures(pz);
  renderArenaKerb(pz);
}
/* molten seams in the flagstones.  Deterministic from a fixed seed so they do
   not crawl, screen-composited so they glow rather than tint.             */
function renderArenaFissures(pz){
  var i, seg;
  ctx.save(); ctx.globalCompositeOperation="screen"; ctx.lineCap="round";
  for(i=0;i<9;i++){
    var z0=G.arenaZ0-10+i*11.5;
    if(z0<pz-4 || z0>pz+FARZ*0.7) continue;
    var fog=arenaFog(z0,pz), x0=(rnoise(7.3,i)*2-1)*AR_HALF;
    ctx.globalAlpha=(1-fog)*(0.34+0.10*Math.sin(G.t*1.7+i));
    ctx.strokeStyle=AR_PAL.ember;
    ctx.beginPath();
    for(seg=0;seg<6;seg++){
      var t=seg/5,
          px=x0+(rnoise(19.1,i*7+seg)*2-1)*3.6,
          pt=project(px,0.02,z0+t*9.5);
      if(!pt) break;
      if(seg===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y);
      ctx.lineWidth=Math.max(1,pt.s*0.055);
    }
    ctx.stroke();
  }
  ctx.restore();
}
/* the hard edge of the world.  Running into it is a bounce, so it has to be
   visible from anywhere on the floor: a kerb line plus a low light wall.  */
function renderArenaKerb(pz){
  var side, z, P=AR_PAL.col;
  ctx.save();
  for(side=-1;side<=1;side+=2){
    var x=side*AR_HALF;
    for(z=Math.floor((pz+NEARZ)/6)*6; z<pz+FARZ*0.72; z+=6){
      var fog=arenaFog(z,pz); if(fog>0.9) continue;
      var a=project(x,0,z), b=project(x,0,z+6),
          c=project(x,1.05,z+6), d=project(x,1.05,z);
      ruinQuad(a,b,c,d, mixHex(P.mid,G.lv.fog,fog*0.8), 1-fog*0.2);
      ctx.globalAlpha=(1-fog)*0.5; ctx.fillStyle=P.hi;
      if(d&&c) ctx.fillRect(Math.min(d.x,c.x), Math.min(d.y,c.y),
        Math.max(1,Math.abs(c.x-d.x)), Math.max(1,a?a.s*0.03:1));
    }
    /* rune strip along the top of the kerb — the eye-catch that tells you
       where the floor ends while you are sprinting sideways at 21 m/s     */
    ctx.globalCompositeOperation="screen";
    var k1=project(x,1.12,pz+2), k2=project(x,1.12,pz+FARZ*0.5);
    if(k1&&k2){
      ctx.globalAlpha=0.30+0.12*Math.sin(G.t*2.2+side);
      ctx.strokeStyle=AR_PAL.rune; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(k1.x,k1.y); ctx.lineTo(k2.x,k2.y); ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";
  }
  ctx.restore();
}
/* SKY LAYER.  Runs between renderSky() and renderGround(), so everything here
   must live at or above the horizon — renderGround() opens with a full-width
   fill below hz and would erase anything lower.  The near colonnade is drawn
   later, in renderArenaMarks(), for exactly that reason.                  */
function renderArenaBackdrop(hz){
  var i, ph=boss?boss.phase:1;
  /* a sky that is on fire, hotter with every phase — the awe dial          */
  var g=ctx.createLinearGradient(0,0,0,hz+8);
  g.addColorStop(0,hexA(AR_PAL.sky,0.92));
  g.addColorStop(0.55,hexA("#7a1c18",0.55+ph*0.07));
  g.addColorStop(1,hexA(AR_PAL.ember,0.30+ph*0.06));
  ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,VW,hz+8);
  /* TWIN MOONS.  Phobos low and large, Deimos small and high — parallaxed off
     cam.x only, so they sit at infinity the way they should.               */
  ctx.globalCompositeOperation="screen";
  var moons=[[0.70,-0.52,74,0.55],[0.28,-1.05,26,0.40]];
  for(i=0;i<moons.length;i++){
    var mx=VW*moons[i][0]-cam.x*3.2, my=hz+moons[i][1]*160, mr=moons[i][2];
    var mg=ctx.createRadialGradient(mx,my,mr*0.25,mx,my,mr*2.6);
    mg.addColorStop(0,hexA(AR_PAL.moon,moons[i][3]));
    mg.addColorStop(1,hexA(AR_PAL.moon,0));
    ctx.globalAlpha=1; ctx.fillStyle=mg;
    ctx.beginPath(); ctx.arc(mx,my,mr*2.6,0,6.2832); ctx.fill();
    ctx.globalAlpha=0.80; ctx.fillStyle=AR_PAL.moon;
    ctx.beginPath(); ctx.arc(mx,my,mr,0,6.2832); ctx.fill();
    /* a crater bite so the disc is not a perfect circle */
    ctx.globalAlpha=0.16; ctx.fillStyle="#6b4130";
    ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.22,mr*0.34,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  /* THE RING WALL.  A single colossal battlement enclosing the whole plaza,
     drawn as a silhouette band riding the horizon with lit rune windows.
     This is the "wall he can hide behind" complaint answered at the scale of
     the SET, on top of the pillars that answer it mechanically.           */
  var top=hz-64-ph*6, wob;
  ctx.globalAlpha=0.95; ctx.fillStyle=mixHex(AR_PAL.col.lo,G.lv.fog,0.30);
  ctx.beginPath(); ctx.moveTo(-4,hz+10);
  for(i=-4;i<=VW+8;i+=16){
    wob=fbm((i-cam.x*6)*0.004+3.1);
    ctx.lineTo(i, top + 26*wob + (Math.floor((i-cam.x*6)/96)%2?9:0));
  }
  ctx.lineTo(VW+8,hz+10); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation="screen";
  for(i=0;i<26;i++){
    var wx=((i*97 - cam.x*6)%(VW+180)+VW+180)%(VW+180)-90;
    ctx.globalAlpha=0.22+0.14*Math.sin(G.t*1.6+i);
    ctx.fillStyle=AR_PAL.rune;
    ctx.fillRect(wx, top+30+ (i%3)*7, 5, 15);
  }
  ctx.restore();
}
/* FLOOR + MID LAYER.  Runs after the plaza is down and before anything with a
   hitbox is drawn, so the colonnade sits behind Dogelon and the telegraphs sit
   under him.  Order inside matters: scenery, then rank marks, then warnings —
   the warnings must be the brightest thing on the floor.                  */
function renderArenaMarks(pz){
  renderArenaColonnade(pz);
  renderArenaRanks(pz);
  renderArenaWarnings(pz);
}
/* THE COLONNADE.  Four files of colossal broken columns, two per side, 24-42 m
   tall — five times the height of the cover you actually hide behind.  They
   have no hitbox: their entire job is to say "you are very small and this
   place was built by something else".                                     */
function renderArenaColonnade(pz){
  var P=AR_PAL.col, files=[AR_HALF+4.6, AR_HALF+15.5], f, side, z, i;
  var list=[];
  for(f=0;f<files.length;f++) for(side=-1;side<=1;side+=2){
    for(z=Math.floor((pz-20)/16)*16; z<pz+FARZ*0.8; z+=16){
      var sd=(f*31+ (side>0?7:0) + Math.floor(z/16)*13);
      list.push({x:side*files[f]+ (rnoise(sd,1)*2-1)*1.4, z:z+rnoise(sd,2)*6,
        h:24+rnoise(sd,3)*18, w:1.5+rnoise(sd,4)*1.2, seed:sd,
        broke:rnoise(sd,5)});
    }
  }
  list.sort(function(a,b){ return b.z-a.z; });
  ctx.save();
  for(i=0;i<list.length;i++){
    var c=list[i], fog=arenaFog(c.z,pz);
    if(fog>0.94) continue;
    var h=c.h*(0.42+c.broke*0.58);            /* most of them are snapped off */
    var tw=c.w*0.72;
    var bl=project(c.x-c.w,0,c.z), br=project(c.x+c.w,0,c.z),
        tl=project(c.x-tw,h,c.z), tr=project(c.x+tw,h,c.z);
    if(!bl||!br||!tl||!tr) continue;
    var body=mixHex(P.mid,G.lv.fog,0.10+fog*0.80);
    ruinQuad(bl,br,tr,tl,body,1);
    /* lit edge down the inboard face, so the file reads as a row of cylinders
       and not as a row of flat slabs                                       */
    var il=project(c.x-c.w*(c.x<0?-0.55:0.55),0,c.z),
        it=project(c.x-tw*(c.x<0?-0.55:0.55),h,c.z);
    if(il&&it){
      ctx.globalAlpha=(1-fog)*0.42; ctx.strokeStyle=P.hi;
      ctx.lineWidth=Math.max(1,bl.s*0.05);
      ctx.beginPath(); ctx.moveTo(il.x,il.y); ctx.lineTo(it.x,it.y); ctx.stroke();
    }
    /* drum joints, and a rune ring on the taller ones                       */
    ctx.globalAlpha=(1-fog)*0.24; ctx.fillStyle=P.trim;
    for(var d=1;d<=4;d++){
      var jl=project(c.x-c.w,h*(d/5),c.z), jr=project(c.x+c.w,h*(d/5),c.z);
      if(jl&&jr) ctx.fillRect(jl.x,jl.y,Math.max(1,jr.x-jl.x),Math.max(1,bl.s*0.03));
    }
    if(h>22 && fog<0.7){
      ctx.globalCompositeOperation="screen";
      ctx.globalAlpha=(1-fog)*(0.30+0.14*Math.sin(G.t*1.9+c.seed));
      ctx.fillStyle=AR_PAL.rune;
      var rl=project(c.x-c.w*0.9,h*0.62,c.z), rr=project(c.x+c.w*0.9,h*0.62,c.z);
      if(rl&&rr) ctx.fillRect(rl.x,rl.y,Math.max(1,rr.x-rl.x),Math.max(1,bl.s*0.06));
      ctx.globalCompositeOperation="source-over";
    }
    /* the snapped crown: a ragged cap instead of a clean rectangle */
    ctx.globalAlpha=(1-fog)*0.9; ctx.fillStyle=mixHex(P.hi,G.lv.fog,0.2+fog*0.7);
    ctx.beginPath(); ctx.moveTo(tl.x,tl.y);
    ctx.lineTo(tl.x+(tr.x-tl.x)*0.35, tl.y-Math.max(1,bl.s*0.10*rnoise(c.seed,9)));
    ctx.lineTo(tl.x+(tr.x-tl.x)*0.72, tl.y+Math.max(1,bl.s*0.05));
    ctx.lineTo(tr.x,tr.y); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
/* the four ranks, drawn as processional bands across the plaza.  The one you
   hold is lit; the one ahead is a dim promise; the ones behind go dark.  This
   is the progress bar for the fight, and it lives in the world.           */
function renderArenaRanks(pz){
  var i;
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(i=0;i<AR_LINES.length;i++){
    var z=rankZ(i), fog=arenaFog(z,pz);
    if(z<pz-6 || fog>0.92) continue;
    var cur=(i===G.line), ahead=(i>G.line);
    var a=project(-AR_HALF,0.03,z), b=project(AR_HALF,0.03,z);
    if(!a||!b) continue;
    ctx.globalAlpha=(1-fog)*(cur?0.50+0.16*Math.sin(G.t*3):(ahead?0.16:0.07));
    ctx.strokeStyle=cur?"#ffe066":AR_PAL.rune;
    ctx.lineWidth=Math.max(1.5,a.s*(cur?0.075:0.04));
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    if(ahead && i===G.line+1){
      var mid=project(0,1.2,z);
      if(mid) txt("RANK "+(i+1),mid.x,mid.y,Math.max(10,Math.min(22,0.30*mid.s)),
                  "#ffcf4a","center");
    }
  }
  ctx.restore();
}
/* THE TELEGRAPHS.  "dogelon is incapable of dodging the rays" was a rendering
   failure as much as a design one: the old beam had no floor mark at all.
   Every attack now paints its footprint on the flagstones BEFORE it lands,
   and each footprint has a different shape so you can read it at a glance:
     sweep   a broad band that slides                 -> get behind masonry
     mortar  filling circles                          -> leave the circle
     lance   a narrow column with a chevron           -> sprint sideways
     stomp   the existing expanding ring              -> jump                */
function renderArenaWarnings(pz){
  var b=boss, i, k;
  ctx.save();
  /* mortars: a ring that closes as the shell falls */
  for(i=0;i<G.mortars.length;i++){
    var m=G.mortars[i], t=1-clamp(m.t/m.T,0,1), fog=arenaFog(m.z,pz);
    var c0=project(m.x,0.04,m.z);
    if(!c0 || fog>0.95) continue;
    var rr=Math.max(2,m.r*c0.s), ry=rr*0.34;
    ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=(1-fog)*(0.20+0.30*t);
    ctx.strokeStyle="#ffb14d"; ctx.lineWidth=Math.max(1.5,c0.s*0.05);
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(c0.x,c0.y,rr,ry,0,0,6.2832);
    ctx.stroke();
    /* the inner ring is the fuse: when it meets the outer one, it lands */
    ctx.globalAlpha=(1-fog)*(0.30+0.45*t);
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(c0.x,c0.y,rr*t,ry*t,0,0,6.2832);
    ctx.stroke();
    ctx.globalCompositeOperation="source-over";
  }
  if(b && !b.dead){
    /* sweep: the band, during the wind-up AND while it is live */
    if(b.mode==="sweep"){
      var lead=(b.warn>0), bx=b.beamX;
      arenaFloorBand(bx,3.1,pz,lead?0.24+0.22*Math.sin(G.t*22):0.42,
                     lead?"#ff7ad2":"#ffa8e6");
    }
    if(b.mode==="lance"){
      arenaFloorBand(G.lanceX,1.9,pz,(b.warn>0?0.26+0.26*Math.sin(G.t*26):0.46),
                     "#ffe066");
      /* a chevron at the head of the column: the "run" cue */
      var cp=project(G.lanceX,0.05,player?player.z+5:0);
      if(cp && b.warn>0){
        ctx.globalAlpha=0.7; ctx.strokeStyle="#ffe066";
        ctx.lineWidth=Math.max(2,cp.s*0.05);
        ctx.beginPath();
        ctx.moveTo(cp.x-cp.s*0.16,cp.y-cp.s*0.09);
        ctx.lineTo(cp.x,cp.y); ctx.lineTo(cp.x+cp.s*0.16,cp.y-cp.s*0.09);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}
/* a depth-running strip of floor, used by both beam telegraphs */
function arenaFloorBand(x,half,pz,alpha,col){
  var z0=pz-4, z1=Math.min(pz+FARZ*0.55, arenaBossZ());
  var a=project(x-half,0.05,z0), b=project(x+half,0.05,z0),
      c=project(x+half,0.05,z1), d=project(x-half,0.05,z1);
  if(!a||!b||!c||!d) return;
  ctx.save(); ctx.globalCompositeOperation="screen";
  ruinQuad(a,b,c,d,col,alpha);
  ctx.globalAlpha=alpha*1.5; ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(d.x,d.y);
  ctx.moveTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  ctx.restore();
}
/* ARENA_RENDER_A */
function renderProps(){
  var lv=G.lv, pz=player?player.z:0;
  var list=props.slice().sort(function(a,b){return b.z-a.z;});
  for(var i=0;i<list.length;i++){
    var p=list[i], fogT=clamp((p.z-pz)/FARZ,0,1);
    if(fogT>=0.99) continue;
    var b=project(p.x,0,p.z), t=project(p.x,p.s*2.1,p.z);
    if(!b||!t) continue;
    var w=Math.max(2,p.s*1.15*b.s), h=Math.abs(b.y-t.y);
    var dark=mixHex(lv.mtn,lv.fog,0.18+fogT*0.72);
    var lit =mixHex(lv.ground,lv.fog,fogT*0.7);
    ctx.save();
    ctx.globalAlpha=1-fogT*0.15;
    if(p.t==="rock"||p.t==="spire"){
      var tipW=p.t==="spire"?w*0.13:w*0.45;
      ctx.fillStyle=dark;
      ctx.beginPath();
      ctx.moveTo(b.x-w*0.5,b.y); ctx.lineTo(b.x-tipW*0.5,t.y);
      ctx.lineTo(b.x+tipW*0.5,t.y); ctx.lineTo(b.x+w*0.5,b.y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=lit; ctx.globalAlpha=(1-fogT)*0.5;
      ctx.beginPath();
      ctx.moveTo(b.x-w*0.5,b.y); ctx.lineTo(b.x-tipW*0.5,t.y);
      ctx.lineTo(b.x-tipW*0.5+w*0.16,t.y); ctx.lineTo(b.x-w*0.5+w*0.24,b.y);
      ctx.closePath(); ctx.fill();
    } else if(p.t==="crystal"){
      ctx.globalCompositeOperation="screen"; ctx.globalAlpha=(1-fogT)*0.75;
      ctx.fillStyle=lv.rail;
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-w*0.42,b.y-h*0.55);
      ctx.lineTo(b.x,t.y); ctx.lineTo(b.x+w*0.42,b.y-h*0.55);
      ctx.closePath(); ctx.fill();
    } else if(p.t==="pylon"){
      ctx.fillStyle=dark; ctx.fillRect(b.x-w*0.16,t.y,w*0.32,h);
      ctx.globalCompositeOperation="screen"; ctx.globalAlpha=(1-fogT)*0.85;
      ctx.fillStyle=lv.rail;
      for(var s=0;s<4;s++){
        var yy=t.y+h*(0.12+s*0.22)+Math.sin(G.t*2+p.sd+s)*2;
        ctx.fillRect(b.x-w*0.24,yy,w*0.48,Math.max(1,h*0.020));
      }
    } else {                             /* arch */
      ctx.fillStyle=dark; ctx.lineWidth=Math.max(2,w*0.22);
      ctx.strokeStyle=dark; ctx.beginPath();
      ctx.ellipse?ctx.ellipse(b.x,b.y,w*0.62,h*0.9,0,Math.PI,0):0;
      ctx.stroke();
    }
    ctx.restore();
  }
}
/* ---- ground shadows: always readable even when a sprite is hidden -- */
function shadow(x,y,z,rad,strength){
  var g=project(x,0.015,z); if(!g) return;
  var lift=clamp(1-(y/6),0.25,1);
  var rx=Math.max(1.5,rad*g.s*lift), ry=Math.max(1,rx*0.34);
  ctx.save(); ctx.globalAlpha=0.42*lift*(strength||1);
  ctx.fillStyle="#000";
  ctx.beginPath();
  if(ctx.ellipse) ctx.ellipse(g.x,g.y,rx,ry,0,0,6.283);
  else ctx.arc(g.x,g.y,rx,0,6.283);
  ctx.fill(); ctx.restore();
}
function renderRings(){
  for(var i=0;i<rings.length;i++){
    var r=rings[i], k=1-(r.t/r.T);
    ctx.save(); ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=(1-k)*0.85;
    ctx.strokeStyle=r.col; ctx.lineWidth=2;
    ctx.beginPath();
    var first=true;
    for(var a=0;a<=24;a++){
      var th=a/24*6.283;
      var pt=project(r.x+Math.cos(th)*r.r, 0.06, r.z+Math.sin(th)*r.r);
      if(!pt){ first=true; continue; }
      if(first){ ctx.moveTo(pt.x,pt.y); first=false; } else ctx.lineTo(pt.x,pt.y);
    }
    ctx.stroke();
    if(r.harm){ ctx.globalAlpha=(1-k)*0.32; ctx.lineWidth=8; ctx.stroke(); }
    ctx.restore();
  }
}
/* ---- the sorted sprite pass ------------------------------------ */
var drawList=[];
function buildDrawList(){
  drawList.length=0;
  var i;
  for(i=0;i<ents.length;i++)     drawList.push({z:ents[i].z, k:"ent", o:ents[i]});
  for(i=0;i<pickups.length;i++)  drawList.push({z:pickups[i].z, k:"pick", o:pickups[i]});
  for(i=0;i<parts.length;i++)    drawList.push({z:parts[i].z, k:"part", o:parts[i]});
  for(i=0;i<bullets.length;i++)  drawList.push({z:bullets[i].z, k:"bul", o:bullets[i]});
  for(i=0;i<ebullets.length;i++) drawList.push({z:ebullets[i].z, k:"ebul", o:ebullets[i]});
  for(i=0;i<streaks.length;i++)  drawList.push({z:streaks[i].tz, k:"streak", o:streaks[i]});
  for(i=0;i<G.ord.length;i++)    drawList.push({z:G.ord[i].z, k:"ord", o:G.ord[i]});
  /* arena masonry joins the SAME painter's-algorithm list as everything else,
     which is the only way Dogelon can actually be hidden BEHIND a pillar: a
     block in front of him sorts later and paints over him.               */
  if(G.arena) for(i=0;i<G.covers.length;i++){
    if(G.covers[i].rubble>=2) continue;
    drawList.push({z:G.covers[i].z, k:"cover", o:G.covers[i]});
  }
  if(boss) drawList.push({z:boss.z, k:"boss", o:boss});
  if(player) drawList.push({z:player.z, k:"player", o:player});
  drawList.sort(function(a,b){ return b.z-a.z; });
}
function renderDrawList(){
  /* shadows first, all of them, so depth stays legible */
  for(var s=0;s<ents.length;s++){
    var e=ents[s];
    if(e.kind==="hazard"&&e.sub!=="rock") continue;
    shadow(e.x,e.y,e.z,e.r*0.95,1);
  }
  if(boss&&!boss.dead) shadow(boss.x,0,boss.z,boss.w*0.42,1.1);
  if(G.arena) for(var cs=0;cs<G.covers.length;cs++){
    var cc=G.covers[cs];
    if(cc.rubble<2) shadow(cc.x,0,cc.z,cc.w*1.15,0.9);
  }
  /* drawMount() lays down its own wider contact shadow under the wheels, so the
     on-foot ellipse is skipped while riding — otherwise the rover drags two. */
  if(player&&!player.dead&&!player.riding) shadow(player.x,player.y,player.z,1.15,1.15);
  for(var i=0;i<drawList.length;i++){
    var d=drawList[i];
    try{
      if(d.k==="ent")        drawEnt(d.o);
      else if(d.k==="pick")  drawPickup(d.o);
      else if(d.k==="part")  drawPart(d.o);
      else if(d.k==="bul")   drawBullet(d.o);
      else if(d.k==="ebul")  drawEBullet(d.o);
      else if(d.k==="streak")drawStreak(d.o);
      else if(d.k==="ord")   drawOrd(d.o);
      else if(d.k==="cover") drawCover(d.o);
      else if(d.k==="boss")  drawBoss(d.o);
      else if(d.k==="player")drawPlayer(d.o);
    }catch(err){ reportErr("draw:"+d.k,err); }
  }
}
function fogAlpha(z){ return clamp(1-((z-(player?player.z:0))/FARZ),0.06,1); }

function drawEnt(e){
  var pz=player?player.z:0;
  if(e.z<pz-8) return;
  if(e.kind==="hazard"){ drawHazard(e); return; }
  var pt=project(e.x, e.y+e.h*0.5, e.z); if(!pt) return;
  var hpx=e.h*pt.s;
  if(hpx<3) return;
  var fa=fogAlpha(e.z);
  /* Only two enemy chassis remain in the world — the retired mount had its own
     sheet and its own branch here, and both are gone.                      */
  var sheet = e.kind==="drone"?"drone":"walker";
  var idx, dying=e.dead;
  if(e.kind==="drone")  idx = dying? liveFrame("drone",6+Math.floor(e.deadT*10))
                                   : liveFrame("drone",Math.floor(e.anim)%6);
  else idx = dying? liveFrame("walker",8+Math.floor(e.deadT*8))
                  : liveFrame("walker",Math.floor(e.anim)%8);
  var opt={alpha:fa};
  var ok;
  if(e.flash>0) ok=drawFrameTint(sheet,idx,pt.x,pt.y,hpx,"#ffffff",0.85,opt);
  else if(dying) ok=drawFrameTint(sheet,idx,pt.x,pt.y,hpx,"#ff3a2a",0.45,
                    {alpha:fa*clamp(1-e.deadT/0.7,0,1)});
  else ok=drawFrame(sheet,idx,pt.x,pt.y,hpx,opt);
  if(!ok) fallbackBot(e,pt,hpx,fa);
  if(e.tier>0&&!dying){ ctx.save(); ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=0.30*fa; ctx.fillStyle="#ff4a6a";
    ctx.beginPath(); ctx.arc(pt.x,pt.y,hpx*0.62,0,6.283); ctx.fill(); ctx.restore(); }
  if(!dying) enemyHpPips(e,pt,hpx,fa);
}
/* vector fallbacks so the game is never blank if a PNG is missing */
function fallbackBot(e,pt,hpx,fa){
  ctx.save(); ctx.globalAlpha=fa;
  var r=hpx*0.42;
  if(e.kind==="drone"){
    ctx.fillStyle="#8a2020"; ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,6.283); ctx.fill();
    ctx.fillStyle="#3a0a0a"; ctx.fillRect(pt.x-r,pt.y-r*0.16,r*2,r*0.32);
    ctx.globalCompositeOperation="screen"; ctx.fillStyle="#ff3030";
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r*0.30,0,6.283); ctx.fill();
  } else if(e.kind==="walker"){
    ctx.fillStyle="#7a2a2a"; ctx.fillRect(pt.x-r*0.7,pt.y-r,r*1.4,r*1.5);
    ctx.fillStyle="#3a1010"; ctx.fillRect(pt.x-r*0.6,pt.y+r*0.5,r*0.3,r*0.6);
    ctx.fillRect(pt.x+r*0.3,pt.y+r*0.5,r*0.3,r*0.6);
    ctx.globalCompositeOperation="screen"; ctx.fillStyle="#ff5a30";
    ctx.fillRect(pt.x-r*0.3,pt.y-r*0.6,r*0.6,r*0.2);
  } else {
    ctx.fillStyle="#1e6a2e"; ctx.fillRect(pt.x-r,pt.y-r*0.7,r*2,r*1.4);
    ctx.globalCompositeOperation="screen"; ctx.strokeStyle="#7dff5a";
    ctx.lineWidth=2; ctx.strokeRect(pt.x-r,pt.y-r*0.7,r*2,r*1.4);
  }
  ctx.restore();
}
function enemyHpPips(e,pt,hpx,fa){
  if(e.maxHp<=1) return;
  var w=Math.max(10,hpx*0.62), h=Math.max(2,hpx*0.045);
  var x=pt.x-w/2, y=pt.y-hpx*0.60-h*2.4;
  ctx.save(); ctx.globalAlpha=0.85*fa;
  ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(x-1,y-1,w+2,h+2);
  var f=clamp(e.hp/e.maxHp,0,1);
  ctx.fillStyle=f>0.6?"#7dff9a":(f>0.3?"#ffd24a":"#ff5a4a");
  ctx.fillRect(x,y,w*f,h);
  ctx.restore();
}
function drawHazard(e){
  var lv=G.lv, pt=project(e.x,e.y+0.8,e.z); if(!pt) return;
  var fa=fogAlpha(e.z), s=pt.s;
  ctx.save(); ctx.globalAlpha=fa;
  if(e.ruin){ drawRuin(e,fa); ctx.restore(); return; }
  if(e.sub==="lava"){
    var g=project(e.x,0.05,e.z); if(!g){ ctx.restore(); return; }
    ctx.globalCompositeOperation="screen";
    ctx.fillStyle=e.active?"#ff8a2a":"#5a2010";
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(g.x,g.y,e.r*s,e.r*s*0.32,0,0,6.283);
    else ctx.arc(g.x,g.y,e.r*s,0,6.283);
    ctx.fill();
    if(e.active){
      var top=project(e.x,4.6,e.z);
      if(top){
        var grd=ctx.createLinearGradient(0,top.y,0,g.y);
        grd.addColorStop(0,"rgba(255,240,180,0)");
        grd.addColorStop(0.4,"rgba(255,170,60,0.75)");
        grd.addColorStop(1,"rgba(255,90,30,0.95)");
        ctx.fillStyle=grd;
        ctx.fillRect(g.x-e.r*s*0.55,top.y,e.r*s*1.1,g.y-top.y);
      }
    }
  } else if(e.sub==="ice"){
    var g2=project(e.x,0.04,e.z); if(!g2){ ctx.restore(); return; }
    ctx.globalCompositeOperation="screen"; ctx.globalAlpha=fa*0.42;
    ctx.fillStyle="#bff0ff";
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(g2.x,g2.y,e.r*s*1.4,e.r*s*0.42,0,0,6.283);
    else ctx.arc(g2.x,g2.y,e.r*s,0,6.283);
    ctx.fill();
  } else if(e.sub==="gate"){ drawGate(e,fa); }
  else { drawRockBlock(e,fa); }
  ctx.restore();
}
function drawGate(e,fa){
  var lv=G.lv;
  var lo=project(-ROAD_HALF,0,e.z), hi=project(ROAD_HALF,3.4,e.z);
  var gl=project(e.gapX-2.6,0,e.z), gr=project(e.gapX+2.6,0,e.z);
  if(!lo||!hi||!gl||!gr) return;
  ctx.save(); ctx.globalCompositeOperation="screen"; ctx.globalAlpha=fa*0.9;
  ctx.fillStyle=lv.rail;
  ctx.fillRect(lo.x, hi.y, Math.max(1,gl.x-lo.x), lo.y-hi.y);
  ctx.fillRect(gr.x, hi.y, Math.max(1,hi.x-gr.x), lo.y-hi.y);
  ctx.globalAlpha=fa*0.35;
  for(var i=0;i<5;i++){
    var yy=hi.y+(lo.y-hi.y)*(i/5)+Math.sin(G.t*7+i)*2;
    ctx.fillRect(lo.x,yy,Math.max(1,gl.x-lo.x),2);
    ctx.fillRect(gr.x,yy,Math.max(1,hi.x-gr.x),2);
  }
  ctx.restore();
}
function drawRockBlock(e,fa){
  var b=project(e.x,0,e.z), t=project(e.x,2.3,e.z);
  if(!b||!t) return;
  var w=e.r*1.7*b.s;
  ctx.save(); ctx.globalAlpha=fa;
  ctx.fillStyle=mixHex(G.lv.mtn,G.lv.fog,fogAlpha(e.z)<0.5?0.4:0.12);
  ctx.beginPath();
  ctx.moveTo(b.x-w*0.5,b.y); ctx.lineTo(b.x-w*0.34,t.y);
  ctx.lineTo(b.x+w*0.30,t.y); ctx.lineTo(b.x+w*0.5,b.y);
  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation="screen"; ctx.globalAlpha=fa*0.30;
  ctx.strokeStyle=G.lv.rail; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
/* ---- 17b. THE RUIN COURSE, DRAWN ------------------------------------------
   Every shape is built from real world-space corners pushed through project(),
   so the ruins sit in the same perspective as the road and their silhouettes
   grow correctly as you close on them — no billboard scaling tricks.  The
   per-sector palette (RUIN_PAL) is what stops the same three shapes reading as
   the same grey prop in all five sectors.                                  */
function ruinQuad(a,b,c,d,fill,alpha){
  if(!a||!b||!c||!d) return;
  ctx.globalAlpha=alpha; ctx.fillStyle=fill;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
}
/* deterministic per-ruin noise so a given block never shimmers between frames */
function rnoise(seed,i){ var v=Math.sin(seed*12.9898+i*78.233)*43758.5453; return v-Math.floor(v); }
function drawRuin(e,fa){
  var P=RUIN_PAL[e.style]||RUIN_PAL.stone;
  var lit=(e.style==="neon"||e.style==="ice"||e.style==="bone");
  shadow(e.x,0,e.z,(e.span||e.r)*1.25,0.7);
  if(e.sub==="barrier")   drawRuinWall(e,P,fa,lit);
  else if(e.sub==="arch") drawRuinArch(e,P,fa,lit);
  else                    drawRuinTower(e,P,fa,lit);
  /* Coaching.  The first handful of obstacles name the control that beats them
     and then the prompts stop for good — the course has to teach JUMP and
     SLIDE, because until now nothing in the game ever required either.     */
  if(G.ruinCleared<7 && !e.cleared && !e.hit){
    var d=e.z-(player?player.z:0);
    if(d>7 && d<54){
      /* behind the wheel a barrier is not a jump, it is a target — the prompt
         has to name what the player can actually do or it teaches a lie     */
      var ride=!!(player&&player.riding&&!player.dead);
      var lab=e.sub==="barrier"?(ride?"SMASH  →":"JUMP  ↑")
             :(e.sub==="arch"?"SLIDE  ↓":"GO AROUND");
      var ty=e.sub==="tower"?3.4:((e.sub==="arch"?e.hi:e.top)+1.4);
      var tp=project(e.x,ty,e.z);
      if(tp) txt(lab,tp.x,tp.y,Math.max(11,Math.min(28,0.46*tp.s)),
