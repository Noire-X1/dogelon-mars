function drawRuinWall(e,P,fa,lit){
  var sp=e.span, h=e.top, z=e.z, x=e.x, th=0.6;
  var bl=project(x-sp,0,z-th), br=project(x+sp,0,z-th);
  if(!bl||!br) return;
  /* the top slab first — the bites taken out of the parapet below reveal it,
     which is what makes the wall read as solid masonry rather than a decal  */
  var tl=project(x-sp,h,z-th), tr=project(x+sp,h,z-th),
      kl=project(x-sp,h,z+th), kr=project(x+sp,h,z+th);
  ruinQuad(tl,kl,kr,tr,P.hi,fa*0.9);
  /* ragged front face: N top vertices at varying heights = ruined battlement */
  var n=Math.max(3,Math.round(sp*2.2)), i, pt, top=[];
  for(i=0;i<=n;i++){
    var fx=x-sp+(2*sp)*(i/n);
    var bite=(i===0||i===n)?0.06:(0.06+rnoise(e.seed,i)*0.34);
    top.push(project(fx,h-bite*h*0.42,z-th));
  }
  ctx.globalAlpha=fa;
  var g=ctx.createLinearGradient(0,(tl?tl.y:bl.y-40),0,bl.y);
  g.addColorStop(0,P.mid); g.addColorStop(0.72,P.lo); g.addColorStop(1,P.trim);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(bl.x,bl.y);
  for(i=0;i<top.length;i++){ pt=top[i]; if(pt) ctx.lineTo(pt.x,pt.y); }
  ctx.lineTo(br.x,br.y); ctx.closePath(); ctx.fill();
  /* course lines: three horizontal joints, thinner with distance             */
  ctx.globalAlpha=fa*0.30; ctx.fillStyle=P.trim;
  for(i=1;i<=3;i++){
    var jy=project(x,h*(i/4),z-th), jl=project(x-sp,h*(i/4),z-th);
    if(jy&&jl) ctx.fillRect(jl.x,jy.y,Math.max(1,(jy.x-jl.x)*2),Math.max(1,bl.s*0.05));
  }
  /* rune band — the "cool looking towering ruins" beat, and it doubles as a
     readability aid: the glow is the thing your eye catches at 60 m/s       */
  if(lit){
    var rl=project(x-sp*0.72,h*0.55,z-th-0.02), rr=project(x+sp*0.72,h*0.55,z-th-0.02);
    if(rl&&rr){
      ctx.globalCompositeOperation="screen";
      ctx.globalAlpha=fa*(0.42+0.20*Math.sin(G.t*2.4+e.seed));
      ctx.fillStyle=P.hi;
      ctx.fillRect(rl.x,rl.y,Math.max(1,rr.x-rl.x),Math.max(1,bl.s*0.10));
      ctx.globalCompositeOperation="source-over";
    }
  }
}
/* The arch is the SLIDE gate.  Its legs are deliberately drawn just OUTSIDE
   the collision half-width, so "run around the outside" is a visually honest
   alternative to sliding and you never clip a leg you could see was clear. */
function drawRuinArch(e,P,fa,lit){
  var sp=e.span, x=e.x, z=e.z, lo=e.lo, hi=e.hi, th=0.55, lw=0.62;
  var legX=sp+0.62;
  for(var side=-1;side<=1;side+=2){
    var cx=x+side*legX;
    var a=project(cx-lw,0,z-th), b=project(cx+lw,0,z-th),
        c=project(cx+lw,lo+0.9,z-th), d=project(cx-lw,lo+0.9,z-th);
    ruinQuad(a,b,c,d,P.lo,fa);
    var e1=project(cx-lw,lo+0.9,z-th), e2=project(cx-lw,lo+0.9,z+th),
        e3=project(cx+lw,lo+0.9,z+th), e4=project(cx+lw,lo+0.9,z-th);
    ruinQuad(e1,e2,e3,e4,P.hi,fa*0.85);
  }
  /* crossbeam: underside at `lo`, which is the number the collision test uses */
  var bl=project(x-legX-lw,lo,z-th), br=project(x+legX+lw,lo,z-th),
      tl=project(x-legX-lw,lo+1.35,z-th), tr=project(x+legX+lw,lo+1.35,z-th);
  if(bl&&br&&tl&&tr){
    ctx.globalAlpha=fa;
    var g=ctx.createLinearGradient(0,tl.y,0,bl.y);
    g.addColorStop(0,P.mid); g.addColorStop(1,P.lo);
    ruinQuad(bl,tl,tr,br,g,fa);
    /* lit underside so the gap you have to slide through is unmistakable    */
    ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=fa*(lit?0.55:0.28);
    ctx.fillStyle=lit?P.hi:"#ffd27a";
    ctx.fillRect(bl.x,bl.y-Math.max(1,bl.s*0.05),Math.max(1,br.x-bl.x),
                 Math.max(1,bl.s*0.05));
    ctx.globalCompositeOperation="source-over";
  }
  /* broken pediment climbing to `hi` — half of it has fallen away, which is
     what makes the silhouette read as a ruin and not as a doorway            */
  var pl=project(x-legX*0.86,lo+1.35,z-th), pr=project(x+legX*0.52,lo+1.35,z-th),
      pk=project(x-legX*0.12,hi,z-th), pb=project(x+legX*0.52,lo+2.6,z-th);
  if(pl&&pr&&pk&&pb){
    ctx.globalAlpha=fa; ctx.fillStyle=P.mid;
    ctx.beginPath(); ctx.moveTo(pl.x,pl.y); ctx.lineTo(pk.x,pk.y);
    ctx.lineTo(pb.x,pb.y); ctx.lineTo(pr.x,pr.y); ctx.closePath(); ctx.fill();
  }
}
/* The tower is the STEER obstacle: 7-13 m of tapered spire with a snapped top.
   There is no vertical answer to it at all, which is the point — it forces the
   lateral read that the lane used to get for free from enemy placement.    */
function drawRuinTower(e,P,fa,lit){
  var sp=e.span, x=e.x, z=e.z, h=e.top, th=0.7;
  var tw=sp*0.46;                                  /* half-width at the top  */
  var bl=project(x-sp,0,z-th), br=project(x+sp,0,z-th),
      tl=project(x-tw,h,z-th), tr=project(x+tw,h,z-th);
  if(!bl||!br||!tl||!tr) return;
  ctx.globalAlpha=fa;
  var g=ctx.createLinearGradient(0,tl.y,0,bl.y);
  g.addColorStop(0,P.hi); g.addColorStop(0.28,P.mid);
  g.addColorStop(0.85,P.lo); g.addColorStop(1,P.trim);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(bl.x,bl.y); ctx.lineTo(tl.x,tl.y);
  ctx.lineTo(tr.x,tr.y); ctx.lineTo(br.x,br.y); ctx.closePath(); ctx.fill();
  /* the shaded right flank gives it volume without a second light source    */
  var sl=project(x+tw,h,z-th), s2=project(x+tw*0.9,h,z+th),
      s3=project(x+sp*0.9,0,z+th), s4=project(x+sp,0,z-th);
  ruinQuad(sl,s2,s3,s4,P.trim,fa*0.7);
  /* snapped crown: a jagged cap, leaning the way it fell                    */
  var lean=(rnoise(e.seed,3)-0.5)*sp*0.8;
  var cn=[project(x-tw,h,z-th),
          project(x-tw*0.35+lean,h+sp*0.55,z-th),
          project(x+tw*0.20+lean,h+sp*0.22,z-th),
          project(x+tw,h,z-th)];
  if(cn[0]&&cn[1]&&cn[2]&&cn[3]){
    ctx.globalAlpha=fa; ctx.fillStyle=P.mid;
    ctx.beginPath(); ctx.moveTo(cn[0].x,cn[0].y);
    for(var i=1;i<4;i++) ctx.lineTo(cn[i].x,cn[i].y);
    ctx.closePath(); ctx.fill();
  }
  /* ledges — four of them, which also gives the eye a height reference      */
  ctx.globalAlpha=fa*0.34; ctx.fillStyle=P.trim;
  for(var k=1;k<=4;k++){
    var f=k/5, hw=lerp(sp,tw,f)*1.06;
    var a=project(x-hw,h*f,z-th), b=project(x+hw,h*f,z-th);
    if(a&&b) ctx.fillRect(a.x,a.y,Math.max(1,b.x-a.x),Math.max(1,a.s*0.07));
  }
  if(lit){
    ctx.globalCompositeOperation="screen";
    for(var m=0;m<3;m++){
      var f2=0.22+m*0.24, hw2=lerp(sp,tw,f2)*0.55;
      var ra=project(x-hw2,h*f2,z-th-0.02), rb=project(x+hw2,h*f2,z-th-0.02);
      if(ra&&rb){
        ctx.globalAlpha=fa*(0.30+0.22*Math.sin(G.t*2+m*1.7+e.seed));
        ctx.fillStyle=P.hi;
        ctx.fillRect(ra.x,ra.y,Math.max(1,rb.x-ra.x),Math.max(1,ra.s*0.06));
      }
    }
    ctx.globalCompositeOperation="source-over";
  }
}
function drawPickup(k){
  var pt=project(k.x,k.y+Math.sin(k.t*3)*0.22,k.z); if(!pt) return;
  var r=Math.max(2,0.62*pt.s), fa=fogAlpha(k.z), col=pickupCol(k.kind);
  shadow(k.x,k.y,k.z,0.55,0.7);
  ctx.save(); ctx.globalAlpha=fa; ctx.globalCompositeOperation="screen";
  var g=ctx.createRadialGradient(pt.x,pt.y,r*0.15,pt.x,pt.y,r*2.4);
  g.addColorStop(0,col); g.addColorStop(0.35,col); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalAlpha=fa*0.55; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(pt.x,pt.y,r*2.4,0,6.283); ctx.fill();
  ctx.globalAlpha=fa; ctx.globalCompositeOperation="source-over";
  ctx.fillStyle=col;
  if(k.kind==="coin"){
    var sq=Math.abs(Math.cos(k.t*3.2));
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(pt.x,pt.y,Math.max(1,r*sq),r,0,0,6.283);
    else ctx.arc(pt.x,pt.y,r,0,6.283);
    ctx.fill();
    ctx.fillStyle="#6b4400"; ctx.font="bold "+Math.max(6,r*1.2)+"px Verdana";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(sq>0.45) ctx.fillText("X",pt.x,pt.y+1);
  } else if(k.kind==="jet"){
    /* the rarest drop gets its own read: a gold ring with the ship's delta
       spinning inside it at G.t*1.4, and a label so it is never mistaken for
       a power-up pip.  Text sits outside the rotation or it tumbles.      */
    ctx.save();
    ctx.translate(pt.x,pt.y);
    ctx.rotate(G.t*1.4);
    ctx.strokeStyle="#ffd27a"; ctx.lineWidth=Math.max(1,r*0.22);
    ctx.beginPath(); ctx.arc(0,0,r*1.35,0.5,5.2); ctx.stroke();
    ctx.fillStyle="#ee1420";
    ctx.beginPath();
    ctx.moveTo(0,-r*1.05); ctx.lineTo(r*0.92,r*0.80);
    ctx.lineTo(0,r*0.34);  ctx.lineTo(-r*0.92,r*0.80);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="#ffd400";
    ctx.fillRect(-r*0.12,-r*0.80,r*0.24,r*1.05);
    ctx.restore();
    ctx.fillStyle="#ffe9bd";
    ctx.font="bold "+Math.max(7,r*0.85)+"px Verdana";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("JET",pt.x,pt.y+r*2.3);
  } else {
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,6.283); ctx.fill();
    ctx.fillStyle="#101018"; ctx.font="bold "+Math.max(6,r)+"px Verdana";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(k.kind==="hp"?"+":k.kind==="rapid"?"R":k.kind==="shield"?"S":
                 k.kind==="quad"?"Q":"!",pt.x,pt.y+1);
  }
  ctx.restore();
}
/* ---- BULLETS: big, additive, unmistakable ----------------------- */
function drawBullet(b){
  var a=project(b.px,b.py,b.pz), c=project(b.x,b.y,b.z);
  if(!c) return;
  var quad=(b.hue==="q");

      out =quad?"#7a10d0":"#ff5a10";

  if(a){                                     /* motion-stretched tracer */
    var grd=ctx.createLinearGradient(a.x,a.y,c.x,c.y);
    grd.addColorStop(0,"rgba(0,0,0,0)"); grd.addColorStop(0.35,out);
    grd.addColorStop(0.8,mid); grd.addColorStop(1,core);

    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
    ctx.globalAlpha=0.35; ctx.lineWidth=w*3.2;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
    ctx.globalAlpha=1;
  }
  var g=ctx.createRadialGradient(c.x,c.y,w*0.2,c.x,c.y,w*3.4);
  g.addColorStop(0,core); g.addColorStop(0.30,mid);
  g.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(c.x,c.y,w*0.85,0,6.283); ctx.fill();
  ctx.restore();

function drawEBullet(b){
  var a=project(b.px,b.py,b.pz), c=project(b.x,b.y,b.z);

    ctx.lineCap="round"; ctx.beginPath();

function drawStreak(s){

function drawPart(q){

/* ---- KAIJU ------------------------------------------------------ */
/* Stand-in silhouette for when Kaiju_Boss.png is missing or slices blank.
   fallbackBot()'s catch-all branch is a small green crate, which reads as a
   supply drop, not a colossus — a boss this size needs its own shape.      */
function fallbackKaiju(pt,hpx,fa,anim){
  var w=hpx*0.62, sw=Math.sin(anim*0.7)*hpx*0.02;
  ctx.save(); ctx.globalAlpha=fa;
  ctx.fillStyle="#4a1560";
  /* legs */
  ctx.fillRect(pt.x-w*0.34+sw,pt.y+hpx*0.10,w*0.24,hpx*0.40);
  ctx.fillRect(pt.x+w*0.10-sw,pt.y+hpx*0.10,w*0.24,hpx*0.40);
  /* torso + shoulders */
  ctx.fillStyle="#5a1a6a";
  ctx.fillRect(pt.x-w*0.42,pt.y-hpx*0.22,w*0.84,hpx*0.34);
  ctx.fillRect(pt.x-w*0.50,pt.y-hpx*0.26,w,hpx*0.10);
  /* arms */
  ctx.fillRect(pt.x-w*0.62,pt.y-hpx*0.20,w*0.16,hpx*0.30);
  ctx.fillRect(pt.x+w*0.46,pt.y-hpx*0.20,w*0.16,hpx*0.30);
  /* head + horns */
  ctx.fillStyle="#6a2078";
  ctx.fillRect(pt.x-w*0.20,pt.y-hpx*0.46,w*0.40,hpx*0.22);
  ctx.beginPath();
  ctx.moveTo(pt.x-w*0.20,pt.y-hpx*0.46); ctx.lineTo(pt.x-w*0.34,pt.y-hpx*0.62);
  ctx.lineTo(pt.x-w*0.08,pt.y-hpx*0.48); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pt.x+w*0.20,pt.y-hpx*0.46); ctx.lineTo(pt.x+w*0.34,pt.y-hpx*0.62);
  ctx.lineTo(pt.x+w*0.08,pt.y-hpx*0.48); ctx.closePath(); ctx.fill();
  /* eyes + chest core */
  ctx.globalCompositeOperation="screen"; ctx.fillStyle="#ff3a6a";
  ctx.fillRect(pt.x-w*0.15,pt.y-hpx*0.40,w*0.10,hpx*0.045);
  ctx.fillRect(pt.x+w*0.05,pt.y-hpx*0.40,w*0.10,hpx*0.045);
  ctx.globalAlpha=fa*(0.5+0.5*Math.abs(Math.sin(anim*1.3)));
  ctx.beginPath(); ctx.arc(pt.x,pt.y-hpx*0.08,hpx*0.055,0,6.283); ctx.fill();
  ctx.restore();
}
function drawBoss(b){
  var pt=project(b.x,b.y+b.h*0.5,b.z); if(!pt) return;
  /* dramatic entrance: 0.1 -> 1.0 of target height over the first 1.2s */
  var gs=lerp(0.1,1,(b.grow===undefined?1:clamp(b.grow,0,1)));
  var hpx=b.h*pt.s*gs;
  var fade=b.dead?clamp(1-b.deadT/2.2,0,1):1;
  /* dark haze behind so the additive sheet reads against the sky.  The halo
     runs well past the silhouette (1.2x) because at this size the monster
     otherwise sits on top of the sky with no separation at all.           */
  ctx.save(); ctx.globalAlpha=0.55*fade;
  var hg=ctx.createRadialGradient(pt.x,pt.y,hpx*0.2,pt.x,pt.y,hpx*1.2);
  hg.addColorStop(0,"rgba(20,0,14,0.85)"); hg.addColorStop(1,"rgba(20,0,14,0)");
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(pt.x,pt.y,hpx*1.2,0,6.283); ctx.fill();
  ctx.restore();
  var f;
  if(b.mode==="roar") f=liveFrame("kaiju",3);
  else if(b.mode==="beam"||b.mode==="sweep"||b.mode==="lance") f=liveFrame("kaiju",7);
  else if(b.mode==="stomp") f=liveFrame("kaiju",5);
  else if(b.mode==="mortar") f=liveFrame("kaiju",7);
  else f=liveFrame("kaiju",Math.floor(b.anim)%3);
  var ok;
  if(b.flash>0) ok=drawFrameTint("kaiju",f,pt.x,pt.y,hpx,"#ffffff",0.7,{alpha:fade});
  else ok=drawFrame("kaiju",f,pt.x,pt.y,hpx,{alpha:fade});
  if(!ok){
    /* forced to at least 60% of frame height (scaled by the entrance) so a
       failed sheet can never leave you fighting something you can't see   */
    fallbackKaiju(pt,Math.max(hpx,VH*0.60*gs),fade,b.anim);
  }
  if(b.mode==="beam"&&!b.dead) drawBeam(b);
  if(G.arena&&!b.dead){ drawKaijuArmour(b,pt,hpx); drawArenaBeams(b); }
}
function drawBeam(b){
  var top=project(b.beamX,3.4,player.z+8), bot=project(b.beamX,0.05,player.z+2);
  var src=project(b.x,b.y+b.h*0.72,b.z);

  var w=Math.max(6,2.9*bot.s);
  var g=ctx.createLinearGradient(src.x,src.y,bot.x,bot.y);
  g.addColorStop(0,"rgba(255,255,255,0.95)");
  g.addColorStop(0.5,"rgba(255,120,220,0.75)");
  g.addColorStop(1,"rgba(190,40,255,0.55)");
  ctx.strokeStyle=g; ctx.lineWidth=w*0.5; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(src.x,src.y); ctx.lineTo(bot.x,bot.y); ctx.stroke();
  ctx.globalAlpha=0.30; ctx.lineWidth=w*1.6;
  ctx.beginPath(); ctx.moveTo(src.x,src.y); ctx.lineTo(bot.x,bot.y); ctx.stroke();
  ctx.restore();
  /* ground scorch marker so you can read where it will land */
  ctx.save(); ctx.globalCompositeOperation="screen"; ctx.globalAlpha=0.5;
  ctx.fillStyle="#ff6ad0";

/* ---- THE HIDE AND THE CORE ------------------------------------------------
   The 20-crit fight needs one thing above all else: you have to be able to SEE
   whether the core is open, from 82 m away, in one glance.  Shut, the chest is
   a bank of overlapping plates with a dim seam.  Open, it is an iris of white
   with a hard reticle around it.  Note the geometry is worked in SPRITE space
   (fractions of hpx off the billboard centre), not world space, for the same
   reason pawAnchor() is — projecting a second world height does not land on
   the matching row of pixels.                                             */
/* ctx.ellipse is missing on a few old mobile canvases and the rest of the file
   already guards it, so the arena gets one helper instead of ten guards.   */
function oval(x,y,rx,ry,rot){
  ctx.beginPath();
  if(ctx.ellipse) ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,6.2832);
  else ctx.arc(x,y,Math.abs(rx),0,6.2832);
}
function drawKaijuArmour(b,pt,hpx){
  var open=b.core||0, cx=pt.x, cy=pt.y-hpx*0.10, i;
  var rx=hpx*0.109, ry=hpx*0.085;

  ctx.globalAlpha=0.42*(1-open*0.85);
  ctx.strokeStyle="#7f8ea8"; ctx.lineWidth=Math.max(1.4,hpx*0.010);
  for(i=0;i<5;i++){
    var sp=rx*(1.05+i*0.62), dp=ry*(0.55+i*0.34);
    ctx.beginPath();
    ctx.moveTo(cx-sp,cy-dp*0.5); ctx.lineTo(cx,cy+dp*0.35); ctx.lineTo(cx+sp,cy-dp*0.5);
    ctx.stroke();
  }
  /* the stagger meter, welded to the chest: it fills as your body fire lands,
     so "keep shooting the shell" is legible without reading the HUD        */
  var sf=clamp((b.stagger||0)/STAGGER_MAX,0,1);
  if(sf>0.01 && open<0.5){
    ctx.globalAlpha=0.75; ctx.strokeStyle="#9fb8d8";
    ctx.lineWidth=Math.max(2,hpx*0.014);

  }

    ctx.globalCompositeOperation="screen";
    /* the iris: three counter-rotating rings opening outward */
    for(i=0;i<3;i++){
      ctx.globalAlpha=open*(0.5-i*0.12);
      ctx.strokeStyle=["#fff6c8","#ffb14d","#ff5a1e"][i];
      ctx.lineWidth=Math.max(1.6,hpx*0.012);

    g.addColorStop(0,hexA("#ffffff",0.98*open));
    g.addColorStop(0.35,hexA("#ffd27a",0.80*open));
    g.addColorStop(1,hexA("#ff2a5a",0));
    ctx.globalAlpha=1; ctx.fillStyle=g;
    oval(cx,cy,rx*1.9,ry*1.9,0); ctx.fill();

    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=open*0.9; ctx.strokeStyle="#ffffff";
    ctx.lineWidth=Math.max(1.5,hpx*0.008); ctx.setLineDash([hpx*0.03,hpx*0.03]);
    oval(cx,cy,rx,ry,0); ctx.stroke();

}
/* the live ordnance.  drawBeam() (the lane version) puts its impact at
   player.z+2 and is 2.9 m wide; the arena versions are wider, hotter, and land
   on the RANK, which is where the collision tests read them from.         */
function drawArenaBeams(b){
  var p=player; if(!p) return;
  if(b.mode==="sweep" && b.warn<=0) arenaRay(b,b.beamX,3.1,
      ["rgba(255,255,255,0.95)","rgba(255,120,220,0.80)","rgba(190,40,255,0.5)"],
      "#ff6ad0",1);
  if(b.mode==="lance" && b.warn<=0) arenaRay(b,G.lanceX,1.9,
      ["rgba(255,255,255,0.98)","rgba(255,224,102,0.88)","rgba(255,90,30,0.6)"],
      "#ffe066",1.9);
}
function arenaRay(b,x,half,stops,scorch,pierce){
  var p=player;
  var src=project(b.x,b.y+b.h*0.70,b.z);
  var bot=project(x,0.05,p.z+2);
  var top=project(x,half*2.4,p.z+2);
  if(!src||!bot) return;
  var w=Math.max(7,half*bot.s*0.9);
  ctx.save(); ctx.globalCompositeOperation="screen";
  var g=ctx.createLinearGradient(src.x,src.y,bot.x,bot.y);
  g.addColorStop(0,stops[0]); g.addColorStop(0.5,stops[1]); g.addColorStop(1,stops[2]);
  ctx.strokeStyle=g; ctx.lineCap="round";
  /* three passes: a wide bloom, the body, then a white-hot filament — that
     stack is what makes a 2-D line read as a beam with volume            */
  ctx.globalAlpha=0.26; ctx.lineWidth=w*2.1*pierce;
  ctx.beginPath(); ctx.moveTo(src.x,src.y); ctx.lineTo(bot.x,bot.y); ctx.stroke();
  ctx.globalAlpha=0.72; ctx.lineWidth=w*0.72*pierce;
  ctx.beginPath(); ctx.moveTo(src.x,src.y); ctx.lineTo(bot.x,bot.y); ctx.stroke();
  ctx.globalAlpha=0.95; ctx.lineWidth=Math.max(2,w*0.18);
  ctx.strokeStyle="#ffffff";
  ctx.beginPath(); ctx.moveTo(src.x,src.y); ctx.lineTo(bot.x,bot.y); ctx.stroke();
  /* the vertical curtain, so it is obvious the ray is a wall and not a wire */
  if(top){
    ctx.globalAlpha=0.20; ctx.lineWidth=w*1.3;
    ctx.beginPath(); ctx.moveTo(bot.x,bot.y); ctx.lineTo(top.x,top.y); ctx.stroke();
  }
  /* the scorch where it meets the flagstones */
  ctx.globalAlpha=0.55+0.20*Math.sin(G.t*30); ctx.fillStyle=scorch;
  ctx.beginPath();
  if(ctx.ellipse) ctx.ellipse(bot.x,bot.y,w*1.5,w*0.46,0,0,6.2832);
  else ctx.arc(bot.x,bot.y,w,0,6.2832);
  ctx.fill();
  ctx.restore();
}
/* ---- THE MASONRY YOU HIDE BEHIND ------------------------------------------
   "no cool graphics like a wall he hide behind while the kaiju bombards him"
   — this is that wall.  It is a real object in the sorted draw list, so it
   genuinely paints over Dogelon when he is behind it, it has HP, and it comes
   apart in two stages.  Integrity is shown on the block itself rather than in
   the HUD, because the decision it informs ("is this still worth standing
   behind?") is a decision you make while looking at the block.            */
function drawCover(c){
  var pz=player?player.z:0, fog=arenaFog(c.z,pz);
  if(c.z<pz-7 || fog>0.96) return;
  var P=RUIN_PAL.bone, th=0.62, x=c.x, z=c.z, h=c.h;
  var bl=project(x-c.w,0,z-th), br=project(x+c.w,0,z-th),
      tl=project(x-c.w,h,z-th), tr=project(x+c.w,h,z-th),
      kl=project(x-c.w,h,z+th), kr=project(x+c.w,h,z+th);
  if(!bl||!br||!tl||!tr) return;
  var mine=!!(player&&player.coverId===c.id&&player.cover>0.4);
  ctx.save();
  if(c.shakeT>0){ var j=Math.max(1,bl.s*0.03); ctx.translate(rnd(-j,j),rnd(-j,j)); }
  /* top slab first so the ragged parapet below reveals it */
  ruinQuad(tl,kl,kr,tr,mixHex(P.hi,G.lv.fog,fog*0.7),(1-fog*0.2)*0.9);
  /* front face, graded and coursed */
  var g=ctx.createLinearGradient(0,tl.y,0,bl.y);
  g.addColorStop(0,mixHex(P.mid,G.lv.fog,fog*0.7));
  g.addColorStop(0.7,mixHex(P.lo,G.lv.fog,fog*0.7));
  g.addColorStop(1,mixHex(P.trim,G.lv.fog,fog*0.6));
  ctx.globalAlpha=1-fog*0.15; ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(bl.x,bl.y);
  /* the crown is a ruin: N vertices bitten down by deterministic noise, and
     bitten HARDER the more damage the block has taken                     */
  var n=Math.max(4,Math.round(c.w*4)), i, wear=1-clamp(c.hp/Math.max(1,c.maxHp),0,1);
  for(i=0;i<=n;i++){
    var t=i/n, fx=x-c.w+2*c.w*t;
    var bite=(i===0||i===n)?0.03:(0.04+rnoise(c.seed,i)*0.26)*(1+wear*1.6);
    var vp=project(fx,h*(1-Math.min(0.42,bite)),z-th);
    if(vp) ctx.lineTo(vp.x,vp.y);
  }
  ctx.lineTo(br.x,br.y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=(1-fog)*0.26; ctx.fillStyle=P.trim;
  for(i=1;i<=3;i++){
    var jl=project(x-c.w,h*(i/4),z-th), jr=project(x+c.w,h*(i/4),z-th);
    if(jl&&jr) ctx.fillRect(jl.x,jl.y,Math.max(1,jr.x-jl.x),Math.max(1,bl.s*0.025));
  }
  drawCoverDetail(c,P,bl,br,tl,tr,fog,th);
  drawCoverState(c,bl,tl,tr,fog,mine,wear);
  ctx.restore();
}
/* per-kind flourishes.  Three silhouettes, three readable heights: the pillar
   towers (you vanish behind it), the wall is chest-high (you crouch), the altar
   is waist-high (it only saves you from plunging fire).                    */
function drawCoverDetail(c,P,bl,br,tl,tr,fog,th){
  var x=c.x, z=c.z-th, h=c.h, i, a=(1-fog);
  if(c.rubble<1 && c.kind==="pillar"){
    ctx.globalAlpha=a*0.30; ctx.fillStyle=P.trim;
    for(i=-1;i<=1;i++){
      var fa=project(x+i*c.w*0.42,h*0.94,z), fb=project(x+i*c.w*0.42,0.1,z);
      if(fa&&fb){ ctx.fillRect(fa.x-Math.max(1,fa.s*0.012),fa.y,
                    Math.max(1.5,fa.s*0.024),fb.y-fa.y); }
    }
    var rr=project(x,h*0.66,z);
    if(rr){
      ctx.globalAlpha=a*0.85; ctx.fillStyle=AR_PAL.rune;
      ctx.shadowColor=AR_PAL.rune; ctx.shadowBlur=rr.s*0.02;
      ctx.fillRect(rr.x-rr.s*0.055,rr.y,rr.s*0.11,Math.max(1.5,rr.s*0.014));
      ctx.shadowBlur=0;
    }
  } else if(c.rubble<1 && c.kind==="wall"){
    var sl=project(x-c.w*0.22,h*0.70,z), sr2=project(x+c.w*0.22,h*0.40,z);
    if(sl&&sr2){
      ctx.globalAlpha=a*0.55; ctx.fillStyle="#120a08";
      ctx.fillRect(sl.x,sl.y,Math.max(1.5,sr2.x-sl.x),Math.max(2,sr2.y-sl.y));
    }
  } else if(c.rubble<1){
    var bw=project(x,h,z);
    if(bw){
      var bg=ctx.createRadialGradient(bw.x,bw.y,0,bw.x,bw.y,bw.s*0.075);
      bg.addColorStop(0,"rgba(255,255,240,0.95)");
      bg.addColorStop(0.5,hexA(AR_PAL.ember,0.55));
      bg.addColorStop(1,hexA(AR_PAL.ember,0));
      ctx.globalAlpha=a*(0.75+Math.sin(G.t*4+c.seed)*0.14);
      ctx.fillStyle=bg;
      ctx.beginPath();
      if(ctx.ellipse) ctx.ellipse(bw.x,bw.y,bw.s*0.075,bw.s*0.032,0,0,6.2832);
      ctx.fill();
    }
  }
  if(c.flash>0){
    ctx.globalAlpha=clamp(c.flash*5,0,0.8); ctx.fillStyle="#fff";
    ctx.fillRect(bl.x,tl.y,Math.max(2,br.x-bl.x),Math.max(2,bl.y-tl.y));
  }
  ctx.globalAlpha=1;
}
/* integrity lives ON the block, not in the HUD — the question it answers
   ("is this still worth standing behind?") is one you ask while looking at it */
function drawCoverState(c,bl,tl,tr,fog,mine,wear){
  var w=Math.max(6,tr.x-tl.x), a=1-fog;
  if(wear>0.02 && c.rubble<2){
    var by=tl.y-Math.max(7,bl.s*0.05), bh=Math.max(2.5,bl.s*0.016);
    ctx.globalAlpha=a*0.55; ctx.fillStyle="#1b0f0c";
    ctx.fillRect(tl.x,by,w,bh);
    ctx.globalAlpha=a*0.95;
    ctx.fillStyle=wear>0.72?"#ff5a3c":(wear>0.4?"#ffb14d":"#9fe870");
    ctx.fillRect(tl.x,by,w*(1-wear),bh);
  }
  if(mine){
    ctx.globalAlpha=0.55+Math.sin(G.t*7)*0.18;
    ctx.strokeStyle=AR_PAL.rune; ctx.lineWidth=Math.max(1.5,bl.s*0.008);
    ctx.strokeRect(tl.x-2,tl.y-2,w+4,Math.max(4,bl.y-tl.y)+4);
    var lean=player?player.peek:0;
    txt((Math.abs(lean)>0.45?"LEANING OUT — FIRING":"IN COVER"),
        (tl.x+tr.x)*0.5, tl.y-Math.max(13,bl.s*0.075),
        Math.max(11,bl.s*0.038), Math.abs(lean)>0.45?"#fff2a0":AR_PAL.rune,
        "center", "700");
  }
  ctx.globalAlpha=1;

/* ARENA_DRAW_D */
/* ---- DOGELON, with X-RAY so he never hides a threat -------------- */
function screenBox(x,y,z,w,h){
  var c=project(x,y+h*0.5,z); if(!c) return null;
  return {l:c.x-w*0.5*c.s, r:c.x+w*0.5*c.s, t:c.y-h*0.5*c.s, b:c.y+h*0.5*c.s, c:c};
}
function computeXray(p){
  var pb=screenBox(p.x,p.y,p.z,1.9,p.h); if(!pb) return 0;
  var worst=0;
  for(var i=0;i<ents.length;i++){
    var e=ents[i];
    if(e.dead) continue;
    /* ruins occlude, so they have to be able to trigger the x-ray fade or a
       tower would simply swallow Dogelon for half a second                  */
    if(e.kind==="hazard"&&e.sub!=="rock"&&!e.ruin) continue;
    var dz=e.z-p.z; if(dz<-1||dz>26) continue;
    var eb=screenBox(e.x,e.y,e.z,e.r*1.9,e.h); if(!eb) continue;
    if(eb.r<pb.l||eb.l>pb.r||eb.b<pb.t||eb.t>pb.b) continue;
    worst=Math.max(worst, clamp(1-(dz/26),0.35,1));
  }
  for(var j=0;j<ebullets.length;j++){
    var q=ebullets[j], dz2=q.z-p.z;
    if(dz2<0||dz2>16) continue;
    if(Math.abs(q.x-p.x)<2.2) worst=Math.max(worst,0.8);
  }
  return worst;
}
function drawPlayer(p){
  /* In the rover, the silhouette is two sprites stacked: the chassis from the
     ground up, Dogelon sitting in the cockpit.  Both are projected from real
     world Y so the perspective, the shadow and the muzzle stay consistent. */
  var riding = p.riding && !p.dead;
  var bodyH  = riding ? RIDER_H : p.h;
  var baseY  = riding ? (p.y + ROVER_H*0.86) : p.y;
  var pt=project(p.x, baseY + bodyH*0.5, p.z); if(!pt) return;
  var hpx=bodyH*pt.s;
  p.xrayed=lerp(p.xrayed, computeXray(p), 0.28);
  var alpha=lerp(1,0.30,p.xrayed);
  if(p.inv>0 && Math.floor(G.t*18)%2===0) alpha*=0.42;
  if(p.spawnT>0) alpha*=clamp(1-p.spawnT,0.15,1);
  var rot=p.tilt*0.11 - (p.sliding>0?0.10:0) - (riding?p.ram*0.13:0);
  /* Vertical squash.  On foot this stays 1 — the slide already shortens p.h,
     so squashing again would double-count.  In the rover the rider is shaken
     by the suspension, so this reads the SAME clock drawMount() uses
     (G.t*13); if they drift apart the rider visibly beats against the seat. */
  var sy = riding ? (1 - Math.sin(G.t*13)*0.035) : 1;
  /* ---- JET: the ship replaces the on-foot silhouette entirely ----------
     Cross-faded on the way down (jetDown runs JET_FALL -> 0) so the landing
     reads as the ship setting him back on the sand instead of a pop-swap. */
  var jetA = (p.jet>0) ? 1 : (p.jetDown>0 ? clamp(p.jetDown/JET_FALL,0,1) : 0);
  if(jetA>0 && !p.dead){
    drawJet(p,pt,alpha*jetA);
    if(jetA>0.995){
      if(p.shield>0) drawShield(pt,hpx,p);
      drawMuzzle(p,hpx);
      return;
    }
    alpha *= (1-jetA);            /* Dogelon fades in underneath the ship */
  }
  if(riding) drawMount(p,alpha);
  /* SHEET CHOICE — this is what makes the weapon visible.  The old code drew
     Dogelon_backwalk for every living frame; that sheet reads as an empty pair
     of hands from behind, so firing looked like nothing happened.  The chase
     camera sits behind Dogelon, so the *base* pose has to stay the back view —
     swapping to a side-on sheet mid-run would look wrong.  Instead the firing
     pose is a separate, switchable sheet (G cycles it) and a procedural
     blaster is drawn whenever the chosen sheet has no gun of its own.      */
  var sheet, idx;
  var firing = p.shootT>0;
  if(p.dead){ sheet="dead"; idx=liveFrame("dead", 5+Math.floor(p.deadT*7)); }
  else if(firing && sheetReady(POSES[G.poseIdx]) && POSES[G.poseIdx]!=="backwalk"){
    sheet=POSES[G.poseIdx];
    /* two-frame recoil cycle keyed to the shot, not a free-running timer */
    idx=liveFrame(sheet, (p.muzzle>MUZZLE_T*0.45)?0:1);
  }
  else if(p.sliding>0 && sheetReady("slide")){ sheet="slide"; idx=liveFrame("slide",1); }
  else if(p.sliding>0){ sheet="backwalk"; idx=liveFrame("backwalk",1); }
  else if(riding){
    /* seated: no leg cycle.  A walk loop in a driver's seat looks broken, so
       the rider holds one frame and the chassis supplies all the motion.   */
    if(sheetReady("stand")){ sheet="stand"; idx=liveFrame("stand",0); }
    else { sheet="backwalk"; idx=liveFrame("backwalk",0); }
  }
  else { sheet="backwalk"; idx=liveFrame("backwalk", Math.floor(p.bob*0.55)%4); }
  /* THE ACTUAL REASON YOU SAW NO GUN.  This used to read
        var sheetHasGun = (sheet==="blast"||sheet==="walk"||sheet==="run");
        if(!p.dead && !sheetHasGun) drawBlaster(...)
     and the running pose is "walk"/"run" for essentially every living frame,
     so the procedural blaster was suppressed almost 100% of the time on the
     assumption that the art already carried a weapon.  It does not.  The
     blaster is now unconditional: the only things that hide it are death,
     the jet cockpit, and dropping the plough blade (both paws on the wheel). */
  var showGun = !p.dead && !(p.jet>0) && gunOut(p);
  /* soft shadow-halo so his silhouette separates from the ground.  In the
     rover, drawMount() has already laid one down under the chassis.        */
  if(!riding){
    ctx.save(); ctx.globalAlpha=0.20*alpha;
    var hg=ctx.createRadialGradient(pt.x,pt.y,hpx*0.1,pt.x,pt.y,hpx*0.75);
    hg.addColorStop(0,"rgba(0,0,0,0.6)"); hg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(pt.x,pt.y,hpx*0.75,0,6.283); ctx.fill();
    ctx.restore();
  }
  var ok;
  /* recoil kick: the sprite snaps back toward the camera and down a touch on
     every shot.  Even with no gun in the art, this reads as "he just fired". */
  var kick = (p.recoil>0) ? (p.recoil/0.12) : 0;
  var kx = pt.x - kick*hpx*0.020, ky = pt.y + kick*hpx*0.026;
  if(p.hurtT>0)
    ok=drawFrameTint(sheet,idx,kx,ky,hpx,"#ff2a2a",0.75,
        {alpha:alpha,rot:rot,sy:sy});
  else
    ok=drawFrame(sheet,idx,kx,ky,hpx,{alpha:alpha,rot:rot,sy:sy});
  if(!ok) fallbackDog(pt,hpx,alpha);
  /* the blaster itself, drawn in world space at the muzzle — the guarantee
     that Dogelon looks armed no matter what the sprite sheets contain      */
  if(showGun) drawBlaster(p,pt,hpx,alpha);
  /* rim light: keeps him legible while faded out */
  if(p.xrayed>0.05)
    drawFrameTint(sheet,idx,kx,ky,hpx*1.045,
      G.lv.rail,1,{alpha:0.30*p.xrayed,rot:rot,additive:true,sy:sy});
  if(p.shield>0) drawShield(pt,hpx,p);
  drawMuzzle(p,hpx);
}
/* ---- the mount (ROVER RUN) ---------------------------------------------
   Drawn before the rider so Dogelon layers on top.  The ride is a vertical
   suspension bob plus a small counter-rotation; with the blade down the whole
   chassis pitches forward and the plough lights up so the crush box is
   readable.  Same structure the retired mount used — only the sheet, the
   constants and the effects changed.                                      */
function drawMount(p,alpha){
  var bp=project(p.x, p.y+ROVER_H*0.5, p.z-0.22); if(!bp) return;
  /* Wheel spin and suspension are driven off the wall clock: (G.t*6.5)%4 is
     1.625 four-frame cycles a second and the vertical travel runs at
     13 rad/s.  One knock-on worth knowing is that G.t advances on raw dt, so
     the suspension does not slow down during slow-mo.                     */
  var stridePhase = (G.t * 6.5) % 4;
  var bob = Math.sin(G.t * 13) * 0.038;
  var bh = ROVER_H*bp.s*(1+bob);
  var lean = p.ram*0.16 + p.tilt*0.05;
  /* contact shadow under the wheels — wider and flatter than a footprint   */
  var gp=project(p.x,0,p.z-0.22);
  if(gp){
    ctx.save(); ctx.globalAlpha=0.34*alpha;
    var sg=ctx.createRadialGradient(gp.x,gp.y,2,gp.x,gp.y,bh*0.60);
    sg.addColorStop(0,"rgba(0,0,0,0.72)"); sg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=sg; ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(gp.x,gp.y,bh*0.60,bh*0.16,0,0,6.283);
    else ctx.arc(gp.x,gp.y,bh*0.30,0,6.283);
    ctx.fill();
    ctx.restore();
  }
  var by = bp.y - bob*bh*0.35;
  var fr = Math.floor(stridePhase)%4;
  if(!sheetReady("rover")){
    /* mandatory, not a last resort: no sheet means an ANIMATED stand-in,
       never a static PNG and never an invisible vehicle                   */
    fallbackRover(bp.x, by, bh, alpha, stridePhase);
  } else {
    var ok;
    if(p.ram>0.35){
      /* blade down uses the second row (4-7); if those cells come back
         blank the first row is reused, pitched -0.18 rad so the charge
         still reads as a charge                                          */
      ok = drawFrame("rover", liveFrame("rover",4+fr), bp.x, by, bh,
                     {alpha:alpha, rot:lean});
      if(!ok) ok = drawFrame("rover", liveFrame("rover",fr), bp.x, by, bh,
                     {alpha:alpha, rot:lean-0.18});
    } else {
      ok = drawFrame("rover", liveFrame("rover",fr), bp.x, by, bh,
                     {alpha:alpha, rot:lean});
    }
    if(!ok) fallbackRover(bp.x, by, bh, alpha, stridePhase);
  }
  /* the plough blade: the visual promise that hitting things is now good.
     It sits LOW and FORWARD (down-screen and slightly right), level with the
     ground the blade actually scrapes, not up at rider height.            */
  var glow = 0.22 + p.ram*0.78;
  ctx.save();
  ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=clamp(glow*alpha,0,1);
  var hx=bp.x+bh*0.16, hy=by+bh*0.34;
  var hgd=ctx.createRadialGradient(hx,hy,1,hx,hy,bh*(0.22+p.ram*0.22));
  hgd.addColorStop(0,"#fff6cc"); hgd.addColorStop(0.45,"#ffcf4a");
  hgd.addColorStop(1,"rgba(255,140,20,0)");
  ctx.fillStyle=hgd; ctx.beginPath();
  ctx.arc(hx,hy,bh*(0.22+p.ram*0.22),0,6.283); ctx.fill();
  ctx.restore();
}
/* If the rover sheet is missing or mis-sliced, draw an unmistakable six-wheel
   rover instead — the bonus stage must never render an invisible vehicle.
   ctx.ellipse is feature-detected and degrades to a circle rather than
   throwing, because this is precisely the path that has to not fail.
   `ph` is the caller's stride phase, so the wheels obey slow-motion and pause
   instead of running off the wall clock.                                  */
function fallbackRover(x,y,h,alpha,ph){
  var w=h*1.45, ell=!!ctx.ellipse;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(x,y);
  /* plough blade, forward and low — the silhouette cue for the whole ride  */
  ctx.fillStyle="#b9c4cf"; ctx.strokeStyle="#2a3240";
  ctx.lineWidth=Math.max(1,h*0.03);
  ctx.beginPath();
  ctx.moveTo(w*0.30,h*0.16); ctx.lineTo(w*0.58,h*0.02);
  ctx.lineTo(w*0.60,h*0.34); ctx.lineTo(w*0.30,h*0.40);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* chassis */
  ctx.fillStyle="#8d6a4a"; ctx.strokeStyle="#3a2a1c";
  ctx.beginPath();
  ctx.moveTo(-w*0.42,h*0.06); ctx.lineTo(-w*0.36,-h*0.16);
  ctx.lineTo( w*0.30,-h*0.20); ctx.lineTo( w*0.36,h*0.10);
  ctx.lineTo(-w*0.40,h*0.20); ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* pressure dome over the cockpit */
  ctx.fillStyle="rgba(150,225,255,0.42)"; ctx.strokeStyle="#cfe8ff";
  ctx.lineWidth=Math.max(1,h*0.025);
  ctx.beginPath();
  if(ell) ctx.ellipse(0,-h*0.26,w*0.20,h*0.20,0,Math.PI,6.283);
  else ctx.arc(0,-h*0.26,h*0.20,Math.PI,6.283);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* six wheels, three visible per side, spun off the caller's phase        */
  var sp=(ph||0)*1.9;
  ctx.strokeStyle="#1a1d24"; ctx.fillStyle="#22262f";
  for(var i=0;i<3;i++){
    var wx=(-0.30+i*0.30)*w, wr=h*0.19;
    ctx.beginPath(); ctx.arc(wx,h*0.30,wr,0,6.283); ctx.fill();
    ctx.lineWidth=Math.max(1,h*0.022); ctx.strokeStyle="#6f7c8c";
    ctx.beginPath();
    ctx.moveTo(wx-Math.cos(sp+i)*wr*0.72, h*0.30-Math.sin(sp+i)*wr*0.72);
    ctx.lineTo(wx+Math.cos(sp+i)*wr*0.72, h*0.30+Math.sin(sp+i)*wr*0.72);
    ctx.stroke();
  }
  /* solar panel / roll bar so the profile is not a featureless lump        */
  ctx.strokeStyle="#ffcf4a"; ctx.lineWidth=Math.max(1.2,h*0.035);
  ctx.beginPath();
  ctx.moveTo(-w*0.36,-h*0.20); ctx.lineTo(-w*0.44,-h*0.42);
  ctx.lineTo(-w*0.06,-h*0.46);
  ctx.stroke();
  ctx.restore();
}
/* ---- Dogelon's blaster ------------------------------------------------
   Now modelled on the actual pixel art instead of a two-tone line: a red
   L-frame with the grip in the paw, a raised red hammer fin over the
   breech, a yellow flame flare down the middle, a white-hot emitter bulb,
   then a needle spike with a red bead on the very tip.  Black keyline all
   the way round so the silhouette still reads at 20 pixels.

   Why it is laid out in a rotated SCREEN frame rather than from two
   projected 3D points: in a chase view the barrel points away from the
   camera, so a true projection foreshortens the entire weapon into a
   three-pixel stub — which is exactly what the old straight line was.
   The grip anchor is still projected from the world hand position, so it
   tracks the sprite, the slide and the mount as 1B requires; only the
   barrel's 15-degree nose-up run is resolved in screen space.            */
var BL = { line:"#0b0b10", red:"#ee1420", redDark:"#a50d16",
           gold:"#ffd400", bulb:"#ffffff", bead:"#ff2a2a",
           fur:"#e8b84a", furLo:"#b7862a", furHi:"#ffd980" };
/* One shared frame so the gun, the paw, the emitter glow and the muzzle flash
   can never drift apart.  Returns the paw anchor, the barrel angle, the gun
   length in px, the sprite centre (for the forearm) and the screen position of
   the emitter bulb.

   THE FIX FOR "IT IS STRAPPED TO HIS CHEST".  Three things were wrong and all
   three are addressed here:
     1. the anchor came from project()ing a world point 0.85 m behind him, which
        the perspective divide lifted to chest height — it now comes from
        pawAnchor(), which is pinned to the drawn sprite;
     2. oy was -0.20 while the grip is authored at +0.26, so the whole weapon
        floated a tenth of a gun-length clear of the anchor;
     3. nothing was ever drawn CONNECTING the gun to him.  A gun with no arm
        behind it reads as a prop stuck to the torso no matter where you put
        it, so drawBlaster() now lays down a forearm and a paw, and closes two
        fingers over the grip after the gun is drawn.                       */
function blasterFrame(p,hpx){
  var g=pawAnchor(p,hpx);
  if(!g) return null;
  var u=Math.max(11,(g.hpx||hpx)*0.42);     /* overall gun length, px */
  var kick=(p.recoil>0)?(p.recoil/0.12):0;  /* same clock as the sprite kick */
  var ang=-0.2618 + clamp(p.tilt,-1,1)*0.10 - kick*0.16;
  /* art is authored around the bulb at local (0,0) and the paw closes on the
     grip at local (-0.49,+0.26), so after rotating we shift by exactly that   */
  var ox=0.49-kick*0.10, oy=-0.26;
  /* drawPlayer() offsets the SPRITE by this much on every shot, so the arm has
     to move with it or the shoulder tears away from the body for 0.12 s.    */
  var hp=(g.hpx||hpx);
  var kdx=-kick*hp*0.020, kdy=kick*hp*0.026;
  var gx=g.x+kdx, gy=g.y+kdy;
  return { gx:gx, gy:gy, s:g.s, ang:ang, u:u, ox:ox, oy:oy, kick:kick,
    cx:g.cx+kdx, cy:g.cy+kdy, hpx:hp,
    ex:gx + Math.cos(ang)*u*ox - Math.sin(ang)*u*oy,
    ey:gy + Math.sin(ang)*u*ox + Math.cos(ang)*u*oy };
}
/* black-keyline polygon helper: stroke first, fill second, so the fill
   eats the inner half of the line and the outline stays one pixel crisp */
function glPoly(pts,fill,ow){
  ctx.beginPath();
  ctx.moveTo(pts[0],pts[1]);
  for(var i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();
  if(ow>0){ ctx.strokeStyle=BL.line; ctx.lineWidth=ow; ctx.stroke(); }
  ctx.fillStyle=fill; ctx.fill();
}
/* The arm.  Drawn in plain screen space (not the gun's rotated frame) because
   it has to run from a point on the SPRITE to the paw, and those two live in
   different frames.  Palm and forearm go down before the weapon; two fingers
   close over the grip afterwards, which is the whole trick — that overlap is
   what your eye reads as "holding".                                       */
function drawGunArm(F,alpha,fingersOnly){
  var hp=F.hpx, r=Math.max(2,hp*0.072);
  /* shoulder on the sprite: right side, a little above centre            */
  var sx=F.cx + hp*0.085, sy=F.cy - hp*0.150;
  ctx.globalAlpha=alpha;
  if(!fingersOnly){
    /* tapered forearm, keylined so it reads against both his body and the sky */
    var dx=F.gx-sx, dy=F.gy-sy, L=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    var nx=-dy/L, ny=dx/L, w0=hp*0.062, w1=hp*0.044;
    ctx.beginPath();
    ctx.moveTo(sx+nx*w0, sy+ny*w0);
    ctx.lineTo(F.gx+nx*w1, F.gy+ny*w1);
    ctx.lineTo(F.gx-nx*w1, F.gy-ny*w1);
    ctx.lineTo(sx-nx*w0, sy-ny*w0);
    ctx.closePath();
    ctx.strokeStyle=BL.line; ctx.lineWidth=Math.max(1,hp*0.016); ctx.stroke();
    ctx.fillStyle=BL.furLo; ctx.fill();
    /* top-lit edge along the forearm                                       */
    ctx.globalAlpha=alpha*0.85;
    ctx.beginPath();
    ctx.moveTo(sx+nx*w0*0.55, sy+ny*w0*0.55);
    ctx.lineTo(F.gx+nx*w1*0.55, F.gy+ny*w1*0.55);
    ctx.lineTo(F.gx+nx*w1*0.05, F.gy+ny*w1*0.05);
    ctx.lineTo(sx+nx*w0*0.05, sy+ny*w0*0.05);
    ctx.closePath(); ctx.fillStyle=BL.fur; ctx.fill();
    /* palm behind the grip                                                 */
    ctx.globalAlpha=alpha;
    ctx.beginPath(); ctx.arc(F.gx,F.gy,r,0,6.283);
    ctx.strokeStyle=BL.line; ctx.lineWidth=Math.max(1,hp*0.016); ctx.stroke();
    ctx.fillStyle=BL.fur; ctx.fill();
    return;
  }
  /* fingers, OVER the grip: two knuckle bumps plus a thumb across the front */
  ctx.globalAlpha=alpha;
  var ca=Math.cos(F.ang), sa=Math.sin(F.ang);
  for(var i=0;i<2;i++){
    var lx=-F.u*0.02 + i*F.u*0.075, ly=F.u*0.055;
    var fx=F.gx + ca*lx - sa*ly, fy=F.gy + sa*lx + ca*ly;
    ctx.beginPath(); ctx.arc(fx,fy,r*0.44,0,6.283);
    ctx.strokeStyle=BL.line; ctx.lineWidth=Math.max(1,hp*0.014); ctx.stroke();
    ctx.fillStyle=i?BL.furLo:BL.fur; ctx.fill();
  }
  var tx=F.gx + ca*(F.u*0.045) - sa*(-F.u*0.045),
      ty=F.gy + sa*(F.u*0.045) + ca*(-F.u*0.045);
  ctx.beginPath(); ctx.arc(tx,ty,r*0.38,0,6.283);
  ctx.strokeStyle=BL.line; ctx.lineWidth=Math.max(1,hp*0.014); ctx.stroke();
  ctx.fillStyle=BL.furHi; ctx.fill();
}
function drawBlaster(p,pt,hpx,alpha){
  if(!gunOut(p)) return;                    /* stowed while ploughing */
  var F=blasterFrame(p,hpx); if(!F) return;
  var u=F.u, ow=Math.max(1,u*0.055);
  ctx.save();
  ctx.lineJoin="miter";
  drawGunArm(F,alpha,false);                /* forearm + palm, behind the gun */
  ctx.globalAlpha=alpha;
  ctx.translate(F.gx,F.gy);
  ctx.rotate(F.ang);
  ctx.translate(u*F.ox,u*F.oy);
  /* 1. needle spike, drawn first so the bulb overlaps its root */
  glPoly([u*0.10,-u*0.020, u*0.30,-u*0.014, u*0.30,u*0.014, u*0.10,u*0.020],
         BL.line,0);
  ctx.beginPath(); ctx.arc(u*0.325,0,Math.max(1,u*0.042),0,6.283);
  ctx.fillStyle=BL.bead; ctx.fill();
  /* 2. hammer fin, leaning up and back over the breech */
  glPoly([-u*0.520,-u*0.100, -u*0.400,-u*0.110,
          -u*0.545,-u*0.440, -u*0.665,-u*0.420], BL.red,ow);
  /* 3. grip, sitting in the paw */
  glPoly([-u*0.575,u*0.100, -u*0.375,u*0.100,
          -u*0.415,u*0.520, -u*0.635,u*0.500], BL.red,ow);
  /* 4. body last of the red, so it caps the fin and grip joints */
  glPoly([-u*0.620,-u*0.115, -u*0.050,-u*0.125,
          -u*0.020, u*0.130, -u*0.620, u*0.150], BL.red,ow);
  ctx.fillStyle=BL.redDark;                 /* underside shade = volume */
  ctx.fillRect(-u*0.60,u*0.085,u*0.57,u*0.045);
  if(u>26){ ctx.fillStyle=BL.line;          /* trigger guard, if it'll show */
    ctx.fillRect(-u*0.515,u*0.185,u*0.115,u*0.145); }
  /* 5. yellow flare down the barrel */
  glPoly([-u*0.400,0, -u*0.200,-u*0.100, 0,-u*0.110, u*0.020,0,
          0,u*0.110, -u*0.200,u*0.120], BL.gold,0);
  /* 6. emitter bulb */
  ctx.beginPath(); ctx.arc(0,0,u*0.115,0,6.283);
  ctx.strokeStyle=BL.line; ctx.lineWidth=ow; ctx.stroke();
  ctx.fillStyle=BL.bulb; ctx.fill();
  /* 7. heat / shot glow — identical formula and clock to before */
  var glow=clamp(0.30+p.heat*0.55+(p.muzzle>0?0.9:0),0,1.6);
  ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=alpha*Math.min(1,glow);
  ctx.fillStyle=(p.quad>0?"#cc7dff":"#ffce6a");
  ctx.beginPath(); ctx.arc(0,0,u*0.115*(1+glow*0.85),0,6.283); ctx.fill();
  ctx.restore();
  /* 8. fingers LAST, so they overlap the grip.  This single overlap is what
     turns "gun floating near Dogelon" into "Dogelon holding a gun".      */
  ctx.save(); drawGunArm(F,alpha,true); ctx.restore();
}
/* ---- procedural Dogelon Jet -------------------------------------------
   Needed far more often than the other fallbacks: Dogelon_Ship.png ships on
   an opaque white background, and if getImageData is blocked (opening the
   file straight off the disk with file://) the white cannot be keyed out, so
   jetReady() returns false and THIS is what flies.  Rear three-quarter view
   to match the chase camera: swept wings, a red fuselage with a gold spine,
   a glass canopy with Dogelon inside it, and twin nozzles.               */
function fallbackJet(cx,cy,u,alpha,roll,bank){
  var ell=!!ctx.ellipse, ow=Math.max(1,u*0.030);
  var flick=0.72+Math.sin(G.t*38)*0.16+Math.sin(G.t*61)*0.10;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  ctx.rotate(roll||0);
  ctx.scale(1-Math.abs(bank||0)*0.12, 1);      /* fake yaw into the turn */
  ctx.lineJoin="miter";
  /* 1. engine plumes first, so the hull caps them */
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(var s=-1;s<=1;s+=2){
    var ex=s*u*0.21, ey=u*0.34, len=u*(0.55+0.28*flick);
    var g=ctx.createLinearGradient(ex,ey,ex,ey+len);
    g.addColorStop(0,"rgba(255,246,214,0.95)");
    g.addColorStop(0.35,"rgba(255,160,50,0.70)");
    g.addColorStop(1,"rgba(255,60,20,0)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(ex-u*0.085,ey); ctx.lineTo(ex+u*0.085,ey);
    ctx.lineTo(ex+u*0.030,ey+len); ctx.lineTo(ex-u*0.030,ey+len);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* 2. swept wing plank */
  glPoly([-u*0.95,u*0.10, -u*0.30,-u*0.06, u*0.30,-u*0.06, u*0.95,u*0.10,
          u*0.34,u*0.24, -u*0.34,u*0.24], "#d8202e", ow);
  ctx.fillStyle="#ffc518";                     /* wing-tip flashes */
  ctx.fillRect(-u*0.95,u*0.055,u*0.20,u*0.075);
  ctx.fillRect( u*0.75,u*0.055,u*0.20,u*0.075);
  /* 3. tail fin */
  glPoly([-u*0.06,-u*0.36, u*0.06,-u*0.36, 0,-u*0.60], "#a50d16", ow);
  /* 4. fuselage */
  glPoly([-u*0.21,-u*0.40, u*0.21,-u*0.40, u*0.25,u*0.30,
          u*0.14,u*0.40, -u*0.14,u*0.40, -u*0.25,u*0.30], "#ee1420", ow);
  ctx.fillStyle="#ffd400";                     /* gold spine */
  ctx.fillRect(-u*0.045,-u*0.34,u*0.09,u*0.66);
  /* 5. nozzles */
  ctx.fillStyle="#22242e";
  ctx.fillRect(-u*0.30,u*0.24,u*0.18,u*0.12);
  ctx.fillRect( u*0.12,u*0.24,u*0.18,u*0.12);
  /* 6. canopy + the dog inside it */
  ctx.save();
  ctx.beginPath();
  if(ell) ctx.ellipse(0,-u*0.19,u*0.175,u*0.145,0,0,6.283);
  else ctx.arc(0,-u*0.19,u*0.16,0,6.283);
  ctx.strokeStyle=BL.line; ctx.lineWidth=ow; ctx.stroke();
  ctx.fillStyle="#9fd8f5"; ctx.fill();
  ctx.clip();
  ctx.fillStyle="#e8c88a";                     /* head */
  ctx.beginPath(); ctx.arc(0,-u*0.165,u*0.085,0,6.283); ctx.fill();
  ctx.fillStyle="#6b4a22";                     /* hair */
  ctx.beginPath(); ctx.arc(0,-u*0.215,u*0.072,3.34,6.08); ctx.fill();
  ctx.fillStyle="#1a1a22";                     /* eyes */
  ctx.beginPath(); ctx.arc(-u*0.032,-u*0.170,u*0.017,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc( u*0.032,-u*0.170,u*0.017,0,6.283); ctx.fill();
  ctx.restore();
  ctx.save();                                  /* glass highlight */
  ctx.globalCompositeOperation="screen"; ctx.globalAlpha=alpha*0.5;
  ctx.fillStyle="#ffffff";
  ctx.beginPath(); ctx.arc(-u*0.075,-u*0.245,u*0.045,0,6.283); ctx.fill();
  ctx.restore();
  ctx.restore();
}
/* ---- the jet in flight -------------------------------------------------
   Bank sets are read off a SMOOTHED p.jetBank rather than raw vx: feathering
   left/right at 60 Hz on the raw value flips between the three sets every
   frame and the ship strobes.  liveFrame() maps through the non-empty list,
   so the partial last row of a 4x5 sheet can never yield a blank cell.   */
function drawJet(p,pt,alpha){
  var u=p.h*pt.s*1.45;
  var b=p.jetBank||0;
  var set=(b<-0.30)?4:(b>0.30)?8:0;
  var fr=Math.floor(G.t*10)%4;
  var roll=b*0.22+Math.sin(G.t*1.7)*0.022;
  var ok=false;
  if(jetReady())
    ok=drawFrame("jet", liveFrame("jet", set+fr), pt.x, pt.y, u,
                 {alpha:alpha, rot:roll});
  if(!ok) fallbackJet(pt.x,pt.y,u,alpha,roll,b);
  /* altitude tell: a ground shadow that shrinks as he climbs, so you can
     always read how high the ship actually is                            */
  var gp=project(p.x,0,p.z);
  if(gp){
    var k=clamp(1-p.y/JET_Y,0,1);
    ctx.save(); ctx.globalAlpha=alpha*(0.10+0.20*k);
    ctx.fillStyle="#000";
    ctx.beginPath();
    var rw=u*(0.28+0.22*k), rh=rw*0.34;
    if(ctx.ellipse) ctx.ellipse(gp.x,gp.y,rw,rh,0,0,6.283);
    else ctx.arc(gp.x,gp.y,rh,0,6.283);
    ctx.fill(); ctx.restore();
  }
}
function fallbackDog(pt,hpx,alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  var w=hpx*0.42;
  ctx.fillStyle="#e8b84a"; ctx.fillRect(pt.x-w*0.5,pt.y-hpx*0.5,w,hpx*0.42);
  ctx.fillStyle="#1e3050"; ctx.fillRect(pt.x-w*0.55,pt.y-hpx*0.08,w*1.1,hpx*0.34);
  ctx.fillStyle="#fff"; ctx.fillRect(pt.x-w*0.4,pt.y+hpx*0.30,w*0.3,hpx*0.18);
  ctx.fillRect(pt.x+w*0.1,pt.y+hpx*0.30,w*0.3,hpx*0.18);
  ctx.restore();
}
function drawShield(pt,hpx,p){
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=0.28+0.16*Math.sin(G.t*8);
  ctx.strokeStyle="#7dd8ff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(pt.x,pt.y,hpx*0.62,0,6.283); ctx.stroke();
  ctx.globalAlpha=0.10; ctx.fillStyle="#7dd8ff";
  ctx.beginPath(); ctx.arc(pt.x,pt.y,hpx*0.62,0,6.283); ctx.fill();
  ctx.restore();
}
function drawMuzzle(p,hpx){
  if(p.muzzle<=0) return;
  var m=muzzlePos(p), pt=project(m.x,m.y,m.z); if(!pt) return;
  /* the flash belongs on the emitter bulb, which sits forward of the paw
     that muzzlePos() anchors — blasterFrame() hands back exactly that   */
  var F=(hpx&&gunOut(p)&&!(p.jet>0))?blasterFrame(p,hpx):null;
  var fx=F?F.ex:pt.x, fy=F?F.ey:pt.y;
  var k=p.muzzle/MUZZLE_T, r=Math.max(5,0.62*pt.s*(0.6+k));
  ctx.save(); ctx.globalCompositeOperation="screen"; ctx.globalAlpha=k;
  var g=ctx.createRadialGradient(fx,fy,r*0.1,fx,fy,r*2.2);
  g.addColorStop(0,"#ffffff"); g.addColorStop(0.25,"#ffd27a");
  g.addColorStop(0.6,"rgba(255,120,40,0.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx,fy,r*2.2,0,6.283); ctx.fill();
  ctx.strokeStyle="#fff6d0"; ctx.lineWidth=Math.max(1,r*0.20);
  ctx.beginPath();
  for(var i=0;i<4;i++){
    var a=i*0.785+G.t*3, L=r*(1.5+0.6*Math.sin(i*2+G.t*20));
    ctx.moveTo(fx,fy); ctx.lineTo(fx+Math.cos(a)*L,fy+Math.sin(a)*L);
  }
  ctx.stroke(); ctx.restore();
}
/* ---- floating damage / score numbers ---------------------------- */
function renderPops(){
  ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
  for(var i=0;i<pops.length;i++){
    var o=pops[i], pt=project(o.x,o.y,o.z); if(!pt) continue;
    var k=o.t/o.T, sz=Math.max(9,o.sz*clamp(pt.s/70,0.5,1.6));
    ctx.globalAlpha=clamp(k*1.4,0,1);
    ctx.font="bold "+sz.toFixed(0)+"px Verdana,sans-serif";
    ctx.lineWidth=Math.max(2,sz*0.18); ctx.strokeStyle="rgba(0,0,0,0.8)";
    ctx.strokeText(o.txt,pt.x,pt.y); ctx.fillStyle=o.col;
    ctx.fillText(o.txt,pt.x,pt.y);
  }
  ctx.restore();
}
/* ---- THREAT RADAR + corridor reticle: read the road at a glance -- */
function renderRadar(){
  var p=player; if(!p) return;
  var x0=VW*0.16, x1=VW*0.84, y=16, h=26;
  ctx.save();
  ctx.globalAlpha=0.55; ctx.fillStyle="rgba(8,4,10,0.75)";
  roundRect(x0-8,y-8,(x1-x0)+16,h+16,8); ctx.fill();
  ctx.globalAlpha=0.35; ctx.strokeStyle=G.lv.rail; ctx.lineWidth=1;
  roundRect(x0-8,y-8,(x1-x0)+16,h+16,8); ctx.stroke();
  /* the plaza is 26.8 m wide and 82 m deep, so it needs its own scale — the
     lane grid would put every pillar off the edge of the strip            */
  var HALF=G.arena?AR_HALF:ROAD_HALF, RANGE=G.arena?92:130;
  /* lane guides — or, in the arena, the four ranks you fight from */
  ctx.globalAlpha=0.18;
  if(G.arena){
    for(var R=0;R<AR_LINES.length;R++){
      var ry=y+h-(clamp((rankZ(R)-p.z)/RANGE,0,1))*h;
      ctx.globalAlpha=R===G.line?0.5:0.16;
      ctx.beginPath(); ctx.moveTo(x0,ry); ctx.lineTo(x1,ry); ctx.stroke();
    }
    ctx.globalAlpha=0.18;
    ctx.beginPath(); ctx.moveTo(lerp(x0,x1,0.5),y); ctx.lineTo(lerp(x0,x1,0.5),y+h);
    ctx.stroke();
  } else {
    for(var L=0;L<=LANES;L++){
      var lx=lerp(x0,x1,L/LANES);
      ctx.beginPath(); ctx.moveTo(lx,y); ctx.lineTo(lx,y+h); ctx.stroke();
    }
  }
  /* you */
  var px=lerp(x0,x1,clamp((p.x+HALF)/(HALF*2),0,1));
  ctx.globalAlpha=1; ctx.fillStyle="#ffe6a0";
  ctx.beginPath(); ctx.moveTo(px,y+h); ctx.lineTo(px-5,y+h+7); ctx.lineTo(px+5,y+h+7);
  ctx.closePath(); ctx.fill();
  if(G.arena) renderArenaRadar(x0,x1,y,h,HALF,RANGE);
  /* threats: x = lane, y = distance (near at bottom) */
  for(var i=0;!G.arena&&i<ents.length;i++){
    var e=ents[i]; if(e.dead) continue;
    var dz=e.z-p.z; if(dz<0||dz>130) continue;
    var ex=lerp(x0,x1,clamp((e.x+ROAD_HALF)/(ROAD_HALF*2),0,1));
    var ey=y+h-(dz/130)*h;
    var near=clamp(1-dz/130,0,1);
    ctx.globalAlpha=0.35+near*0.65;
    /* ruins get their own cold blue and a WIDE mark, because unlike a bot they
       are read as geometry to route around rather than a thing to shoot.    */
    var ruin = (e.kind==="hazard" && e.ruin);
    ctx.fillStyle = ruin?"#9fe8ff":
                    e.kind==="hazard"?"#ffb14d":
                    e.kind==="walker"?"#ff9a3a":"#ff4a4a";
    var s=2+near*3.2;
    if(ruin){
      var wpx=Math.max(s,(e.span||e.r)*(x1-x0)/(ROAD_HALF*2));
      ctx.fillRect(ex-wpx,ey-s*0.35,wpx*2,Math.max(1.5,s*0.7));
      continue;
    }
    ctx.fillRect(ex-s/2,ey-s/2,s,s);
  }
  if(boss&&!boss.dead){
    ctx.globalAlpha=1; ctx.fillStyle="#ff4aa0";
    var bx=lerp(x0,x1,clamp((boss.x+HALF)/(HALF*2),0,1));
    ctx.fillRect(bx-5,y-3,10,5);
  }
  ctx.globalAlpha=0.55; ctx.fillStyle="#ffd9a0";
  ctx.font="9px Verdana"; ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText(G.arena?"COLONNADE SCAN":"THREAT SCAN",x0-6,y+h+9);
  ctx.restore();
}
/* the plaza, from above: standing masonry, rubble stubs, the block you are
   actually behind, plunging fire and the live beam column                  */
function renderArenaRadar(x0,x1,y,h,HALF,RANGE){
  var p=player, i, sx=(x1-x0)/(HALF*2);
  for(i=0;i<G.covers.length;i++){
    var c=G.covers[i]; if(c.rubble>=2) continue;
    var dz=c.z-p.z; if(dz<-8||dz>RANGE) continue;
    var cx=lerp(x0,x1,clamp((c.x+HALF)/(HALF*2),0,1)),
        cy=y+h-clamp(dz/RANGE,0,1)*h,
        cw=Math.max(2,c.w*sx), mine=(p.coverId===c.id&&p.cover>0.4);
    ctx.globalAlpha=c.rubble?0.35:0.85;
    ctx.fillStyle=mine?"#ffe066":(c.rubble?"#6b5a44":"#cbb894");
    ctx.fillRect(cx-cw,cy-1.6,cw*2,3.2);
    if(mine){
      ctx.globalAlpha=0.9; ctx.strokeStyle="#ffe066"; ctx.lineWidth=1;
      ctx.strokeRect(cx-cw-2,cy-4,cw*2+4,8);
    }
  }
  for(i=0;i<G.mortars.length;i++){
    var m=G.mortars[i];
    var mx=lerp(x0,x1,clamp((m.x+HALF)/(HALF*2),0,1)),
        my=y+h-clamp((m.z-p.z)/RANGE,0,1)*h;
    ctx.globalAlpha=0.5+0.5*(1-clamp(m.t/m.T,0,1));
    ctx.fillStyle="#ffb14d";
    ctx.beginPath(); ctx.arc(mx,my,2+2.4*(1-clamp(m.t/m.T,0,1)),0,6.283);
    ctx.fill();
  }
  if(boss && !boss.dead && boss.warn<=0){
    var live = boss.mode==="sweep"?boss.beamX:(boss.mode==="lance"?G.lanceX:null);
    if(live!==null){
      var lx2=lerp(x0,x1,clamp((live+HALF)/(HALF*2),0,1));
      ctx.globalAlpha=0.75;
      ctx.fillStyle=boss.mode==="sweep"?"#ff6ad0":"#ffe066";
      ctx.fillRect(lx2-(boss.mode==="sweep"?3.1:1.9)*sx,y,
                   (boss.mode==="sweep"?6.2:3.8)*sx,h);
    }
  }
  ctx.globalAlpha=1;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function renderReticle(){
  var p=player; if(!p||p.dead) return;
  /* the firing corridor, drawn on the road so the restriction is legible
     rather than mysterious: two rails at ±LANE_DAMAGE_HALF running out to
     70 m.  Without this, "why didn't that die" has no visible answer.    */
  var lit=gunOut(p);
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(var side=-1;side<=1;side+=2){
    var a=project(p.x+side*LANE_DAMAGE_HALF,0.02,p.z+3),
        bb=project(p.x+side*LANE_DAMAGE_HALF,0.02,p.z+70);
    if(a&&bb){
      ctx.globalAlpha=(lit?0.26:0.09)+0.05*Math.sin(G.t*3);
      ctx.strokeStyle=lit?"#ffd27a":"#8a94a8"; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(bb.x,bb.y); ctx.stroke();
    }
  }
  ctx.restore();
  if(!lit) return;                    /* holstered: no crosshair either */
  var t=nearestTarget(p,110,LANE_SHOOT_WIDTH);
  /* nearestTarget already refuses anything outside the corridor, but the boss
     is exempt from that test, so nothing else needs a second filter here   */
  var aim=project(t?t.x:p.x, t?t.y+t.h*0.45:1.6, t?t.z:p.z+34);
  if(!aim) return;
  /* a locked target that the bullet can actually kill reads red; the idle
     crosshair stays pale so "no lock" is obvious at a glance              */
  var killable = !!(t && inLane(t,p));
  var r=t?Math.max(9,0.9*aim.s):8;
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=t?0.85:0.30;
  ctx.strokeStyle=killable?"#ff7a5a":(t?"#7dd8ff":"#ffe6a0"); ctx.lineWidth=1.8;
  for(var i=0;i<4;i++){
    var a2=i*1.5708+(t?G.t*1.4:0);
    ctx.beginPath();
    ctx.arc(aim.x,aim.y,r,a2+0.20,a2+1.37);
    ctx.stroke();
  }
  ctx.globalAlpha=t?0.9:0.4;
  ctx.fillRect(aim.x-1,aim.y-1,2,2);
  ctx.restore();
  /* corridor warning: something is dead ahead in your lane */
  var danger=null;
  for(var j=0;j<ents.length;j++){
    var e=ents[j]; if(e.dead||(e.kind==="hazard"&&e.sub==="ice")) continue;
    var dz=e.z-p.z;
    if(dz>2&&dz<34&&Math.abs(e.x-p.x)<2.3){ danger=e; break; }
  }
  if(danger){
    var d=project(p.x,p.y+p.h+1.5,p.z);
    if(d){
      var pulse=0.5+0.5*Math.sin(G.t*14);
      ctx.save(); ctx.globalAlpha=0.55+pulse*0.45;
      ctx.fillStyle= (danger.x>p.x)?"#ffdd55":"#ffdd55";
      ctx.beginPath();
      ctx.moveTo(d.x,d.y-8-pulse*4); ctx.lineTo(d.x-9,d.y-20-pulse*4);
      ctx.lineTo(d.x+9,d.y-20-pulse*4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}
/* ---- post: flash, vignette, grain, chromatic edge --------------- */
function renderPost(){
  if(G.flash>0.002){
    ctx.save(); ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=G.flash; ctx.fillStyle=G.flashCol;
    ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
  var vg=ctx.createRadialGradient(VW*0.5,VH*0.52,VH*0.34,VW*0.5,VH*0.52,VH*0.95);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.62)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.globalAlpha=0.05;
  for(var y=0;y<VH;y+=3){ ctx.fillStyle=(y%6===0)?"#000":"#fff"; ctx.fillRect(0,y,VW,1); }
  ctx.restore();
  if(player&&player.hp<32&&!player.dead){
    ctx.save(); ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=0.10+0.10*Math.sin(G.t*6);
    var rg=ctx.createRadialGradient(VW*0.5,VH*0.5,VH*0.25,VW*0.5,VH*0.5,VH*0.85);
    rg.addColorStop(0,"rgba(0,0,0,0)"); rg.addColorStop(1,"#ff2020");
    ctx.fillStyle=rg; ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
  /* 05 KAIJU: the arena itself breathes red, faster with every boss phase —
     0.8 / 1.4 / 2.2 Hz.  Deliberately independent of the low-HP vignette
     above: both up at once is the intended "this is the last stand" read. */
  if(G.lv&&G.lv.n===5&&boss){
    var kHz=[0.8,1.4,2.2][clamp(((boss.phase|0)-1),0,2)];
    ctx.save(); ctx.globalCompositeOperation="screen";
    ctx.globalAlpha=0.06+0.09*(0.5+0.5*Math.sin(G.t*kHz*Math.PI*2));
    var kg=ctx.createRadialGradient(VW*0.5,VH*0.5,VH*0.22,VW*0.5,VH*0.5,VH*0.92);
    kg.addColorStop(0,"rgba(0,0,0,0)"); kg.addColorStop(1,"#ff1a1a");
    ctx.fillStyle=kg; ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
}

/* ---- ARENA read-out.  It replaces the distance bar, which is meaningless in
   a plaza you no longer run down, and it names the ANSWER to the incoming
   attack rather than the attack — "he's basically incapable of dodging" was
   never a speed problem, it was a legibility problem.                      */
var AR_TELL={
  sweep :["SWEEPING RAY","GET BEHIND COVER","#ff6ad0"],
  mortar:["MORTAR SALVO","KEEP MOVING — COVER WON'T SAVE YOU","#ffb14d"],
  lance :["TRACKING LANCE","RUN — IT BURNS THROUGH STONE","#ffe066"],
  stomp :["SHOCKWAVE","JUMP","#ff8a5a"]
};
function renderArenaHUD(){

    roundRect(x+i*(seg+3),y-12,seg,10,3); ctx.fill();

/* ---- the ordnance rack, bottom-left ------------------------------------
   Each tile is also a tapZone, which is how the finale keeps its promise that
   the touch pad never grows a sixth button: you tap the tile, not a new pad
   key.  Tiles only appear once you own the round or have gold to buy one, so
   a first-time player's HUD is unchanged.                                */
function renderOrdHUD(){
  var p=player; if(!p) return;
  if(!G.bombs && !G.missiles && !G.gold) return;
  var x=24, y=VH-152, w=104, h=44, gap=8, i;
  for(i=0;i<ARMS.length;i++){
    var it=ARMS[i], held=ordHeld(it.id);
    var cd = it.id==="bomb" ? p.throwCd/ORD_THROW_CD : p.lockCd/ORD_LOCK_CD;
    var ty=y+i*(h+gap);
    var live=held>0&&cd<=0;
    ctx.save();
    ctx.globalAlpha=live?0.94:0.5;

      ctx.globalAlpha=0.55; ctx.fillStyle=it.col;

        live?it.col:"#8fa4bd","left");

        (Math.sin(G.t*4)>0?"#ffe6a0":"#8fa4bd"),"left");

function renderBossBar(){
  var b=boss, f=clamp(b.hp/b.maxHp,0,1);
  var x=VW*0.14,w=VW*0.72,y=62;
  panel(x-8,y-20,w+16,G.arena?46:30,0.72);
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.6)"; roundRect(x,y-12,w,14,6); ctx.fill();
  if(G.arena){
    /* 20 pips, one per critical hit — the bar says exactly what the fight
       asks of you, and it cannot drift out of step with G.crits because
       maxHp is defined as KAIJU_CRITS*CORE_DMG                            */
    var gap=3, pw=(w-gap*(KAIJU_CRITS-1))/KAIJU_CRITS, i;
    for(i=0;i<KAIJU_CRITS;i++){
      var px=x+i*(pw+gap), on=i<G.crits, fresh=(i===G.crits-1);
      ctx.fillStyle=on?(fresh?"#fff6c8":(i>=15?"#ffd24a":(i>=10?"#ff7a3a":"#ff2a5a")))
                     :"rgba(255,255,255,0.10)";
      ctx.globalAlpha=on?1:0.9;
      roundRect(px,y-12,Math.max(2,pw),14,2); ctx.fill();
      if(i===CRITS_PER_LINE-1||i===CRITS_PER_LINE*2-1||i===CRITS_PER_LINE*3-1){
        ctx.globalAlpha=0.55; ctx.strokeStyle="#0b0508"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(px+pw+gap*0.5,y-14);
        ctx.lineTo(px+pw+gap*0.5,y+4); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
    /* the plating meter: what your body shots are actually buying you */
    var op=coreOpen(b), sf=op?clamp(b.coreT/1.55,0,1):clamp(b.stagger/STAGGER_MAX,0,1);
    ctx.fillStyle="rgba(0,0,0,0.55)"; roundRect(x,y+8,w,8,4); ctx.fill();
    ctx.fillStyle=op?"#fff2a0":"#7fd4ff";
    if(op){ ctx.shadowColor="#ffe066"; ctx.shadowBlur=12; }
    roundRect(x,y+8,Math.max(2,w*sf),8,4); ctx.fill(); ctx.shadowBlur=0;
  } else {
    var g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,"#ff2a5a"); g.addColorStop(0.6,"#ff7a3a"); g.addColorStop(1,"#ffd24a");
    ctx.fillStyle=g; roundRect(x,y-12,Math.max(3,w*f),14,6); ctx.fill();
    ctx.globalAlpha=0.5; ctx.strokeStyle="#000"; ctx.lineWidth=2;
    for(var k=1;k<3;k++){ var mx=x+w*(k/3);
      ctx.beginPath(); ctx.moveTo(mx,y-12); ctx.lineTo(mx,y+2); ctx.stroke(); }
  }
  ctx.restore();
  txt("THE KAIJU — PHASE "+b.phase,x,y-18,12,"#ffd0d8");
  if(G.arena){
    txt(G.crits+" / "+KAIJU_CRITS+" CRITICAL HITS",x+w,y-18,12,"#ffd0d8","right");
    var lab = coreOpen(b) ? "CORE OPEN — SHOOT THE EYE"
            : (b.stagger>STAGGER_MAX*0.6 ? "PLATING BUCKLING" : "ARMOURED — BREAK THE PLATING");
    txt(lab,x,y+30,11,coreOpen(b)?"#fff2a0":"#8fd0ff");
    txt("RANK "+(G.line+1)+" / "+AR_LINES.length,x+w,y+30,11,"#c8a8ff","right");
  } else {
    txt(Math.max(0,Math.round(b.hp))+" / "+b.maxHp,x+w,y-18,12,"#ffd0d8","right");
  }
}

/* a menu button that registers its own tap target as it draws, so the mouse,
   the touchscreen and the keyboard all end up calling the same function     */
function btn(label,x,y,w,h,col,act,sub,hot){
  ctx.save();
  ctx.fillStyle = hot?"rgba(255,210,122,0.20)":"rgba(10,6,18,0.82)";
  roundRect(x,y,w,h,8); ctx.fill();
  ctx.lineWidth=hot?2.4:1.5; ctx.strokeStyle=col||"#8fa4bd";
  ctx.globalAlpha*=hot?1:0.72; roundRect(x,y,w,h,8); ctx.stroke();
  ctx.restore();
  var ty = sub ? y+h*0.44 : y+h*0.5+7;
  txt(label,x+w*0.5,ty,Math.min(21,h*0.42),col||"#eaf2ff","center");
  if(sub) txt(sub,x+w*0.5,y+h*0.78,11,"#8fa4bd","center");
  if(act) tapZone(x,y,w,h,act);
}
/* ---- THE ARMOURY --------------------------------------------------------
   Drawn with the same dim/title/panel/btn furniture as every other overlay so
   it reads as part of the game rather than a bolted-on store.  Every row is a
   btn(), which means it registers its own tapZone and the keyboard, the mouse
   and a phone all end up in buyItem().                                    */
function screenShop(){
  dim(0.80);
  var i;
  title("ARMOURY",VH*0.13,44,"#ffcf4a");
  txt("trivia gold buys ordnance  ·  spend it before the colonnade",
      VW*0.5,VH*0.13+26,13,"#cfe0f4","center");
  /* the bank, big, because it is the only number that matters in here */
  var bw=560, bx=VW*0.5-bw/2, by=VH*0.22;
  panel(bx,by,bw,52,0.86);
  txt("GOLD",bx+18,by+32,15,"#8fa4bd","left");
  txt(String(G.gold),bx+bw-18,by+36,30,"#ffd27a","right");
  var rowY=VH*0.34, rowH=92, gap=14;
  for(i=0;i<ARMS.length;i++){
    var it=ARMS[i];
    var held=ordHeld(it.id), full=held>=it.cap, poor=G.gold<it.cost;
    var hot=(G.shopIdx===i);
    var y=rowY+i*(rowH+gap);
    var col = full?"#8fa4bd" : (poor?"#ff8a8a" : it.col);
    /* btn() draws the frame and the tap target; the detail is layered on top */
    btn("",bx,y,bw,rowH,col,(function(idx){
      return function(){ G.shopIdx=idx; buyItem(idx); };
    })(i),null,hot);
    txt(it.name,bx+18,y+28,21,col,"left");

    txt(it.note,bx+18,y+68,11,"#8fa4bd","left");
    txt(it.cost+" G",bx+bw-18,y+30,20,poor?"#ff8a8a":"#ffd27a","right");
    txt("HELD "+held+" / "+it.cap,bx+bw-18,y+52,12,full?"#ffcf4a":"#8fa4bd","right");
    if(full)      txt("RACK FULL",bx+bw-18,y+70,11,"#ffcf4a","right");
    else if(poor) txt((it.cost-G.gold)+" SHORT",bx+bw-18,y+70,11,"#ff8a8a","right");
    /* the pip rack: one notch per round carried, so a glance is enough */
    var pw=9, px0=bx+18, py=y+rowH-11;
    for(var k=0;k<it.cap;k++){

      VW*0.5,fy+16,13,"#8fa4bd","center");

      "ENTER / SPACE",false);
  btn("DONE",bx+bw*0.52+6,fy+30,bw*0.48-6,44,"#ffd27a",function(){ closeShop(); },
      "O / ESC / TAP",false);
  txt("UP / DOWN to choose",VW*0.5,fy+92,12,"#8fa4bd","center");

/* ---------- 26. self test --------------------------------------- */
function runSelfTest(){
  var out=[], fail=0;
  /* the interactive tests poke the live simulation, so snapshot anything
     the player can see and put it back afterwards                       */
  var snap={score:G.score,kills:G.kills,shots:G.shots,hits:G.hits,combo:G.combo,
            comboT:G.comboT,maxCombo:G.maxCombo,shake:G.shake,flash:G.flash,
            slowT:G.slowT,toast:G.toast,toastT:G.toastT,ents:ents.length,
            parts:parts.length,pops:pops.length,
            dead:player?player.dead:false,
            pickups:pickups.length,rings:rings.length};
  function t(name,fn){
    var r; try{ r=fn(); }catch(e){ r="threw: "+e.message; }
    var ok = (r===true);
    if(!ok) fail++;
    out.push((ok?"PASS  ":"FAIL  ")+name+(ok?"":"  →  "+r));
  }
  t("project() drops points behind the camera",function(){
    return project(0,0,cam.z-99)===null || "expected null";
  });
  t("threats render above the player's head",function(){
    var pz=player?player.z:0;
    var head=project(player.x,2.35,pz), en=project(player.x,3.2,pz+20);
    if(!head||!en) return "projection failed";
    return en.y < head.y-8 || "enemy y="+en.y.toFixed(1)+" head y="+head.y.toFixed(1);
  });
  t("horizon sits in the upper third",function(){
    var h=horizonY(); return (h>-VH && h<VH*0.42) || "horizon="+h.toFixed(1);
  });
  t("nearer objects project lower on screen",function(){
    var pz=player?player.z:0;
    var a=project(0,1,pz+60), b=project(0,1,pz+12);
    if(!a||!b) return "projection failed";
    return (b.y>a.y) || "near="+b.y.toFixed(1)+" far="+a.y.toFixed(1);
  });
  t("every sheet has at least one live frame",function(){
    for(var k in SHEETS){ var d=SHEETS[k];
      if(d.img && d.frames && (!d.live||!d.live.length)) return k+" has none"; }
    return true;
  });
  t("5 sectors + 1 bonus stage, last one is the boss",function(){
    if(LEVELS[LEVELS.length-1].boss!==true) return "last level is not the boss";
    if(sectorCount()!==5) return "sectors="+sectorCount();
    var b=0; for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].bonus) b++;
    if(b!==1) return "bonus stages="+b;
    if(!LEVELS[endlessIdx()] || LEVELS[endlessIdx()].bonus || LEVELS[endlessIdx()].boss)
      return "endlessIdx points at a bonus/boss level";
    return true;
  });
  t("the bonus stage does not inflate the difficulty tier",function(){
    /* tier() drives enemy bullet speed and fire rate.  If it counted ROVER RUN
       the three sectors after it would silently get harder.  G.lvIdx is live
       state, so the restore sits in a finally and cannot be skipped.       */
    var was=G.lvIdx;
    try{
      for(var i=0;i<LEVELS.length;i++){
        G.lvIdx=i;
        var expect=0;
        for(var j=0;j<i;j++) if(!LEVELS[j].bonus) expect++;
        if(tier()!==expect) return "lvIdx "+i+" → tier "+tier()+", expected "+expect;
      }
      /* CRYO BASIN is the 3rd numbered sector, so its tier must be 2 even
         though it sits at LEVELS[3]                                        */
      var ci=-1;
      for(var k=0;k<LEVELS.length;k++) if(LEVELS[k].name==="CRYO BASIN") ci=k;
      if(ci<0) return "CRYO BASIN not found";
      G.lvIdx=ci; var ct=tier();
      return ct===2 || "CRYO BASIN tier="+ct+" expected 2";
    } finally { G.lvIdx=was; }
  });
  t("the bonus stage mounts and dismounts cleanly",function(){
    /* named rs, not snap, so it cannot shadow the outer rollback snapshot */
    var rs={riding:player.riding,h:player.h,r:player.r,ram:player.ram,
            mj:player.maxJumps,cr:G.crushes,sh:player.shield,hp:player.hp,
            dead:player.dead,lives:G.lives,state:G.state};
    player.shield=0; player.dead=false; player.hp=100;
    mountRover();
    var okUp = player.riding===true && player.r>1.2 && player.maxJumps===1;
    /* mounted, a body-check must not cost HP */
    player.inv=0; hurtPlayer(40,"drone");
    var okImmune = player.hp===100;
    /* …but a rock still can, and so must enemy fire */
    player.inv=0; hurtPlayer(10,"rock");
    var okRock = player.hp<100;
    player.hp=100; player.inv=0; hurtPlayer(8,"shot");
    var okShot = player.hp<100;
    dismountRover();
    var okDown = player.riding===false && player.maxJumps===2 && player.r===1.05;
    player.riding=rs.riding; player.h=rs.h; player.r=rs.r;
    player.ram=rs.ram; player.maxJumps=rs.mj; G.crushes=rs.cr;
    player.shield=rs.sh; player.hp=rs.hp; player.dead=rs.dead;
    G.lives=rs.lives; G.state=rs.state; player.inv=0; player.hurtT=0;
    return (okUp&&okImmune&&okRock&&okShot&&okDown) ||
           ("mount="+okUp+" immune="+okImmune+" rock="+okRock+
            " shot="+okShot+" dismount="+okDown);
  });
  t("the rover stows the blaster only with the blade down",function(){
    /* both paws are on the wheel while ploughing, so the gun has to go away —
       and it has to come straight back, or the sector after this one is
       unwinnable.  gunOut() is what drawPlayer and updateFiring both read.  */
    var p=player, rs={ride:p.riding,ram:p.ram};
    p.riding=true;  p.ram=0.9;  var stowed=!gunOut(p);
    p.ram=0;        var drawn =gunOut(p);
    p.riding=false; p.ram=0.9;  var onFoot=gunOut(p);
    p.riding=rs.ride; p.ram=rs.ram;
    return (stowed&&drawn&&onFoot) ||
           ("bladeDown="+stowed+" bladeUp="+drawn+" sliding="+onFoot);
  });
  t("the blaster is drawn in the paw, not on the chest",function(){
    /* the whole point of pawAnchor(): the grip must land inside the drawn
       sprite's box, low and to his right — never up at shoulder height.    */
    var p=player, rs={ride:p.riding,y:p.y,sl:p.sliding,jet:p.jet,dead:p.dead,
                      grip:G.gripIdx};
    p.riding=false; p.sliding=0; p.jet=0; p.dead=false;
    G.gripIdx=0;                        /* the shipped grip, not a cycled one */
    var pt=project(p.x,p.y+p.h*0.5,p.z);
    if(!pt){ G.gripIdx=rs.grip; return "player not projectable"; }
    var hpx=p.h*pt.s, F=blasterFrame(p,hpx);
    p.riding=rs.ride; p.y=rs.y; p.sliding=rs.sl; p.jet=rs.jet; p.dead=rs.dead;
    G.gripIdx=rs.grip;
    if(!F) return "no blaster frame";
    var dx=(F.gx-F.cx)/hpx, dy=(F.gy-F.cy)/hpx;
    if(dx<0.10||dx>0.45) return "paw x offset "+dx.toFixed(3)+" body-heights";
    if(dy< -0.02||dy>0.30) return "paw y offset "+dy.toFixed(3)+" (negative = chest/shoulder)";
    return true;
  });
  t("every ruin has an answer the controls can reach",function(){
    /* An obstacle course is only fair if each shape is beatable by exactly one
       control, and the numbers say so rather than the comments.  JUMP_V and
       GRAV give the apex; the slide profile gives the duck height.          */
    var apex=(JUMP_V*JUMP_V)/(2*GRAV);
    /* the two body profiles updatePlayer() sets: 2.35 standing, 2.35-1.25
       while sliding.  Mirrored here so a change to either shows up as a red
       test rather than as an obstacle nobody can get past.                 */
    var standH=2.35, slideH=2.35-1.25;
    var rs=ents.length, made=[], bad=null;
    try{
